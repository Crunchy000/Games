<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vector Front</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  canvas { display:block; touch-action:none; filter:contrast(1.12) brightness(1.08) saturate(1.1); }
  /* ---------- remote-camera / TV static overlay ---------- */
  .fx { position:fixed; inset:0; pointer-events:none; }
  #noise { opacity:.13; mix-blend-mode:screen; background-size:160px 160px; animation:grain .32s steps(1) infinite; }
  #noise.burst { opacity:.85; animation-duration:.12s; }
  @keyframes grain { 0%{background-position:0 0} 20%{background-position:-47px 31px} 40%{background-position:63px -18px}
                     60%{background-position:-22px -71px} 80%{background-position:88px 54px} 100%{background-position:0 0} }
  #scan { background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.32) 2px 3px); animation:flick 4.7s infinite; }
  @keyframes flick { 0%,100%{opacity:.9} 47%{opacity:.9} 48%{opacity:.6} 49%{opacity:1} 50%{opacity:.75} 51%{opacity:.9} 83%{opacity:.85} 84%{opacity:.6} 85%{opacity:.9} }
  #roll { background:linear-gradient(to bottom, rgba(180,255,200,0) 0%, rgba(180,255,200,.07) 45%, rgba(220,255,230,.11) 50%, rgba(180,255,200,.07) 55%, rgba(180,255,200,0) 100%);
          height:22vh; inset:auto 0 auto 0; top:-25vh; animation:roll 7s linear infinite; }
  @keyframes roll { 0%{transform:translateY(0)} 100%{transform:translateY(150vh)} }
  #vig { background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.9) 100%); box-shadow:inset 0 0 60px rgba(0,0,0,.8); }
  #glitch { opacity:0; background:repeating-linear-gradient(to bottom, rgba(220,255,230,.18) 0 1px, transparent 1px 7px); }
  #glitch.on { opacity:1; animation:tear .18s steps(2) infinite; }
  @keyframes tear { 0%{transform:translateX(-6px) skewX(-3deg)} 50%{transform:translateX(5px) skewX(2deg)} 100%{transform:translateX(-2px)} }
  #osd { font:600 11px/1.3 ui-monospace,Menlo,monospace; color:#d8ffe4; text-shadow:0 0 4px rgba(120,255,160,.8), 1px 0 0 rgba(255,60,60,.5), -1px 0 0 rgba(60,160,255,.5);
         letter-spacing:.08em; opacity:.85; }
  #osd .bl { position:absolute; left:14px; bottom:12px; } #osd .br { position:absolute; right:14px; bottom:12px; text-align:right; }
  #rec { color:#ff4b3e; animation:blink 1s steps(1) infinite; } @keyframes blink { 50%{opacity:0} }
  .corner { position:absolute; width:22px; height:22px; border:2px solid rgba(216,255,228,.55); }
  .tl{top:60px;left:10px;border-right:0;border-bottom:0} .tr{top:60px;right:10px;border-left:0;border-bottom:0}
  .lb{bottom:38px;left:10px;border-right:0;border-top:0} .rb{bottom:38px;right:10px;border-left:0;border-top:0}
  @media (prefers-reduced-motion: reduce) { #noise, #scan, #roll, #rec, #glitch.on { animation:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="fx" id="noise"></div>
<div class="fx" id="scan"></div>
<div class="fx" id="roll"></div>
<div class="fx" id="glitch"></div>
<div class="fx" id="vig"></div>
<div class="fx" id="osd">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner lb"></div><div class="corner rb"></div>
  <div class="bl"><span id="rec">● REC</span> &nbsp;CAM-07 · REMOTE UNIT<br><span id="sig">SIGNAL ▮▮▮▮▯</span></div>
  <div class="br"><span id="clock">00:00:00</span><br><span id="coord">GRID 000.0 / 000.0</span></div>
</div>
<script>
(() => {
'use strict';
const GREEN = '#45ff7d', RED = '#ff4b3e', S = 240, FAR = 95, NEAR = 0.3, CAMH = 1.25, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 360, H = 640, F = 300, HOR = 320, HALF = .6, dpr = 1, CY = 1, SY = 0;
let hi = 0; try { hi = +localStorage.getItem('vectorfront-hi') || 0; } catch (e) {}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  F = (W / 2) / Math.tan(W > H ? .62 : .55); HALF = Math.atan((W / 2) / F); HOR = H * .52;
}
addEventListener('resize', resize); resize();

const wrap = d => ((d + S / 2) % S + S) % S - S / 2;
const mod = v => (v % S + S) % S;
const wa = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- wireframe models (local: x right, y up, z forward) ---------- */
function prism(b, t) {
  const [x0, z0, x1, z1, y0] = b, [X0, Z0, X1, Z1, y1] = t;
  return { v: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [X0, y1, Z0], [X1, y1, Z0], [X1, y1, Z1], [X0, y1, Z1]],
           e: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]] };
}
const box = (x0, y0, z0, x1, y1, z1) => prism([x0, z0, x1, z1, y0], [x0, z0, x1, z1, y1]);
function merge(...ms) { const v = [], e = []; for (const m of ms) { const o = v.length; v.push(...m.v); m.e.forEach(([a, b]) => e.push([a + o, b + o])); } return { v, e }; }
const TANK = merge(
  prism([-1.2, -1.8, 1.2, 1.8, 0], [-1, -1.5, 1, 1.25, .7]),
  prism([-.65, -.9, .65, .5, .7], [-.45, -.7, .45, .3, 1.2]),
  box(-.08, .86, .35, .08, 1.0, 2.7),
  { v: [[.3, 1.2, -.5], [.3, 1.95, -.5], [.1, 1.95, -.5], [.5, 1.95, -.5]], e: [[0, 1], [2, 3]] });
const HUNTER = merge(
  prism([-1.1, -2, 1.1, 1.9, .05], [-.45, -1.6, .45, .2, .85]),
  box(-.58, .35, 0, -.44, .48, 2.4), box(.44, .35, 0, .58, .48, 2.4),
  { v: [[0, .85, -1.5], [0, 1.45, -2.1], [0, .85, -.7]], e: [[0, 1], [1, 2]] });
const PYR = { v: [[-1.5, 0, -1.5], [1.5, 0, -1.5], [1.5, 0, 1.5], [-1.5, 0, 1.5], [0, 3, 0]], e: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [1, 4], [2, 4], [3, 4]] };
const CUBE = box(-1.2, 0, -1.2, 1.2, 2.4, 1.2);
const SLAB = prism([-.9, -.9, .9, .9, 0], [-.6, -.6, .6, .6, 4.2]);
const SHELL = { v: [[.22, 0, 0], [0, 0, .4], [-.22, 0, 0], [0, 0, -.4], [0, .22, 0], [0, -.22, 0]],
                e: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [1, 4], [2, 4], [3, 4], [0, 5], [1, 5], [2, 5], [3, 5]] };
const OBS = [{ m: CUBE, r: 1.7 }, { m: PYR, r: 1.9 }, { m: SLAB, r: 1.3 }];

/* ---------- world ---------- */
let obstacles = [], dots = [];
const mtn = [];
for (let i = 0; i < 120; i++) {
  const a = i / 120 * TAU;
  mtn.push({ a, h: Math.max(4, 18 + 12 * Math.sin(a * 3 + 1) + 8 * Math.sin(a * 7 + 2) + 5 * Math.sin(a * 13) + rnd(-4, 4)) });
}
[[20, 62], [19, 40], [21, 42], [75, 50], [74, 34], [76, 30], [101, 38]].forEach(([i, h]) => mtn[i].h = h);

function makeWorld() {
  obstacles = []; let tries = 0;
  while (obstacles.length < 46 && tries++ < 3000) {
    const x = rnd(0, S), z = rnd(0, S);
    if (Math.hypot(wrap(x), wrap(z)) < 14) continue;
    if (obstacles.some(o => Math.hypot(wrap(o.x - x), wrap(o.z - z)) < 9)) continue;
    const k = OBS[Math.floor(Math.random() * 3)], s = rnd(.9, 1.6);
    obstacles.push({ x, z, m: k.m, r: k.r * s, s, h: rnd(0, TAU) });
  }
  dots = Array.from({ length: 240 }, () => ({ x: rnd(0, S), z: rnd(0, S) }));
}
const blocked = (x, z, r) => obstacles.some(o => Math.hypot(wrap(o.x - x), wrap(o.z - z)) < o.r + r);

/* ---------- state ---------- */
let state = 'title', score = 0, lives = 3, nextLife = 25000, P, enemies = [], shells = [], debris = [];
let spawnT = 0, deadT = 0, overT = 0, shake = 0, flash = 0, hitFlash = 0, time = 0, cracks = [], toast = null;
P = { x: 0, z: 0, h: 0, v: 0, turn: 0, dead: false, cool: 0 };
makeWorld();

function startGame() {
  makeWorld(); P = { x: 0, z: 0, h: 0, v: 0, turn: 0, dead: false, cool: 0 };
  enemies = []; shells = []; debris = []; score = 0; lives = 3; nextLife = 25000; spawnT = 1.5; state = 'play'; toast = null; burst(.6);
  beep(220, .25, 'square', .04, 220);
}

/* ---------- audio ---------- */
let ac = null, eng = null, eg = null, nb = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    eng = ac.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 40;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
    eg = ac.createGain(); eg.gain.value = 0;
    eng.connect(lp); lp.connect(eg); eg.connect(ac.destination); eng.start();
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function beep(f, d, type = 'square', vol = .04, slide = 0) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
function noise(d, vol, freq) {
  if (!ac || !nb) return;
  try {
    const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + d);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!ac) return; document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- input: drag = drive & turn, tap = fire ---------- */
const ptrs = new Map(), LEASH = 55, DEAD = 12, K = { left: 0, right: 0, up: 0, down: 0, fire: 0 };
let stick = null, fireBuf = 0;
const canStart = () => state === 'title' || (state === 'over' && overT > 1);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  audioInit();
  const q = { sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false, start: false };
  if (canStart()) { startGame(); q.start = true; }
  ptrs.set(e.pointerId, q);
});
cv.addEventListener('pointermove', e => {
  const q = ptrs.get(e.pointerId); if (!q || q.start) return;
  if (!q.moved && Math.hypot(e.clientX - q.sx, e.clientY - q.sy) > DEAD) {
    q.moved = true; if (!stick) stick = { id: e.pointerId, ax: q.sx, ay: q.sy, x: q.sx, y: q.sy, tx: 0, ty: 0 };
  }
  if (stick && stick.id === e.pointerId) {
    stick.x = e.clientX; stick.y = e.clientY;
    const dx = stick.x - stick.ax, dy = stick.y - stick.ay, d = Math.hypot(dx, dy);
    if (d > LEASH) { stick.ax = stick.x - dx / d * LEASH; stick.ay = stick.y - dy / d * LEASH; }   // floating anchor
    const dz = v => Math.abs(v) < .18 ? 0 : v;
    stick.tx = dz(clamp((stick.x - stick.ax) / LEASH, -1, 1));
    stick.ty = dz(clamp(-(stick.y - stick.ay) / LEASH, -1, 1));
  }
});
function endPtr(e) {
  const q = ptrs.get(e.pointerId); if (!q) return; ptrs.delete(e.pointerId);
  if (stick && stick.id === e.pointerId) stick = null;
  else if (!q.moved && !q.start && e.type === 'pointerup' && performance.now() - q.t < 300 && state === 'play') fireBuf = .2;
}
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, endPtr));
cv.addEventListener('contextmenu', e => e.preventDefault());
const KM = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ' ': 'fire' };
addEventListener('keydown', e => {
  audioInit();
  if (canStart() && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); startGame(); return; }
  const k = KM[e.key]; if (k) { e.preventDefault(); K[k] = 1; }
});
addEventListener('keyup', e => { const k = KM[e.key]; if (k) K[k] = 0; });
addEventListener('blur', () => { for (const k in K) K[k] = 0; stick = null; ptrs.clear(); });

/* ---------- gameplay ---------- */
function spawnEnemy() {
  const hunter = score >= 4000 && Math.random() < .35;
  for (let i = 0; i < 40; i++) {
    const a = rnd(0, TAU), d = rnd(42, 60), x = mod(P.x + Math.sin(a) * d), z = mod(P.z + Math.cos(a) * d);
    if (blocked(x, z, 2.5)) continue;
    enemies.push({ x, z, h: rnd(0, TAU), type: hunter ? 'h' : 't', m: hunter ? HUNTER : TANK, spd: hunter ? 8.5 : 4.2, turn: hunter ? 1.8 : .9,
                   keep: hunter ? 0 : 16, cool: rnd(2.5, 4), mode: 'hunt', t: rnd(3, 6), wh: 0 });
    beep(880, .12, 'square', .03); beep(660, .12, 'square', .02);
    return;
  }
}
function explode(m, ox, oz, h, s, oy = 0, n = 1) {
  const ch = Math.cos(h), sh = Math.sin(h);
  const tr = ([lx, ly, lz]) => [(lx * ch + lz * sh) * s, oy + ly * s, (-lx * sh + lz * ch) * s];
  for (const [a, b] of m.e) {
    const A = tr(m.v[a]), B = tr(m.v[b]), mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, mz = (A[2] + B[2]) / 2;
    const d = Math.hypot(mx, mz) || 1, sp = rnd(3, 9) * n;
    debris.push({ x: ox + mx, y: my, z: oz + mz, hx: (B[0] - A[0]) / 2, hy: (B[1] - A[1]) / 2, hz: (B[2] - A[2]) / 2,
                  vx: mx / d * sp + rnd(-2, 2), vy: rnd(4, 11) * n, vz: mz / d * sp + rnd(-2, 2), spin: rnd(-7, 7), life: rnd(1.4, 2.4) });
  }
}
function fireShell(mine, x, z, h, y) {
  const sp = mine ? 48 : 26, jitter = mine ? 0 : rnd(-.03, .03);
  shells.push({ mine, x: mod(x + Math.sin(h) * (mine ? 1.5 : 2.8)), z: mod(z + Math.cos(h) * (mine ? 1.5 : 2.8)), y,
                vx: Math.sin(h + jitter) * sp, vz: Math.cos(h + jitter) * sp, life: mine ? 1.6 : 2.6 });
}
function kill(e) {
  e.dead = true; score += e.type === 'h' ? 3000 : 1000;
  explode(e.m, e.x, e.z, e.h, 1); noise(1.3, .35, 900); beep(90, .6, 'sawtooth', .05, -50); shake = 5; spawnT = Math.min(spawnT, 2); burst(.15);
  if (score >= nextLife) { lives++; nextLife += 25000; toast = { t: 'BONUS TANK', life: 2.2 }; beep(660, .4, 'triangle', .06, 660); }
}
function die() {
  if (P.dead) return;
  P.dead = true; deadT = 2.8; lives--; P.v = 0; shake = 12; hitFlash = .5; burst(2.8);
  noise(1.8, .45, 1400); beep(70, 1, 'sawtooth', .06, -30);
  const cx = W / 2 + rnd(-W * .15, W * .15), cyy = H / 2 + rnd(-H * .1, H * .1), L = Math.hypot(W, H);
  cracks = [];
  for (let i = 0; i < 11; i++) {
    let a = i / 11 * TAU + rnd(-.2, .2), x = cx, y = cyy; const pts = [[x, y]];
    for (let j = 0; j < 7; j++) { a += rnd(-.35, .35); const st = L / 10 * rnd(.6, 1.4); x += Math.cos(a) * st; y += Math.sin(a) * st; pts.push([x, y]); }
    cracks.push(pts);
  }
  for (let r = 1; r <= 2; r++) {
    const pts = [], rad = 40 * r * rnd(.8, 1.2);
    for (let k = 0; k <= 14; k++) { const a = k / 14 * TAU; pts.push([cx + Math.cos(a) * rad * rnd(.85, 1.15), cyy + Math.sin(a) * rad * rnd(.85, 1.15)]); }
    cracks.push(pts);
  }
}
function respawn() {
  P.dead = false; P.v = 0; shells = []; cracks = []; burst(.5);
  for (const e of enemies) {
    for (let i = 0; i < 30; i++) {
      const a = rnd(0, TAU), x = mod(P.x + Math.sin(a) * 50), z = mod(P.z + Math.cos(a) * 50);
      if (!blocked(x, z, 2.5)) { e.x = x; e.z = z; break; }
    }
    e.cool = rnd(3, 4.5);
  }
}

function update(dt) {
  time += dt; shake *= Math.pow(.03, dt); flash = Math.max(0, flash - dt); hitFlash = Math.max(0, hitFlash - dt);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  for (const d of debris) {
    d.vy -= 16 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    if (d.y < 0) { d.y = 0; d.vy *= -.3; d.vx *= .6; d.vz *= .6; d.spin *= .6; }
    const c = Math.cos(d.spin * dt), s = Math.sin(d.spin * dt), hx = d.hx * c - d.hz * s; d.hz = d.hx * s + d.hz * c; d.hx = hx;
    d.life -= dt;
  }
  debris = debris.filter(d => d.life > 0);

  if (ac && eg) {
    const on = state === 'play' && !P.dead, t = ac.currentTime;
    eg.gain.setTargetAtTime(on ? .022 + .02 * Math.abs(P.v) / 9 + .008 * Math.abs(P.turn) : 0, t, .12);
    eng.frequency.setTargetAtTime(38 + Math.abs(P.v) * 3.2 + Math.abs(P.turn) * 7, t, .12);
  }
  if (state === 'title') { P.h = wa(P.h + dt * .12); return; }
  if (state === 'over') { overT += dt; return; }

  updateShells(dt);
  if (P.dead) {
    deadT -= dt;
    if (deadT <= 0) {
      if (lives <= 0) { state = 'over'; overT = 0; if (score > hi) { hi = score; try { localStorage.setItem('vectorfront-hi', hi); } catch (e) {} } }
      else respawn();
    }
    return;
  }

  // player
  const tIn = stick ? stick.tx : K.right - K.left, thr = stick ? stick.ty : K.up - K.down;
  P.turn = tIn; P.h = wa(P.h + tIn * 1.6 * dt);
  const tgt = thr > 0 ? thr * 9 : thr * 5.5;
  P.v += clamp(tgt - P.v, -14 * dt, 14 * dt);
  const nx = mod(P.x + Math.sin(P.h) * P.v * dt), nz = mod(P.z + Math.cos(P.h) * P.v * dt);
  const hitTank = enemies.some(e => Math.hypot(wrap(e.x - nx), wrap(e.z - nz)) < 3);
  if (blocked(nx, nz, 1.3) || hitTank) { if (Math.abs(P.v) > 2.5) { noise(.25, .2, 400); shake = 4; burst(.12); } P.v = 0; }
  else { P.x = nx; P.z = nz; }
  P.cool -= dt; fireBuf -= dt;
  if ((K.fire || fireBuf > 0) && P.cool <= 0 && !shells.some(s => s.mine)) {
    fireBuf = 0; P.cool = .35; flash = .08; fireShell(true, P.x, P.z, P.h, 1.0); glitchT = Math.max(glitchT, .06); noise(.4, .22, 2400); beep(160, .15, 'square', .03, -100);
  }

  // enemies
  for (const e of enemies) {
    const dx = wrap(P.x - e.x), dz = wrap(P.z - e.z), d = Math.hypot(dx, dz);
    e.cool -= dt; e.t -= dt;
    let want;
    if (e.mode === 'wander') { want = e.wh; if (e.t <= 0) { e.mode = 'hunt'; e.t = rnd(4, 8); } }
    else {
      want = Math.atan2(dx, dz);
      if (e.t <= 0) { if (e.type === 't') { e.mode = 'wander'; e.wh = rnd(0, TAU); e.t = rnd(1.5, 3); } else e.t = 5; }
    }
    const diff = wa(want - e.h);
    e.h = wa(e.h + clamp(diff, -e.turn * dt, e.turn * dt));
    let mv = 0;
    if (e.mode === 'wander') mv = e.spd * .7;
    else if (d > e.keep && Math.abs(diff) < .6) mv = e.spd;
    else if (d < e.keep * .6) mv = -e.spd * .5;
    if (mv) {
      const ex = mod(e.x + Math.sin(e.h) * mv * dt), ez = mod(e.z + Math.cos(e.h) * mv * dt);
      if (!blocked(ex, ez, 1.6)) { e.x = ex; e.z = ez; }
      else { e.mode = 'wander'; e.wh = e.h + (Math.random() < .5 ? 1 : -1) * rnd(1, 2); e.t = rnd(1, 2); }
    }
    if (e.mode === 'hunt' && Math.abs(diff) < .06 && e.cool <= 0 && d < 55) {
      fireShell(false, e.x, e.z, e.h, 1.0); noise(.35, .12, 1500);
      e.cool = e.type === 'h' ? 4 : 3.6 - Math.min(1.6, score / 20000);
    }
    if (e.type === 'h' && d < 2.9) { e.dead = true; explode(e.m, e.x, e.z, e.h, 1); die(); }
  }
  enemies = enemies.filter(e => !e.dead);

  spawnT -= dt;
  const wanted = Math.min(3, 1 + Math.floor(score / 7000));
  if (enemies.length < wanted && spawnT <= 0) { spawnEnemy(); spawnT = 4; }
}
function updateShells(dt) {
  for (const s of shells) {
    s.x = mod(s.x + s.vx * dt); s.z = mod(s.z + s.vz * dt); s.life -= dt;
    if (blocked(s.x, s.z, .2)) { s.life = 0; explode(SHELL, s.x, s.z, 0, 1, s.y, .5); noise(.2, .12, 1200); continue; }
    if (s.mine) { for (const e of enemies) if (!e.dead && Math.hypot(wrap(e.x - s.x), wrap(e.z - s.z)) < 1.9) { kill(e); s.life = 0; break; } }
    else if (!P.dead && Math.hypot(wrap(P.x - s.x), wrap(P.z - s.z)) < 1.4) { s.life = 0; die(); }
  }
  shells = shells.filter(s => s.life > 0);
  enemies = enemies.filter(e => !e.dead);
}

/* ---------- rendering ---------- */
function seg(a, b) {
  let [x1, y1, z1] = a, [x2, y2, z2] = b;
  if (z1 < NEAR && z2 < NEAR) return;
  if (z1 < NEAR) { const t = (NEAR - z1) / (z2 - z1); x1 += (x2 - x1) * t; y1 += (y2 - y1) * t; z1 = NEAR; }
  else if (z2 < NEAR) { const t = (NEAR - z2) / (z1 - z2); x2 += (x1 - x2) * t; y2 += (y1 - y2) * t; z2 = NEAR; }
  ctx.moveTo(W / 2 + x1 / z1 * F, HOR - y1 / z1 * F); ctx.lineTo(W / 2 + x2 / z2 * F, HOR - y2 / z2 * F);
}
const cam = (rx, y, rz) => [rx * CY - rz * SY, y - CAMH, rx * SY + rz * CY];
function stroke(col, al) {
  ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalAlpha = al * .22; ctx.lineWidth = 4.5; ctx.stroke();
  ctx.globalAlpha = al; ctx.lineWidth = 1.4; ctx.stroke(); ctx.globalAlpha = 1;
}
function drawModel(m, ox, oy, oz, h, s, col) {
  const rx = wrap(ox - P.x), rz = wrap(oz - P.z), zc = rx * SY + rz * CY;
  if (zc < -5 * s || zc > FAR) return;
  const xc = rx * CY - rz * SY; if (zc > 0 && Math.abs(xc) > zc * (W / 2) / F + 5 * s) return;
  const ch = Math.cos(h), sh = Math.sin(h);
  const pts = m.v.map(([lx, ly, lz]) => cam(rx + (lx * ch + lz * sh) * s, oy + ly * s, rz + (-lx * sh + lz * ch) * s));
  ctx.beginPath(); for (const [a, b] of m.e) seg(pts[a], pts[b]);
  stroke(col, Math.max(.18, Math.min(1, 1.15 - zc / FAR)));
}
function drawSky() {
  ctx.beginPath(); ctx.moveTo(0, HOR); ctx.lineTo(W, HOR); stroke(GREEN, .85);
  const k = F / 500; ctx.beginPath(); let prev = false;
  for (let i = 0; i <= mtn.length; i++) {
    const m = mtn[i % mtn.length], rel = wa(m.a - P.h);
    if (Math.abs(rel) < HALF + .25) { const x = W / 2 + Math.tan(rel) * F, y = HOR - m.h * k; prev ? ctx.lineTo(x, y) : ctx.moveTo(x, y); prev = true; }
    else prev = false;
  }
  stroke(GREEN, .7);
  const mr = wa(2.2 - P.h);
  if (Math.abs(mr) < HALF + .2) {
    const x = W / 2 + Math.tan(mr) * F, y = HOR - 110 * k, r = 16 * k;
    ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, Math.PI / 2); ctx.ellipse(x, y, r * .45, r, 0, Math.PI / 2, -Math.PI / 2, true); stroke(GREEN, .8);
  }
  ctx.fillStyle = GREEN;
  for (let i = 0; i < 30; i++) {
    const a = i * 2.39996, rel = wa(a - P.h); if (Math.abs(rel) > HALF) continue;
    ctx.globalAlpha = .25 + .2 * Math.sin(time * 1.5 + i); ctx.fillRect(W / 2 + Math.tan(rel) * F, HOR - (60 + (i * 53) % 140) * k - 40 * k, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
}
function drawGround() {
  ctx.fillStyle = GREEN; ctx.globalAlpha = .35;
  for (const d of dots) {
    const rx = wrap(d.x - P.x), rz = wrap(d.z - P.z), zc = rx * SY + rz * CY;
    if (zc < 1.5 || zc > 70) continue;
    const sx = W / 2 + (rx * CY - rz * SY) / zc * F; if (sx < 0 || sx > W) continue;
    ctx.fillRect(sx, HOR + CAMH / zc * F, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
}
function drawDebris() {
  ctx.beginPath();
  for (const d of debris) {
    const rx = wrap(d.x - P.x), rz = wrap(d.z - P.z);
    seg(cam(rx - d.hx, d.y - d.hy, rz - d.hz), cam(rx + d.hx, d.y + d.hy, rz + d.hz));
  }
  stroke(GREEN, .95);
}
function drawRadar() {
  const x0 = W / 2, y0 = 56, R = 38, RR = 70;
  ctx.beginPath(); ctx.arc(x0, y0, R, 0, TAU); ctx.moveTo(x0, y0 - R - 5); ctx.lineTo(x0, y0 - R + 4);
  ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.sin(-HALF) * R, y0 - Math.cos(HALF) * R); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.sin(HALF) * R, y0 - Math.cos(HALF) * R);
  stroke(RED, .7);
  const sw = time * 2.6; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.sin(sw) * R, y0 - Math.cos(sw) * R); stroke(RED, .9);
  ctx.fillStyle = RED;
  let inRange = false, nearest = null;
  for (const e of enemies) {
    const dx = wrap(e.x - P.x), dz = wrap(e.z - P.z), d = Math.hypot(dx, dz);
    if (!nearest || d < nearest.d) nearest = { d, rel: wa(Math.atan2(dx, dz) - P.h) };
    if (d > RR) continue; inRange = true;
    const xc = dx * CY - dz * SY, zc = dx * SY + dz * CY;
    ctx.globalAlpha = .6 + .4 * Math.sin(time * 9); ctx.fillRect(x0 + xc / RR * R - 2, y0 - zc / RR * R - 2, 4, 4);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.font = '600 12px ui-monospace,Menlo,monospace';
  if (state === 'play' && !P.dead) {
    if (inRange) ctx.fillText('ENEMY IN RANGE', x0, y0 + R + 18);
    if (nearest && Math.abs(nearest.rel) > HALF && Math.sin(time * 8) > -.3)
      ctx.fillText(Math.abs(nearest.rel) > 2.3 ? 'ENEMY TO REAR' : nearest.rel > 0 ? 'ENEMY TO RIGHT ▶' : '◀ ENEMY TO LEFT', x0, y0 + R + 34);
  }
}
function drawSight() {
  let aimed = false;
  for (const e of enemies) { const dx = wrap(e.x - P.x), dz = wrap(e.z - P.z), zc = dx * SY + dz * CY; if (zc > 0 && zc < 75 && Math.abs(dx * CY - dz * SY) < 1.6) aimed = true; }
  const x = W / 2, y = HOR, g = 12, l = 26, b = 18;
  ctx.beginPath();
  ctx.moveTo(x, y - g - l); ctx.lineTo(x, y - g); ctx.moveTo(x, y + g); ctx.lineTo(x, y + g + l);
  ctx.moveTo(x - b, y - g - l + 6); ctx.lineTo(x - b, y - g - l); ctx.lineTo(x + b, y - g - l); ctx.lineTo(x + b, y - g - l + 6);
  ctx.moveTo(x - b, y + g + l - 6); ctx.lineTo(x - b, y + g + l); ctx.lineTo(x + b, y + g + l); ctx.lineTo(x + b, y + g + l - 6);
  stroke(aimed ? RED : GREEN, .9);
}
function drawHUD() {
  ctx.font = '600 13px ui-monospace,Menlo,monospace'; ctx.fillStyle = RED; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 14, 26); ctx.fillText('HIGH  ' + Math.max(hi, score), 14, 44);
  ctx.textAlign = 'right'; ctx.fillText('TANKS', W - 14, 26);
  ctx.beginPath();
  for (let i = 0; i < Math.min(lives, 6); i++) {
    const x = W - 22 - i * 22, y = 44;
    ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.lineTo(x + 6, y - 5); ctx.lineTo(x - 6, y - 5); ctx.closePath();
    ctx.moveTo(x - 3, y - 5); ctx.lineTo(x - 2, y - 9); ctx.lineTo(x + 3, y - 9); ctx.lineTo(x + 3, y - 5); ctx.moveTo(x + 3, y - 7); ctx.lineTo(x + 9, y - 7);
  }
  stroke(RED, .9);
  if (toast) { ctx.fillStyle = GREEN; ctx.textAlign = 'center'; ctx.font = '700 18px ui-monospace,Menlo,monospace'; ctx.fillText(toast.t, W / 2, HOR - 90); }
  if (stick) {
    ctx.beginPath(); ctx.arc(stick.ax, stick.ay, LEASH, 0, TAU); stroke(GREEN, .18);
    ctx.fillStyle = GREEN; ctx.globalAlpha = .3; ctx.beginPath(); ctx.arc(stick.ax + stick.tx * LEASH, stick.ay - stick.ty * LEASH, 14, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  }
}
function overlay(lines) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
  let y = H * .3;
  for (const [t, size, col] of lines) {
    ctx.font = `700 ${size}px ui-monospace,Menlo,monospace`; ctx.fillStyle = col;
    if (size > 24) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.fillText(t, W / 2, y); ctx.shadowBlur = 0; y += size + 14;
  }
}
function draw() {
  CY = Math.cos(P.h); SY = Math.sin(P.h);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); if (shake > .3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawSky(); drawGround();
  for (const o of obstacles) drawModel(o.m, o.x, 0, o.z, o.h, o.s, GREEN);
  for (const e of enemies) drawModel(e.m, e.x, 0, e.z, e.h, 1, GREEN);
  for (const s of shells) drawModel(SHELL, s.x, s.y, s.z, time * 9, 1, s.mine ? GREEN : RED);
  drawDebris();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = GREEN; ctx.globalAlpha = flash * 1.5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === 'play' && !P.dead) drawSight();
  if (state !== 'title') { drawRadar(); drawHUD(); }
  if (P.dead || (state === 'over' && cracks.length)) {
    if (hitFlash > 0) { ctx.fillStyle = RED; ctx.globalAlpha = hitFlash * .6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    ctx.beginPath(); for (const c of cracks) { ctx.moveTo(c[0][0], c[0][1]); for (let i = 1; i < c.length; i++) ctx.lineTo(c[i][0], c[i][1]); }
    stroke('#e8fff0', .85);
  }
  if (state === 'title') overlay([
    ['VECTOR FRONT', Math.min(40, W / 9), GREEN], ['A wireframe tank battle', 14, '#bfffd2'], ['', 4, GREEN],
    ['Drag anywhere to drive & turn', 14, '#bfffd2'], ['Tap to fire', 14, '#bfffd2'], ['Keys: arrows / WASD + space', 12, '#7fbf92'], ['', 4, GREEN],
    ['TAP TO START', 16, RED], ['Best ' + hi, 12, '#7fbf92']]);
  if (state === 'over') overlay([['GAME OVER', Math.min(40, W / 9), RED], ['Score ' + score + '  ·  Best ' + Math.max(hi, score), 14, '#bfffd2'], ['', 4, GREEN], [overT > 1 ? 'TAP TO PLAY AGAIN' : '', 16, GREEN]]);
}


/* ---------- remote-cam static ---------- */
const noiseEl = document.getElementById('noise'), glitchEl = document.getElementById('glitch');
(() => {
  const n = document.createElement('canvas'); n.width = n.height = 160; const g = n.getContext('2d'), im = g.createImageData(160, 160);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255 | 0; im.data[i] = v * .85; im.data[i + 1] = v; im.data[i + 2] = v * .9; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); noiseEl.style.backgroundImage = `url(${n.toDataURL()})`;
})();
let staticT = 0, glitchT = 0, nextGlitch = 4;
function burst(sec, tear = true) { staticT = Math.max(staticT, sec); if (tear) glitchT = Math.max(glitchT, sec * .7); }
const sigEl = document.getElementById('sig'), clockEl = document.getElementById('clock'), coordEl = document.getElementById('coord');
let osdT = 0;
function updateFX(dt) {
  staticT -= dt; glitchT -= dt; nextGlitch -= dt;
  if (nextGlitch <= 0) { nextGlitch = rnd(3, 9); glitchT = Math.max(glitchT, rnd(.08, .25)); }
  noiseEl.classList.toggle('burst', staticT > 0);
  glitchEl.classList.toggle('on', glitchT > 0);
  osdT -= dt; if (osdT > 0) return; osdT = .25;
  const d = new Date(); clockEl.textContent = d.toTimeString().slice(0, 8);
  coordEl.textContent = 'GRID ' + P.x.toFixed(1).padStart(5, '0') + ' / ' + P.z.toFixed(1).padStart(5, '0');
  const bars = P.dead || staticT > 0 ? 1 : 3 + (Math.random() < .8 ? 1 : 0) + (Math.random() < .3 ? 1 : 0);
  sigEl.textContent = 'SIGNAL ' + '▮'.repeat(bars) + '▯'.repeat(5 - bars);
}

/* ---------- loop ---------- */
let last = performance.now();
(function loop(now) {
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); updateFX(dt); draw(); requestAnimationFrame(loop);
})(last);
})();
</script>
</body>
