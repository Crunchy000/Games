<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Smash City</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#07050d; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  #app { height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360, CW = 18, CH = 20, GRAV = 900, RAGE_DUR = 7;
let H = 600, G = 554, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
let hi = 0; try { hi = +localStorage.getItem('smashcity-hi') || 0; } catch (e) {}

/* ======================= sizing ======================= */
let built = false;
function resize() {
  const oldG = G;
  H = Math.round(clamp(W * innerHeight / innerWidth, 520, 760)); G = H - 46;
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
  if (built) { shiftWorld(G - oldG); buildBG(); buildings.forEach(b => b.dirty = true); }
}
addEventListener('resize', resize);

/* ======================= input: drag to move/climb/jump, tap to smash ======================= */
const keys = { left: 0, right: 0, up: 0, down: 0, punch: 0 }, tk = { left: 0, right: 0, up: 0, down: 0 };
let stick = null, punchBuf = 0; const ptrs = new Map(), DEAD = 14, LEASH = 40;
function applyStick() {
  tk.left = tk.right = tk.up = tk.down = 0; if (!stick) return;
  const dx = stick.x - stick.ax, dy = stick.y - stick.ay;
  if (dx < -DEAD) tk.left = 1; else if (dx > DEAD) tk.right = 1;
  if (dy < -DEAD) tk.up = 1; else if (dy > DEAD) tk.down = 1;
}
const surf = document.getElementById('app');
const canStart = () => state === 'title' || (state === 'over' && overT > 1.2);
surf.addEventListener('pointerdown', e => {
  e.preventDefault();
  { const r = cv.getBoundingClientRect(), lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height; if (lx < 48 && ly < 54 && lx > -20) { location.href = '../'; return; } }
  try { surf.setPointerCapture(e.pointerId); } catch (_) {}
  audioInit(); ptrs.set(e.pointerId, { sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false });
});
surf.addEventListener('pointermove', e => {
  const q = ptrs.get(e.pointerId); if (!q) return;
  if (!q.moved && Math.hypot(e.clientX - q.sx, e.clientY - q.sy) > DEAD && !stick) { q.moved = true; stick = { id: e.pointerId, ax: q.sx, ay: q.sy, x: e.clientX, y: e.clientY }; }
  if (stick && stick.id === e.pointerId) {
    stick.x = e.clientX; stick.y = e.clientY;
    if (stick.x - stick.ax > LEASH) stick.ax = stick.x - LEASH; if (stick.ax - stick.x > LEASH) stick.ax = stick.x + LEASH;
    if (stick.y - stick.ay > LEASH) stick.ay = stick.y - LEASH; if (stick.ay - stick.y > LEASH) stick.ay = stick.y + LEASH;
    applyStick();
  }
});
function endPtr(e) {
  const q = ptrs.get(e.pointerId); if (!q) return; ptrs.delete(e.pointerId);
  if (stick && stick.id === e.pointerId) { stick = null; applyStick(); }
  else if (!q.moved && e.type === 'pointerup' && performance.now() - q.t < 320) { if (canStart()) startGame(); else if (state === 'play') punchBuf = .15; }
}
['pointerup', 'pointercancel'].forEach(ev => surf.addEventListener(ev, endPtr));
surf.addEventListener('contextmenu', e => e.preventDefault());
const KMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ' ': 'punch', j: 'punch', z: 'punch' };
addEventListener('keydown', e => {
  audioInit(); const k = KMAP[e.key] || KMAP[e.key.toLowerCase?.()];
  if (!k) return; e.preventDefault();
  if (k === 'punch' && canStart()) { startGame(); return; }
  keys[k] = 1;
});
addEventListener('keyup', e => { const k = KMAP[e.key] || KMAP[e.key.toLowerCase?.()]; if (k) keys[k] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; stick = null; ptrs.clear(); applyStick(); });

/* ======================= audio ======================= */
let ac = null, nb = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function beep(f, d, type = 'square', vol = .04, slide = 0, delay = 0) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
function noise(d, vol, freq) {
  if (!ac || !nb) return;
  try {
    const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; s.playbackRate.value = rnd(.8, 1.2); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t, rnd(0, 1)); s.stop(t + d);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ======================= themes & palettes ======================= */
const THEMES = [
  { name: 'DUSK', sky: ['#1a1238', '#5b2c6f', '#f08a5d'], far: '#4a2c5e', near: '#30204a', win: '#ffcf7a', orb: { x: 280, y: 150, r: 30, c: '#ffd9a0', g: 'rgba(255,170,110,.35)' }, stars: false, cloud: '#c97a92', lights: false, walk: '#4a3d55', road: '#262030' },
  { name: 'MIDNIGHT', sky: ['#03061a', '#0e1d4a', '#2b4a8a'], far: '#17264d', near: '#0d1834', win: '#ffe28a', orb: { x: 70, y: 115, r: 18, c: '#f4f1dc', g: 'rgba(200,220,255,.25)' }, stars: true, cloud: '#34477a', lights: true, walk: '#38405a', road: '#1a1d2c' },
  { name: 'SMOG', sky: ['#071a14', '#1f4a3a', '#b8d46a'], far: '#1e3f33', near: '#122a21', win: '#d8ff8a', orb: { x: 250, y: 170, r: 34, c: '#eaffb0', g: 'rgba(200,255,120,.3)' }, stars: false, cloud: '#6a8f5f', lights: false, walk: '#3c4a40', road: '#1d2621' },
  { name: 'INFERNO', sky: ['#16040c', '#5e1028', '#ff7a2e'], far: '#4a1022', near: '#2e0a16', win: '#ffb067', orb: { x: 90, y: 160, r: 32, c: '#ffcf6a', g: 'rgba(255,120,40,.4)' }, stars: false, cloud: '#a8443f', lights: true, walk: '#4a3036', road: '#251418' }
];
const FACADES = [
  { wall: '#b5523b', hi: '#d46c52', lo: '#7e3526', ledge: '#ecc9a6', frame: '#43231b' },
  { wall: '#3f7f8c', hi: '#5ca3b0', lo: '#28545d', ledge: '#d3eaec', frame: '#1a353b' },
  { wall: '#d6c39a', hi: '#efe2c2', lo: '#a8936a', ledge: '#fff4dc', frame: '#57472d' },
  { wall: '#5a6aa8', hi: '#7b8bcd', lo: '#3a477c', ledge: '#dbe1fa', frame: '#232c56' },
  { wall: '#8c5a9a', hi: '#ac7aba', lo: '#5f3a6b', ledge: '#efdbf4', frame: '#36203f' },
  { wall: '#c08a3a', hi: '#deaa58', lo: '#875d20', ledge: '#fbe8c2', frame: '#4a310e' }
];
const SHOPS = ['#7fe0ff', '#ffd27a', '#ff9ad0', '#a8ff9a'], AWN = [['#e8433a', '#f6efe2'], ['#2f7fd8', '#f6efe2'], ['#2fae6a', '#f6efe2'], ['#f2b632', '#3a2a12']];
const SIGNS = ['HOTEL', 'EAT', 'DINER', 'OPEN', '24H', 'MOTEL', 'BAR', 'PIZZA', 'RADIO', 'CAFE', 'GYM'];
const NEON = ['#ff4fa3', '#4ff3ff', '#ffe44f', '#7dff6a', '#ff7b3a'];
const MPAL = { b1: '#a476ee', b2: '#5d35aa', dk: '#3a1f70', belly: '#dccafc', horn: '#f6ead0', claw: '#fff6e8' };
const MRAGE = { b1: '#ff6f8f', b2: '#a8214c', dk: '#62102e', belly: '#ffd3dc', horn: '#fff7d0', claw: '#fff' };
const MHURT = { b1: '#ffffff', b2: '#e8dcff', dk: '#b9a6e8', belly: '#ffffff', horn: '#ffffff', claw: '#fff' };

/* ======================= state ======================= */
let state = 'title', lvl = 1, score = 0, hp = 100, tl = 70, tStart = 70, rage = 0, rageT = 0, combo = 0, comboT = 0, comboPop = 0, maxCombo = 0;
let buildings = [], enemies = [], bullets = [], civs = [], parts = [], popups = [], occs = [], cars = [], clouds = [], theme = THEMES[0];
let p, time = 0, lvlTime = 0, shake = 0, hitStop = 0, flashT = 0, clearT = 0, koT = 0, overT = 0, solT = 0, heliT = 0, tankT = 0, occT = 0, tally = null;
let bgSky = null, bgFar = null, bgNear = null;

function makeMonster(x) {
  return { x, y: G, vx: 0, vy: 0, face: 1, mode: 'ground', on: null, climb: null, side: 1, punchT: 0, cd: 0, inv: 0, hurtT: 0, walkT: 0, climbT: 0, sq: 0, pound: false, eatT: 0, prevUp: 0, prevDown: 0 };
}
const bw = b => b.cols * CW, topY = b => G - b.rows * CH + b.sink;

function setupLevel() {
  theme = THEMES[(lvl - 1) % THEMES.length];
  enemies = []; bullets = []; civs = []; parts = []; popups = []; occs = []; cars = [];
  // buildings
  const maxRows = Math.min(18, Math.floor((G - 150) / CH)), minRows = Math.min(maxRows - 2, 6 + Math.floor(lvl / 2));
  let cols = [0, 0, 0].map(() => 3 + Math.floor(Math.random() * 3));
  while (cols.reduce((a, b) => a + b, 0) * CW > 234) cols[cols.indexOf(Math.max(...cols))]--;
  const free = W - cols.reduce((a, b) => a + b, 0) * CW, slot = free / 4;
  buildings = []; let x = slot + rnd(-4, 4);
  const fac = [...FACADES].sort(() => Math.random() - .5);
  cols.forEach((c, i) => {
    const rows = Math.floor(rnd(minRows, Math.min(maxRows, minRows + 4 + lvl) + 1));
    buildings.push(makeBuilding(Math.round(x), c, rows, fac[i]));
    x += c * CW + slot;
  });
  // slots (gaps) for cars & spawn
  const gaps = [[0, buildings[0].x], [buildings[0].x + bw(buildings[0]), buildings[1].x], [buildings[1].x + bw(buildings[1]), buildings[2].x], [buildings[2].x + bw(buildings[2]), W]];
  const spawnGap = gaps.reduce((a, g) => (g[1] - g[0] > a[1] - a[0] ? g : a));
  gaps.filter(g => g !== spawnGap && g[1] - g[0] > 32 && Math.random() < .7).forEach(g => cars.push({ x: (g[0] + g[1]) / 2, col: pick(['#e94b3c', '#2f8fe0', '#f2c335', '#41c27a', '#eeeeee', '#8a5ad8']), crushed: false, hit: 0 }));
  const keepX = state === 'title' ? W / 2 : (spawnGap[0] + spawnGap[1]) / 2;
  p = makeMonster(clamp(keepX, 20, W - 20));
  if (state !== 'title') { p.y = -60; p.mode = 'air'; p.pound = true; p.vy = 200; }
  clouds = Array.from({ length: 6 }, () => ({ x: rnd(-40, W), y: rnd(70, G * .45), s: rnd(.6, 1.3), v: rnd(4, 10) }));
  occT = 1.5; lvlTime = 0; maxCombo = 0; combo = 0; tStart = tl = Math.max(30, 74 - lvl * 4);
  buildBG(); built = true;
}
function makeBuilding(x, cols, rows, f) {
  const cells = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) row.push({ hp: 2, lit: Math.random() < .42, jag: jagged(), crack: cracks(), burn: 0 });
    cells.push(row);
  }
  const props = [];
  const w = cols * CW;
  if (Math.random() < .6) props.push({ k: 'tower', x: rnd(4, w - 22) });
  if (Math.random() < .7) props.push({ k: 'ant', x: rnd(3, w - 3), h: rnd(20, 34) });
  for (let i = 0; i < 1 + (Math.random() < .5); i++) props.push({ k: 'ac', x: rnd(2, w - 12) });
  if (Math.random() < .55) props.push({ k: 'sign', t: pick(SIGNS), c: pick(NEON) });
  return { x, cols, rows, cells, f, props, shop: pick(SHOPS), awn: pick(AWN), door: Math.floor(Math.random() * cols), alive: true, collapsing: false, sink: 0, vs: 0, tilt: 0,
           destroyed: 0, total: cols * rows, dirty: true, cache: null, rubble: null, wob: 0 };
}
function jagged() {
  const pts = [], n = 10;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rx = CW / 2 - rnd(0, 3.5), ry = CH / 2 - rnd(0, 4);
    pts.push([CW / 2 + Math.cos(a) * rx * 1.25, CH / 2 + Math.sin(a) * ry * 1.2]);
  }
  return pts.map(([x, y]) => [clamp(x, 1, CW - 1), clamp(y, 1, CH - 1)]);
}
function cracks() {
  const cx = rnd(5, CW - 5), cy = rnd(5, CH - 5), out = [];
  for (let i = 0; i < 3; i++) { let a = rnd(0, 6.28), x = cx, y = cy; const l = [[x, y]]; for (let j = 0; j < 3; j++) { a += rnd(-.6, .6); x += Math.cos(a) * 3.5; y += Math.sin(a) * 3.5; l.push([x, y]); } out.push(l); }
  return out;
}

function startGame() {
  lvl = 1; score = 0; hp = 100; rage = 0; rageT = 0; state = 'play'; tally = null; setupLevel();
  beep(330, .15, 'triangle', .07, 330); beep(495, .2, 'triangle', .07, 495, .12);
}
function shiftWorld(d) {
  if (!p) return;
  p.y += d; enemies.forEach(e => e.y += d); bullets.forEach(q => q.y += d); parts.forEach(q => q.y += d); popups.forEach(q => q.y += d); civs.forEach(c => c.y += d);
}

/* ======================= helpers: fx ======================= */
function addP(o) { if (parts.length < 520) parts.push(o); }
function chunks(x, y, col, n, sp = 1) { for (let i = 0; i < n; i++) addP({ k: 'chunk', x, y, vx: rnd(-90, 90) * sp, vy: rnd(-170, -40) * sp, g: GRAV * .7, life: rnd(.7, 1.3), max: 1.3, s: rnd(2, 5), c: col, r: rnd(0, 6), vr: rnd(-12, 12) }); }
function glass(x, y, n) { for (let i = 0; i < n; i++) addP({ k: 'glass', x, y, vx: rnd(-80, 80), vy: rnd(-120, -20), g: GRAV * .7, life: rnd(.5, 1), max: 1, s: rnd(1.2, 2.4), c: pick(['#cfefff', '#ffffff', '#9fd6ff']), r: 0, vr: rnd(-20, 20) }); }
function dust(x, y, n, spread = 10, col = '#b8aec6') { for (let i = 0; i < n; i++) addP({ k: 'dust', x: x + rnd(-spread, spread), y: y + rnd(-4, 4), vx: rnd(-30, 30), vy: rnd(-34, -6), g: 0, life: rnd(.6, 1.2), max: 1.2, s: rnd(5, 11), grow: 16, c: col }); }
function smoke(x, y) { addP({ k: 'dust', x: x + rnd(-3, 3), y, vx: rnd(-6, 6), vy: rnd(-34, -20), g: 0, life: rnd(1, 1.7), max: 1.7, s: rnd(4, 7), grow: 12, c: '#5a5260' }); }
function fire(x, y) { addP({ k: 'fire', x: x + rnd(-4, 4), y: y + rnd(-2, 3), vx: rnd(-8, 8), vy: rnd(-60, -30), g: 0, life: rnd(.25, .5), max: .5, s: rnd(3, 6), c: pick(['#ffcf4a', '#ff8a2a', '#ff5a2a']) }); }
function sparks(x, y, n, col = '#ffe36b') { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(80, 240); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 400, life: rnd(.15, .35), max: .35, c: col }); } }
function ring(x, y, r, col = '#fff') { addP({ k: 'ring', x, y, vx: 0, vy: 0, g: 0, life: .35, max: .35, s: r, c: col }); }
function boom(x, y, big = 1) {
  ring(x, y, 34 * big, '#ffd27a'); sparks(x, y, 14 * big); for (let i = 0; i < 10 * big; i++) fire(x + rnd(-10, 10) * big, y + rnd(-8, 8) * big);
  for (let i = 0; i < 6 * big; i++) smoke(x + rnd(-10, 10), y); chunks(x, y, '#444', 6 * big);
  noise(.7, .3 * big, 900); beep(60, .4, 'sawtooth', .06, -20); shake = Math.max(shake, 5 * big); flashT = .06;
}
function pop(t, x, y, col = '#ffe36b', size = 13) { popups.push({ t, x, y, life: 1.1, col, size }); }
const mult = () => 1 + Math.min(4, Math.floor(combo / 6));
function addScore(n, x, y, show = true) { const v = n * mult(); score += v; if (show) pop('+' + v, x, y); }
function hitCombo() {
  combo++; comboT = 1.6; comboPop = 1; maxCombo = Math.max(maxCombo, combo);
  if (combo % 6 === 0 && combo <= 24) { beep(500 + combo * 25, .12, 'square', .04, 300); pop('x' + mult() + ' COMBO!', p.x, p.y - 74, '#7df9ff', 15); }
}
function addRage(n) {
  if (rageT > 0) return; rage = Math.min(100, rage + n);
  if (rage >= 100) { rageT = RAGE_DUR; pop('RAGE!!', p.x, p.y - 80, '#ff5a7a', 22); beep(110, .9, 'sawtooth', .08, -60); beep(165, .9, 'sawtooth', .05, -80); shake = 8; buzz(120); ring(p.x, p.y - 26, 60, '#ff5a7a'); }
}

/* ======================= damage & building logic ======================= */
function cellCenter(b, r, c) { return { x: b.x + c * CW + CW / 2, y: G - (r + .5) * CH + b.sink }; }
function hitCell(b, r, c, dmg) {
  const cell = b.cells[r] && b.cells[r][c]; if (!cell || cell.hp <= 0 || !b.alive || b.collapsing) return false;
  const o = occs.find(o => o.b === b && o.r === r && o.c === c); if (o) resolveOcc(o);
  const { x, y } = cellCenter(b, r, c);
  cell.hp = Math.max(0, cell.hp - dmg); b.dirty = true; hitCombo();
  if (cell.hp === 0) {
    b.destroyed++; addScore(10, x, y - 6, false); addRage(4);
    chunks(x, y, b.f.wall, 6); chunks(x, y, b.f.lo, 3); glass(x, y, 5); dust(x, y, 3, 6);
    noise(.25, .14, 1100); beep(rnd(1600, 2300), .05, 'triangle', .02);
    if (Math.random() < .22) cell.burn = rnd(3, 8);
    hitStop = Math.max(hitStop, .035);
    if (b.destroyed >= Math.ceil(b.total * .4) || b.cells[r].every(q => q.hp === 0)) collapse(b);
  } else { addScore(2, x, y, false); addRage(1.5); chunks(x, y, b.f.wall, 3); dust(x, y, 1, 4); noise(.12, .1, 1600); }
  return true;
}
function collapse(b) {
  if (b.collapsing || !b.alive) return;
  b.collapsing = true; b.vs = 25; b.tilt = rnd(-1, 1);
  const cx = b.x + bw(b) / 2; addScore(1000, cx, topY(b) - 10, false); pop('COLLAPSE! +' + 1000 * mult(), cx, Math.max(100, topY(b) - 14), '#ffb35a', 16);
  addRage(15); hitStop = .12; shake = 9; buzz(200);
  noise(1.8, .4, 600); beep(55, 1.4, 'sawtooth', .07, -20);
  occs = occs.filter(o => o.b !== b);
  if (state === 'play') { tl += 4; pop('+4s', cx, Math.max(124, topY(b) + 8), '#7dff8a', 14); }
  if (p.on === b || p.climb === b) { p.mode = 'air'; p.on = null; p.climb = null; p.vy = -120; p.vx = 0; pop('WHOA!', p.x, p.y - 60, '#fff'); }
}
function resolveOcc(o) {
  const { x, y } = cellCenter(o.b, o.r, o.c);
  occs = occs.filter(q => q !== o);
  if (o.type === 'food') { tl += 5; addScore(100, x, y, false); pop('SNACK! +5s', x, y - 12, '#7dff8a', 15); chomp(); }
  else { addScore(500, x, y - 10, false); pop('★ +' + 500 * mult(), x, y - 12, '#ffe36b', 15); beep(990, .08, 'square', .04); beep(1320, .15, 'square', .04, 0, .08); }
}
function timeUp() {
  tl = 0; state = 'ko'; koT = 2.4; combo = 0;

    overlayDim(.6); bigTitle("TIME'S", H * .28, 46, '#ffe36b', '#ff9a3d'); bigTitle('UP!', H * .28 + 48, 46, '#ffe36b', '#ff9a3d');
    text('Score ' + score, W / 2, H * .28 + 104, 18, '#ffe36b', 'center'); text('Reached block ' + lvl + ' · Best ' + Math.max(hi, score), W / 2, H * .28 + 130, 12, '#e9dcff', 'center', null, 800);
    if (overT > 1.2 && Math.sin(time * 5) > -.3) text('TAP TO SMASH AGAIN', W / 2, H * .28 + 172, 16, '#7df9ff', 'center');
  }
}

/* ======================= loop ======================= */
resize(); setupLevel();
let last = performance.now();
(function loop(now) {
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (hitStop > 0) hitStop -= dt; else update(dt);
  draw(); requestAnimationFrame(loop);
})(last);
})();
</script>
