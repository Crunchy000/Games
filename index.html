<style>
  :root { --bg:#0b0816; --card:#161126; --ink:#f1ecff; --mute:#a59cc4; --line:rgba(255,255,255,.08); --pad:clamp(16px,4vw,40px); }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #2a1a52 0%, var(--bg) 60%) fixed, var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  header { padding:32px var(--pad) 8px; max-width:1240px; margin:0 auto; }
  h1 { font-size:clamp(2.2rem,7vw,3.4rem); margin:0; letter-spacing:-.02em; font-weight:900;
       background:linear-gradient(90deg,#ffd43b,#ff6b9d 50%,#74c0fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header.brand { display:flex; align-items:center; gap:clamp(14px,3vw,28px); }
  .logo { width:clamp(112px,30vw,180px); height:auto; border-radius:12px; flex:none; box-shadow:0 10px 30px rgba(0,0,0,.45); transform:rotate(-2deg); }
  .intro { min-width:0; }
  header.brand h1 { font-size:clamp(1.5rem,5.6vw,3rem); line-height:1.05; }
  .sub { color:var(--mute); margin:6px 0 0; font-size:1.02rem; }
  .appbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; min-height:0; }
  .install { border:0; border-radius:999px; padding:9px 16px; font:inherit; font-weight:800; font-size:.92rem; color:#1a1030; background:linear-gradient(90deg,#ffd43b,#ff9d6b); cursor:pointer; box-shadow:0 4px 14px rgba(255,180,80,.25); }
  .appnote { color:var(--mute); font-size:.85rem; }
  main { max-width:1240px; margin:0 auto; padding-bottom:48px; }

  /* shared scroller */
  .scroller { display:flex; gap:14px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scroll-padding-inline:var(--pad);
              padding:6px var(--pad) 18px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .scroller::-webkit-scrollbar { display:none; }
  .scroller > * { scroll-snap-align:start; flex:none; }
  .rowwrap { position:relative; }
  .arrow { position:absolute; top:calc(50% - 30px); z-index:2; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.2);
           background:rgba(20,14,40,.82); color:#fff; font-size:1.2rem; cursor:pointer; display:none; place-items:center; backdrop-filter:blur(6px);
           box-shadow:0 6px 18px rgba(0,0,0,.4); transition:opacity .2s, transform .15s; }
  .arrow:hover { transform:scale(1.08); } .arrow[disabled] { opacity:0; pointer-events:none; }
  .arrow.l { left:8px; } .arrow.r { right:8px; }
  @media (hover:hover) and (pointer:fine) { .arrow { display:grid; } }
  a:focus-visible, button:focus-visible { outline:3px solid #ffd43b; outline-offset:3px; }

  /* featured */
  .hero { position:relative; display:flex; flex-direction:column; width:min(86vw,520px); border-radius:24px; overflow:hidden; border:1px solid var(--line); background:var(--card);
          box-shadow:0 18px 40px rgba(0,0,0,.45); transition:transform .2s; }
  .hero:hover { transform:translateY(-3px); }
  .hero .art { position:relative; aspect-ratio:16/9; display:block; }
  .hero .art svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hero .shade { position:absolute; left:0; right:0; bottom:0; height:40%; background:linear-gradient(180deg, rgba(22,17,38,0), var(--card)); }
  .hero .info { display:flex; flex-direction:column; align-items:flex-start; padding:4px 20px 18px; flex:1; }
  .hero .info p { flex:1; }
  .hero h3 { margin:0 0 4px; font-size:clamp(1.4rem,4.6vw,1.9rem); font-weight:900; letter-spacing:-.01em; }
  .hero p { margin:0 0 12px; color:#ddd6f5; font-size:.95rem; line-height:1.35; max-width:44ch; }
  .play { display:inline-flex; align-items:center; gap:6px; background:#fff; color:#1a1030; font-weight:900; border-radius:999px; padding:8px 16px; font-size:.95rem; }
  .badge { position:absolute; top:14px; left:14px; background:linear-gradient(90deg,#ffd43b,#ff8a3d); color:#2a1500; font-weight:900; font-size:.72rem;
           letter-spacing:.08em; padding:5px 10px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .dots { display:flex; justify-content:center; gap:7px; margin-top:-6px; }
  .dots button { width:8px; height:8px; border-radius:99px; border:0; padding:0; background:rgba(255,255,255,.25); cursor:pointer; transition:width .25s, background .25s; }
  .dots button.on { width:22px; background:#fff; }

  /* category rows */
  section.cat { margin-top:22px; }
  .cathead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:0 var(--pad); }
  .cathead h2 { margin:0; font-size:1.3rem; font-weight:900; letter-spacing:-.01em; }
  .cathead span { color:var(--mute); font-size:.88rem; white-space:nowrap; }
  @media (max-width:560px) { .cathead .blurb { display:none; } }
  .tile { width:clamp(150px,42vw,210px); border-radius:18px; overflow:hidden; background:var(--card); border:1px solid var(--line); position:relative;
          transition:transform .15s ease, box-shadow .15s ease, border-color .15s; }
  .tile:hover { transform:translateY(-4px); box-shadow:0 14px 30px rgba(0,0,0,.45); border-color:rgba(255,255,255,.22); }
  .tile .art { aspect-ratio:4/3; display:block; }
  .tile .art svg { width:100%; height:100%; display:block; }
  .tile .meta { padding:10px 12px 12px; }
  .tile h3 { margin:0; font-size:1rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .tag { display:inline-block; margin-top:6px; font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#cfc4ff;
               background:rgba(255,255,255,.07); padding:3px 8px; border-radius:999px; }
  .tile .badge { top:8px; left:8px; font-size:.62rem; padding:4px 8px; }
  footer { margin-top:30px; color:var(--mute); font-size:.85rem; text-align:center; padding:0 var(--pad); }
  noscript ul { padding:0 var(--pad); line-height:1.7; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<header class="brand">
  <img class="logo" src="icons/logo.jpg" width="560" height="580" alt="The Bear &amp; Bean Games: a cheerful bear in a green waistcoat and a pink bean in a wizard hat sharing a drink at a little table">
  <div class="intro">
  <h1>The Bear &amp; Bean Games</h1>
  <p class="sub">Just wholesome mini-games that work offline. Totally free, with no ads, no monetisation and no tracking.</p>
  <div id="appbar" class="appbar"><button id="install" class="install" hidden>⬇ Install app</button><span id="appnote" class="appnote"></span></div>
  </div>
</header>
<main id="main">
  <section aria-label="Featured games">
    <div class="rowwrap">
      <button class="arrow l" aria-label="Previous featured game">‹</button>
      <div class="scroller" id="featured"></div>
      <button class="arrow r" aria-label="Next featured game">›</button>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Featured game"></div>
  </section>
  <div id="cats"></div>
  <noscript><ul>
<li><a href="royal-jelly/">Royal Jelly</a> — Crown one Queen Bean in every row, column and colour patch, with no two Beans touching. A daily puzzle plus endless boards.</li>
<li><a href="thin-ice/">Thin Ice</a> — Bear and Bean stand on a frozen pond. Take turns knocking out ice blocks, or hop to safety. First to sink the other wins.</li>
<li><a href="bean-grab/">Bean Grab</a> — Two hungry hippos, one bowl of jelly beans. Lay the phone flat, tap your half to chomp, and grab the most beans.</li>
<li><a href="tile-burst/">Tile Burst</a> — Drag blocks onto the board, fill rows and columns to burst them, and chain combos for big scores.</li>
<li><a href="gummy-pop/">Gummy Pop</a> — Swap gummies to make matches, build rockets, bombs and rainbow orbs, and clear level goals.</li>
<li><a href="pyramid-hop/">Pyramid Hop</a> — Hop across a cube pyramid to change every colour while critters bounce after you.</li>
<li><a href="dots-and-boxes/">Bear vs Bean: Dots &amp; Boxes</a> — Two players take turns joining dots; close a box to claim it with a paw print or a bean.</li>
  <li><a href="bean-merge/">Bean Merge</a> — Slide jelly beans around a wooden board; matching beans merge, all the way up to the golden 2048 bean.</li>
  <li><a href="stack-drop/">Stack Drop</a> — Hold to send Bean bouncing down a sweet paper tower; let go before the liquorice.</li>
  <li><a href="guess-five/">Guess Five</a> — Find the hidden five-letter word in six guesses, daily or endless.</li>
  <li><a href="word-hive/">Word Hive</a> — Make words from seven letters in a honeycomb, always using the centre letter.</li>
  <li><a href="sudoku/">Sudoku</a> — Classic number puzzle with notes, hints and four difficulty levels.</li>
  <li><a href="tangle-tails/">Tangle Tails</a> — Free a pit of knotted snakes: tap each one to slither it out, but only when its path is clear.</li>
  <li><a href="slither-slide/">Slither Slide</a> — Swipe a cartoon snake through a maze; it slides until it hits a wall, painting every tile it passes.</li>
  <li><a href="dot-loop/">Dot Loop</a> — Drag lines through dots of one colour to clear them, or close a loop to clear the lot.</li>
  <li><a href="ink-bounce/">Ink Bounce</a> — A brick breaker with no paddle: draw your own with limited ink, and the neatest lines score most.</li>
  <li><a href="bumble-dash/">Bumble Dash</a> — Tap to buzz a little bee through the gaps between honeycomb towers.</li>
<li><a href="hedge-hop/">Hedge Hop</a> — Hop a hedgehog across busy roads, rivers of logs and railway lines.</li>
  </ul></noscript>
  <footer>Works best on a phone. Desktop players can use the keyboard: arrows/WASD and space.</footer>

<script>
(() => {
  const GAMES = [{"slug": "royal-jelly", "title": "Royal Jelly", "desc": "Crown one Queen Bean in every row, column and colour patch, with no two Beans touching. A daily puzzle plus endless boards.", "tag": "Logic", "isNew": true}, {"slug": "thin-ice", "title": "Thin Ice", "desc": "Bear and Bean stand on a frozen pond. Take turns knocking out ice blocks, or hop to safety. First to sink the other wins.", "tag": "2 players", "isNew": true}, {"slug": "bean-grab", "title": "Bean Grab", "desc": "Two hungry hippos, one bowl of jelly beans. Lay the phone flat, tap your half to chomp, and grab the most beans.", "tag": "2 players", "isNew": true}, {"slug": "bean-merge", "title": "Bean Merge", "desc": "Swipe to slide every jelly bean. Two the same bump together and merge into a bigger bean. Can you grow the golden 2048 bean?", "tag": "Puzzle", "isNew": true}, {"slug": "stack-drop", "title": "Stack Drop", "desc": "Hold to send Bean bouncing down through a sweet papercraft tower. Let go before the liquorice, or build a sugar rush and break through anything.", "tag": "Arcade", "isNew": true}, {"slug": "guess-five", "title": "Guess Five", "desc": "Find the hidden five-letter word in six guesses. Coloured tiles show how close you are. Play the daily word or go endless.", "tag": "Word", "isNew": true}, {"slug": "word-hive", "title": "Word Hive", "desc": "Make as many words as you can from seven letters in a honeycomb. Every word must use the gold centre letter.", "tag": "Word", "isNew": true}, {"slug": "sudoku", "title": "Sudoku", "desc": "Fill every row, column and box with 1 to 9. Notes, hints and four difficulty levels, with a fresh puzzle every game.", "tag": "Number", "isNew": true}, {"slug": "tangle-tails", "title": "Tangle Tails", "desc": "Untangle a pit of cartoon snakes. Tap one to send it slithering out, but only if nothing is in its way.", "tag": "Puzzle", "isNew": true}, {"slug": "slither-slide", "title": "Slither Slide", "desc": "Swipe a cartoon snake through a maze. It slides until it bumps a wall, so plan your route to paint every tile.", "tag": "Puzzle", "isNew": true}, {"slug": "bumble-dash", "title": "Bumble Dash", "desc": "Tap to buzz a little bee through the gaps between honeycomb towers.", "tag": "Arcade", "isNew": true}, {"slug": "hedge-hop", "title": "Hedge Hop", "desc": "Hop a hedgehog across busy roads, rivers of logs and railway lines.", "tag": "Arcade", "isNew": true}, {"slug": "ink-bounce", "title": "Ink Bounce", "desc": "A brick breaker on a blueprint with no paddle: draw your own, one line at a time, and catch ink drops.", "tag": "Arcade", "isNew": true}, {"slug": "dot-loop", "title": "Dot Loop", "desc": "Drag lines through dots of one colour to clear them, or close a loop to clear the lot.", "tag": "Puzzle", "isNew": true}, {"slug": "tile-burst", "title": "Tile Burst", "desc": "Drag blocks onto the board, fill rows and columns to burst them, and chain combos for big scores.", "tag": "Block puzzle", "isNew": true}, {"slug": "gummy-pop", "title": "Gummy Pop", "desc": "Match gummies, drop honey pots to Bear, break liquorice locks and stop the chocolate spreading. Boosters included.", "tag": "Match-3", "isNew": true}, {"slug": "pyramid-hop", "title": "Pyramid Hop", "desc": "Hop across a cube pyramid to change every colour while critters bounce after you.", "tag": "Puzzle · Arcade", "isNew": false}, {"slug": "dots-and-boxes", "title": "Bear vs Bean", "desc": "Dots and Boxes for two: Bear and Bean take turns joining dots. Close a box to stamp it with a paw print or a bean, and go again.", "tag": "2 players", "isNew": true}];
  const FEATURED = ["royal-jelly", "thin-ice", "bean-grab", "bean-merge", "stack-drop", "guess-five", "word-hive"];
  const CATS = [["Word & number", "Daily brain teasers", ["guess-five", "word-hive", "sudoku"]], ["Puzzle", "Think, match and clear", ["royal-jelly", "bean-merge", "tangle-tails", "slither-slide", "tile-burst", "dot-loop", "gummy-pop", "pyramid-hop"]], ["Action & Arcade", "Fast fingers, quick reflexes", ["stack-drop", "hedge-hop", "bumble-dash", "ink-bounce", "pyramid-hop"]], ["Bear vs Bean", "Two players, one phone", ["thin-ice", "bean-grab", "dots-and-boxes"]]];
  const bySlug = Object.fromEntries(GAMES.map(g => [g.slug, g]));
  const art = slug => document.getElementById('art-' + slug).innerHTML;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // featured carousel
  const feat = document.getElementById('featured'), dots = document.getElementById('dots');
  feat.innerHTML = FEATURED.map(s => { const g = bySlug[s]; return `
    <a class="hero" href="${g.slug}/" aria-label="Play ${esc(g.title)}">
      <span class="art">${art(s).replace('<svg ', '<svg preserveAspectRatio="xMidYMid slice" ')}<span class="shade"></span></span>
      ${g.isNew ? '<span class="badge">NEW</span>' : ''}
      <span class="info"><h3>${esc(g.title)}</h3><p>${esc(g.desc)}</p><span class="play">▶ Play</span></span>
    </a>`; }).join('');
  dots.innerHTML = FEATURED.map((s, i) => `<button role="tab" aria-label="${esc(bySlug[s].title)}" data-i="${i}"></button>`).join('');
  const heroes = [...feat.children], dotBtns = [...dots.children];
  const goTo = i => feat.scrollTo({ left: heroes[i].offsetLeft - feat.firstElementChild.offsetLeft, behavior: 'smooth' });
  dotBtns.forEach(b => b.addEventListener('click', () => { stopAuto(); goTo(+b.dataset.i); }));
  let cur = 0;
  const syncDots = () => {
    const x = feat.scrollLeft, maxX = feat.scrollWidth - feat.clientWidth;
    let i = heroes.reduce((b, h, k) => Math.abs(h.offsetLeft - heroes[0].offsetLeft - x) < Math.abs(heroes[b].offsetLeft - heroes[0].offsetLeft - x) ? k : b, 0);
    if (x >= maxX - 4 && auto === null) i = heroes.length - 1;
    cur = i; dotBtns.forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-selected', k === i); });
  };
  feat.addEventListener('scroll', syncDots, { passive: true });
  let auto = matchMedia('(prefers-reduced-motion: reduce)').matches ? null : setInterval(() => {
    const atEnd = feat.scrollLeft >= feat.scrollWidth - feat.clientWidth - 4;
    goTo(atEnd ? 0 : (cur + 1) % heroes.length);
  }, 5000);
  syncDots();
  const stopAuto = () => { if (auto) { clearInterval(auto); auto = null; } };
  ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev => feat.addEventListener(ev, stopAuto, { passive: true }));

  // category rows
  document.getElementById('cats').innerHTML = CATS.map(([name, blurb, list], ci) => `
    <section class="cat" aria-labelledby="cat${ci}">
      <div class="cathead"><h2 id="cat${ci}">${esc(name)}</h2><span><span class="blurb">${esc(blurb)} · </span>${list.length} game${list.length > 1 ? 's' : ''}</span></div>
      <div class="rowwrap">
        <button class="arrow l" aria-label="Scroll ${esc(name)} left">‹</button>
        <div class="scroller">${list.map(s => { const g = bySlug[s]; return `
          <a class="tile" href="${g.slug}/"><span class="art">${art(s)}</span>${g.isNew ? '<span class="badge">NEW</span>' : ''}
            <span class="meta"><h3>${esc(g.title)}</h3><span class="tag">${esc(g.tag)}</span></span></a>`; }).join('')}</div>
        <button class="arrow r" aria-label="Scroll ${esc(name)} right">›</button>
      </div>
    </section>`).join('');

  // arrows for every scroller
  document.querySelectorAll('.rowwrap').forEach(w => {
    const sc = w.querySelector('.scroller'), L = w.querySelector('.arrow.l'), R = w.querySelector('.arrow.r');
    const upd = () => { L.disabled = sc.scrollLeft < 8; R.disabled = sc.scrollLeft + sc.clientWidth > sc.scrollWidth - 8; };
    const step = () => Math.max(160, sc.clientWidth * .8);
    L.addEventListener('click', () => { stopAuto(); sc.scrollBy({ left: -step(), behavior: 'smooth' }); });
    R.addEventListener('click', () => { stopAuto(); sc.scrollBy({ left: step(), behavior: 'smooth' }); });
    sc.addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
  });
})();
</script>

<script>
(() => {
  // install button (Chrome/Android) and tips; "ready offline" once every game is saved
  const btn = document.getElementById('install'), note = document.getElementById('appnote');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; btn.hidden = true; });
  addEventListener('appinstalled', () => { btn.hidden = true; note.textContent = 'Installed. Every game works offline.'; });
  if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) note.textContent = 'Tip: tap Share, then “Add to Home Screen” to install.';
  if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(() => { if (!note.textContent || standalone) note.textContent = '✓ All games saved for offline play'; }).catch(() => {});
})();
</script>
