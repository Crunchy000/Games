<script>if ('serviceWorker' in navigator) {
  // keep installed copies current: check for a new version whenever the app comes back to the front,
  // and switch to it straight away if it lands just after opening, otherwise after the app has been away a while
  const had = !!navigator.serviceWorker.controller, t0 = Date.now(); let swap = false, away = 0;
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { away = Date.now(); return; }
      if (swap && Date.now() - away > 30000) { location.reload(); return; }
      reg.update().catch(() => {});
    });
  }).catch(() => {}));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || swap) return; swap = true; if (Date.now() - t0 < 10000) location.reload(); });
}</script>

<style id="pub-kit">
/* The Bear & Bean house style: soft clay. Muted terracotta and sage, soft cream cards, rounded shapes.
   tools/pub-kit.py copies this into every game so each page stays self-contained. */
:root {
  --pk-clay:#c8643b; --pk-clay-hi:#d57650; --pk-clay-lo:#a94f2c; --pk-clay-text:#b5532e;
  --pk-sage:#dce3d3; --pk-sage-hi:#e6ecdf; --pk-sage-ink:#3f4e35;
  --pk-sand:#ede4d6; --pk-card:#f7f1e7; --pk-card-2:#efe5d6;
  --pk-ink:#3b2e22; --pk-ink-2:#6e6152; --pk-ink-3:#8e7f6c; --pk-on-clay:#fff5ec;
  /* older names kept so game styles that borrowed them still work */
  --pk-cream:var(--pk-ink); --pk-cream-dim:var(--pk-ink-2); --pk-brass:var(--pk-clay-text); --pk-oak:#e8d9c4;
  --pk-slab:"ui-rounded","SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
/* buttons: terracotta for the main action, .pk-alt is sage */
.pk-btn {
  position:relative !important; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0 !important; border-radius:16px !important; padding:12px 26px !important; text-decoration:none !important;
  font:700 1.02rem/1.15 var(--pk-slab) !important; letter-spacing:.01em; cursor:pointer;
  color:var(--pk-on-clay) !important; text-shadow:none !important;
  background:var(--pk-clay) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 var(--pk-clay-lo), 0 8px 18px rgba(120,55,25,.18) !important;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.pk-btn:hover { background:var(--pk-clay-hi) !important; }
.pk-btn.pk-alt { color:var(--pk-sage-ink) !important; background:var(--pk-sage) !important; box-shadow:0 2px 0 #c3ccb8, 0 6px 14px rgba(60,75,45,.12) !important; }
.pk-btn.pk-alt:hover { background:var(--pk-sage-hi) !important; }
.pk-btn.pk-small { padding:9px 20px !important; font-size:.9rem !important; border-radius:14px !important; }
.pk-btn:active { transform:translateY(2px); box-shadow:0 0 0 transparent, 0 3px 8px rgba(120,55,25,.15) !important; }
.pk-btn:disabled { opacity:.45; cursor:default; }
/* chips: small rounded toolbar buttons */
.pk-chip {
  border:0 !important; border-radius:12px !important; font-family:var(--pk-slab) !important; font-weight:700 !important;
  color:var(--pk-ink) !important; text-shadow:none !important; background:#fffaf3 !important;
  box-shadow:inset 0 0 0 1px rgba(90,60,30,.16), 0 2px 5px rgba(90,60,30,.12) !important;
}
.pk-chip.on, .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; }
.pk-btn[hidden], .pk-chip[hidden] { display:none !important; }
/* dark mode: chips become soft lamplit panels so they never vanish into the background */
body.dark .pk-chip { color:#f3e6cc !important; background:rgba(255,240,220,.12) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.1) !important; }
body.dark .pk-chip.on, body.dark .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; box-shadow:none !important; }
/* ...except inside the cream cards, which stay light in both modes */
body.dark .pk-card .pk-chip { color:var(--pk-ink) !important; background:#fffaf3 !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.16), 0 2px 5px rgba(90,60,30,.12) !important; }
body.dark .pk-card .pk-chip.on, body.dark .pk-card .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; }
.pk-chip:disabled { opacity:1 !important; cursor:default; color:rgba(59,46,34,.38) !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.12) !important; }
body.dark .pk-chip:disabled { color:rgba(243,230,204,.36) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.08) !important; }
/* cards: soft cream, generously rounded, gently lifted */
.pk-card {
  color:var(--pk-ink) !important; background:var(--pk-card) !important;
  border:0 !important; border-radius:24px !important;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 20px 44px rgba(50,30,12,.28), 0 2px 6px rgba(50,30,12,.12) !important;
}
.pk-card :is(h2, h3) { font-family:var(--pk-slab) !important; color:var(--pk-ink) !important; letter-spacing:-.01em; }
.pk-card :is(p, li, small, label, dd, dt) { color:var(--pk-ink-2) !important; }
.pk-card b, .pk-card strong { color:var(--pk-ink) !important; }
.pk-card .x, .pk-card button.ib[data-close] { color:var(--pk-ink-2) !important; }
/* "The Bear & Bean presents", with both landlords' faces */
.pk-presents { display:flex; align-items:center; justify-content:center; gap:7px; margin:0 0 10px;
  font:700 .66rem/1 var(--pk-slab); letter-spacing:.14em; text-transform:uppercase; color:var(--pk-ink-3); }
.pk-presents img { width:24px; height:24px; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 3px rgba(60,35,15,.25); }
/* a word from Bear or Bean */
.pk-says { display:flex; align-items:center; gap:10px; text-align:left; margin:12px auto 6px; padding:9px 12px; max-width:290px;
  border-radius:16px; background:var(--pk-card-2); }
.pk-says img { width:42px; height:42px; flex:none; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 4px rgba(60,35,15,.25); }
.pk-says b { display:block; font:700 .66rem/1.2 var(--pk-slab); letter-spacing:.1em; text-transform:uppercase; color:var(--pk-clay-text) !important; }
.pk-says span { display:block; font-weight:700; font-size:.98rem; color:var(--pk-ink); }
/* header buttons: a soft tinted square in whatever colour the game's header uses */
.pk-home { background:color-mix(in srgb, currentColor 11%, transparent) !important; border:0 !important; border-radius:13px !important; box-shadow:none !important; }
.pk-home:active { background:color-mix(in srgb, currentColor 20%, transparent) !important; }
</style>
<style id="pub-landing">
  /* soft clay: warm sand page, cream cards, terracotta and sage accents */
  :root { --bg:#ddcfba; --card:#f7f1e7; --ink:#3b2e22; --mute:#6e6152; --line:rgba(59,46,34,.1); }
  body { background:radial-gradient(900px 480px at 50% -10%, #e8dccb, transparent 65%), var(--bg); color:var(--ink); }
  header.brand h1 { font-family:var(--pk-slab); background:none; color:var(--pk-ink); -webkit-background-clip:border-box; background-clip:border-box; letter-spacing:-.02em; }
  .sub { color:var(--pk-ink-2); } .sub.nope { color:var(--pk-ink); }
  .appnote { color:var(--pk-ink-2); }
  .logo { border-radius:22px; box-shadow:0 14px 30px rgba(60,35,15,.25); }
  .hero, .tile { border:0 !important; background:var(--pk-card) !important; box-shadow:0 14px 32px rgba(60,35,15,.16), 0 2px 6px rgba(60,35,15,.08) !important; }
  .hero { border-radius:24px; } .tile { border-radius:20px; }
  .tile .meta { display:block; padding:11px 14px 14px !important; } .tile h3 { font-size:1.02rem; }
  .hero:hover, .tile:hover { box-shadow:0 18px 40px rgba(60,35,15,.22), 0 2px 6px rgba(60,35,15,.1) !important; }
  .hero .shade { background:linear-gradient(180deg, rgba(247,241,231,0), var(--pk-card)); }
  .hero h3, .tile h3, .cathead h2 { font-family:var(--pk-slab); color:var(--pk-ink); }
  .hero p { color:var(--pk-ink-2); }
  .tile .tag { color:var(--pk-sage-ink); background:var(--pk-sage); font-family:var(--pk-slab); letter-spacing:.06em; }
  .badge { background:var(--pk-clay) !important; color:var(--pk-on-clay) !important; font-family:var(--pk-slab); box-shadow:none !important; }
  .cathead span { color:var(--pk-ink-2); }
  .arrow { background:var(--pk-card) !important; color:var(--pk-ink) !important; border:0 !important; border-radius:14px !important; box-shadow:0 6px 16px rgba(60,35,15,.2) !important; backdrop-filter:none !important; }
  .dots button { background:rgba(59,46,34,.2); } .dots button.on { background:var(--pk-clay); }
  footer { color:var(--pk-ink-2); }
  footer .appbar { justify-content:center; margin:0 0 24px; }
  a:focus-visible, button:focus-visible { outline-color:var(--pk-clay); }
  .sub.nope { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-weight:700; }
  .sub.nope span { white-space:nowrap; }
</style>

<body>
<header class="brand">
  <img class="logo" src="icons/logo.jpg" width="560" height="580" alt="The Bear &amp; Bean Games: a cheerful bear in a green waistcoat and a pink bean in a wizard hat sharing a drink at a little table">
  <div class="intro">
  <h1>The Bear &amp; Bean Games</h1>
  <p class="sub">Just wholesome mini-games that work offline. Totally free.</p>
  <p class="sub nope" aria-label="No ads, no purchases, no tracking, no nonsense"><span>❌ Ads</span><span>❌ Purchases</span><span>❌ Tracking</span><span>❌ Nonsense</span></p>
  </div>
</header>
<main id="main">
  <section aria-label="Featured games">
    <div class="rowwrap">
      <button class="arrow l" aria-label="Previous featured game">‹</button>
      <div class="scroller" id="featured"></div>
      <button class="arrow r" aria-label="Next featured game">›</button>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Featured game"></div>
  </section>
  <div id="cats"></div>
  <noscript><ul>
<li><a href="fishy-floes/">Fishy Floes</a> — Bear and Bean’s penguins race across melting ice floes for fish. Slide a penguin in a straight line and the floe it leaves sinks. Two players, or play the computer.</li>
<li><a href="hide-and-seek/">Hide &amp; Seek</a> — A cosy hidden-object hunt: 50 things are tucked into each of seven busy scenes, from a woodland camp and a beach festival to the pyramids and a camp in space.</li>
<li><a href="paw-prints/">Paw Prints</a> — Picture-logic puzzles in easy mode: use the number clues to fill in squares and reveal pixel art of acorns, teacups, Bear, Bean and friends. Each finished line fills with colour.</li>
<li><a href="paw-pairs/">Paw Pairs</a> — Match pairs of free ivory tiles to clear the stack, from a little pebble to a butterfly. Every deal can be cleared.</li>
<li><a href="hue-quilt/">Hue Quilt</a> — Swap the patches of Bear's patchwork quilt until every colour blends smoothly into the next. Buttoned patches stay put.</li>
<li><a href="lace-loops/">Lace Loops</a> — Tap to turn bits of sweet lace until every end joins up and nothing is left dangling. Endless levels in seven flavours.</li>
<li><a href="sand-sort/">Sand Sort</a> — Pour coloured sand between glass test tubes until every tube holds one colour. Endless levels, with mystery sand to uncover.</li>
<li><a href="queen-bean/">Queen Bean</a> — Crown one Queen Bean in every row, column and colour patch, with no two Beans touching. A daily puzzle plus endless boards.</li>
<li><a href="thin-ice/">Thin Ice</a> — Take turns knocking ice blocks out of a frozen pond. Whoever drops Pip the penguin in the water loses.</li>
<li><a href="greedy-hippos/">Greedy Hippos</a> — Two hungry hippos, one bowl of jelly beans. Lay the phone flat, tap your half to chomp, and grab the most beans.</li>
<li><a href="tile-burst/">Tile Burst</a> — Drag blocks onto the board, fill rows and columns to burst them, and chain combos for big scores.</li>
<li><a href="gummy-pop/">Gummy Pop</a> — Swap gummies to make matches, build rockets, bombs and rainbow orbs, and clear level goals.</li>
<li><a href="pyramid-hop/">Pyramid Hop</a> — Hop a hedgehog round a jungle pyramid to light every cube, while snakes slither up from the bottom.</li>
<li><a href="dots-and-boxes/">Dots &amp; Boxes</a> — Two players take turns joining dots; close a box to claim it with a paw print or a bean.</li>
  <li><a href="bean-2048/">Bean 2048</a> — Slide jelly beans around a wooden board; matching beans merge, all the way up to the golden 2048 bean.</li>
  <li><a href="stack-drop/">Stack Drop</a> — Hold to send Bean bouncing down a sweet paper tower; let go before the liquorice.</li>
  <li><a href="guess-five/">Guess Five</a> — Find the hidden five-letter word in six guesses, daily or endless.</li>
  <li><a href="word-hive/">Word Hive</a> — Make words from seven letters in a honeycomb, always using the centre letter.</li>
  <li><a href="sudoku/">Sudoku</a> — Classic number puzzle with notes, hints and four difficulty levels.</li>
  <li><a href="tangle-tails/">Tangle Tails</a> — Free a pit of knotted snakes: tap each one to slither it out, but only when its path is clear.</li>
  <li><a href="slither-slide/">Slither Slide</a> — Swipe a cartoon snake through a maze; it slides until it hits a wall, painting every tile it passes.</li>
  <li><a href="dot-loop/">Dot Loop</a> — Drag lines through dots of one colour to clear them, or close a loop to clear the lot.</li>
  <li><a href="ink-bounce/">Ink Bounce</a> — A brick breaker with no paddle: draw your own with limited ink, and the neatest lines score most.</li>
  <li><a href="bumble-dash/">Bumble Dash</a> — Tap to buzz a little bee through the gaps between honeycomb towers.</li>
<li><a href="hedge-hop/">Hedge Hop</a> — Hop a hedgehog across busy roads, rivers of logs and railway lines.</li>
  </ul></noscript>
  <footer><div id="appbar" class="appbar"><button id="install" class="install pk-btn pk-small" hidden>Add shortcut to phone</button><span id="appnote" class="appnote"></span></div></footer>
</main>

<script>

  const GAMES = [{"slug": "fishy-floes", "title": "Fishy Floes", "desc": "Bear and Bean’s penguins race across melting ice floes for fish. Slide a penguin in a straight line and the floe it leaves sinks. Two players, or play the computer.", "tag": "2 players", "isNew": true}, {"slug": "hide-and-seek", "title": "Hide & Seek", "desc": "A cosy hidden-object hunt: 50 things are tucked into each of seven busy scenes, from a woodland camp and a beach festival to the pyramids and a camp in space.", "tag": "Hidden object", "isNew": true}, {"slug": "paw-prints", "title": "Paw Prints", "desc": "Picture-logic puzzles in easy mode: use the number clues to fill in squares and reveal pixel art of acorns, teacups, Bear, Bean and friends. Each finished line fills with colour.", "tag": "Logic", "isNew": true}, {"slug": "paw-pairs", "title": "Paw Pairs", "desc": "Match pairs of free ivory tiles to clear the stack, from a little pebble to a butterfly. Every deal can be cleared.", "tag": "Matching", "isNew": true}, {"slug": "hue-quilt", "title": "Hue Quilt", "desc": "Swap the patches of Bear's patchwork quilt until every colour blends smoothly into the next. Buttoned patches stay put.", "tag": "Colour", "isNew": true}, {"slug": "lace-loops", "title": "Lace Loops", "desc": "Tap to turn bits of sweet lace until every end joins up and nothing is left dangling. Endless levels in seven flavours.", "tag": "Puzzle", "isNew": true}, {"slug": "sand-sort", "title": "Sand Sort", "desc": "Pour coloured sand between glass test tubes until every tube holds one colour. Endless levels, with mystery sand to uncover.", "tag": "Puzzle", "isNew": true}, {"slug": "queen-bean", "title": "Queen Bean", "desc": "Crown one Queen Bean in every row, column and colour patch, with no two Beans touching. A daily puzzle plus endless boards.", "tag": "Logic", "isNew": true}, {"slug": "thin-ice", "title": "Thin Ice", "desc": "Take turns knocking ice blocks out of a frozen pond. Whoever drops Pip the penguin in the water loses.", "tag": "2 players", "isNew": true}, {"slug": "greedy-hippos", "title": "Greedy Hippos", "desc": "Two hungry hippos, one bowl of jelly beans. Lay the phone flat, tap your half to chomp, and grab the most beans.", "tag": "2 players", "isNew": true}, {"slug": "bean-2048", "title": "Bean 2048", "desc": "Swipe to slide every jelly bean. Two the same bump together and merge into a bigger bean. Can you grow the golden 2048 bean?", "tag": "Puzzle", "isNew": true}, {"slug": "stack-drop", "title": "Stack Drop", "desc": "Hold to send Bean bouncing down through a sweet papercraft tower. Let go before the liquorice, or build a sugar rush and break through anything.", "tag": "Arcade", "isNew": true}, {"slug": "guess-five", "title": "Guess Five", "desc": "Find the hidden five-letter word in six guesses. Coloured tiles show how close you are. Play the daily word or go endless.", "tag": "Word", "isNew": true}, {"slug": "word-hive", "title": "Word Hive", "desc": "Make as many words as you can from seven letters in a honeycomb. Every word must use the gold centre letter.", "tag": "Word", "isNew": true}, {"slug": "sudoku", "title": "Sudoku", "desc": "Fill every row, column and box with 1 to 9. Notes, hints and four difficulty levels, with a fresh puzzle every game.", "tag": "Number", "isNew": true}, {"slug": "tangle-tails", "title": "Tangle Tails", "desc": "Untangle a pit of cartoon snakes. Tap one to send it slithering out, but only if nothing is in its way.", "tag": "Puzzle", "isNew": true}, {"slug": "slither-slide", "title": "Slither Slide", "desc": "Swipe a cartoon snake through a maze. It slides until it bumps a wall, so plan your route to paint every tile.", "tag": "Puzzle", "isNew": true}, {"slug": "bumble-dash", "title": "Bumble Dash", "desc": "Tap to buzz a little bee through the gaps between honeycomb towers.", "tag": "Arcade", "isNew": true}, {"slug": "hedge-hop", "title": "Hedge Hop", "desc": "Hop a hedgehog across busy roads, rivers of logs and railway lines.",     let i = heroes.reduce((b, h, k) => Math.abs(h.offsetLeft - heroes[0].offsetLeft - x) < Math.abs(heroes[b].offsetLeft - heroes[0].offsetLeft - x) ? k : b, 0);
    if (x >= maxX - 4 && auto === null) i = heroes.length - 1;
    cur = i; dotBtns.forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-selected', k === i); });
  };
  feat.addEventListener('scroll', syncDots, { passive: true });
  let auto = matchMedia('(prefers-reduced-motion: reduce)').matches ? null : setInterval(() => {
    const atEnd = feat.scrollLeft >= feat.scrollWidth - feat.clientWidth - 4;
    goTo(atEnd ? 0 : (cur + 1) % heroes.length);
  }, 5000);
  syncDots();
  const stopAuto = () => { if (auto) { clearInterval(auto); auto = null; } };
  ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev => feat.addEventListener(ev, stopAuto, { passive: true }));

  // category rows
  document.getElementById('cats').innerHTML = CATS.map(([name, blurb, list], ci) => `
    <section class="cat" aria-labelledby="cat${ci}">
      <div class="cathead"><h2 id="cat${ci}">${esc(name)}</h2><span><span class="blurb">${esc(blurb)} · </span>${list.length} game${list.length > 1 ? 's' : ''}</span></div>
      <div class="rowwrap">
        <button class="arrow l" aria-label="Scroll ${esc(name)} left">‹</button>
        <div class="scroller">${list.map(s => { const g = bySlug[s]; return `
          <a class="tile" href="${g.slug}/"><span class="art">${art(s)}</span>${g.isNew ? '<span class="badge">NEW</span>' : ''}
            <span class="meta"><h3>${esc(g.title)}</h3><span class="tag">${esc(g.tag)}</span></span></a>`; }).join('')}</div>
        <button class="arrow r" aria-label="Scroll ${esc(name)} right">›</button>
      </div>
    </section>`).join('');

  // arrows for every scroller
  document.querySelectorAll('.rowwrap').forEach(w => {
    const sc = w.querySelector('.scroller'), L = w.querySelector('.arrow.l'), R = w.querySelector('.arrow.r');
    const upd = () => { L.disabled = sc.scrollLeft < 8; R.disabled = sc.scrollLeft + sc.clientWidth > sc.scrollWidth - 8; };
    const step = () => Math.max(160, sc.clientWidth * .8);
    L.addEventListener('click', () => { stopAuto(); sc.scrollBy({ left: -step(), behavior: 'smooth' }); });
    R.addEventListener('click', () => { stopAuto(); sc.scrollBy({ left: step(), behavior: 'smooth' }); });
    sc.addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
  });
})();
</script>

<script>
(() => {
  // install button (Chrome/Android) and tips; "ready offline" once every game is saved
  const btn = document.getElementById('install'), note = document.getElementById('appnote');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; btn.hidden = true; });
  addEventListener('appinstalled', () => { btn.hidden = true; note.textContent = 'Shortcut added. Every game works offline.'; });
  if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) note.textContent = 'Tip: tap Share, then “Add to Home Screen” to add a shortcut.';
  if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(() => { if (!note.textContent || standalone) note.textContent = '✓ All games saved for offline play'; }).catch(() => {});
})();
</script>
</body>
</html>
