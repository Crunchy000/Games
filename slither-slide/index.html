<title>Slither Slide</title>
<meta name="description" content="Swipe a cartoon snake through a maze. It slides until it bumps a wall, so plan your route to paint every tile. Free to play, works offline, no ads or tracking. From The Bear &amp; Bean Games.">

<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#245f3c; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#24382c; }
  #app { position:relative; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
  .ov { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(20,50,30,.55); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); z-index:5; }
  .ov.show { display:flex; animation:fade .3s ease; }
  @keyframes fade { from { opacity:0; } }
  .card { width:min(92vw,370px); max-height:94dvh; overflow:auto; background:#fff9ec; border-radius:26px; padding:20px 18px 18px; text-align:center; box-shadow:0 6px 0 #c9b98f, 0 18px 40px rgba(0,0,0,.35); animation:pop .4s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform:scale(.85); opacity:0; } }
  h1 { margin:0; font-size:2.7rem; line-height:1; font-weight:900; color:#2f9e5a; letter-spacing:-.02em; text-shadow:0 3px 0 #1d6b3b; }
  h1 span { color:#ff8a3d; text-shadow:0 3px 0 #b5531a; }
  h2 { margin:0 0 4px; font-size:1.8rem; font-weight:900; color:#2f9e5a; }
  p { margin:8px 0; line-height:1.4; color:#5a6b5f; }
  .btn { border:0; border-radius:16px; padding:13px 24px; margin:8px 4px 0; font:inherit; font-weight:900; font-size:1.08rem; cursor:pointer; color:#fff; background:#2f9e5a; box-shadow:0 4px 0 #1d6b3b; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #1d6b3b; }
  .btn.alt { background:#ff8a3d; box-shadow:0 4px 0 #b5531a; } .btn.soft { background:#efe6cf; color:#3b4a3f; box-shadow:0 4px 0 #c9b98f; }
  .skins { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 6px; }
  .skin { border:3px solid transparent; background:#f4ecd6; border-radius:16px; padding:6px 4px 4px; cursor:pointer; font:inherit; font-size:.72rem; font-weight:800; color:#3b4a3f; }
  .skin canvas { width:100%; height:auto; display:block; }
  .skin.on { border-color:#2f9e5a; background:#e2f5e6; }
  .skin.locked { opacity:.5; cursor:default; }

<style id="pub-kit">
/* The Bear & Bean house style: soft clay. Muted terracotta and sage, soft cream cards, rounded shapes.
   tools/pub-kit.py copies this into every game so each page stays self-contained. */
:root {
  --pk-clay:#c8643b; --pk-clay-hi:#d57650; --pk-clay-lo:#a94f2c; --pk-clay-text:#b5532e;
  --pk-sage:#dce3d3; --pk-sage-hi:#e6ecdf; --pk-sage-ink:#3f4e35;
  --pk-sand:#ede4d6; --pk-card:#f7f1e7; --pk-card-2:#efe5d6;
  --pk-ink:#3b2e22; --pk-ink-2:#6e6152; --pk-ink-3:#8e7f6c; --pk-on-clay:#fff5ec;
  /* older names kept so game styles that borrowed them still work */
  --pk-cream:var(--pk-ink); --pk-cream-dim:var(--pk-ink-2); --pk-brass:var(--pk-clay-text); --pk-oak:#e8d9c4;
  --pk-slab:"ui-rounded","SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
/* buttons: terracotta for the main action, .pk-alt is sage */
.pk-btn {
  position:relative !important; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0 !important; border-radius:16px !important; padding:12px 26px !important; text-decoration:none !important;
  font:700 1.02rem/1.15 var(--pk-slab) !important; letter-spacing:.01em; cursor:pointer;
  color:var(--pk-on-clay) !important; text-shadow:none !important;
  background:var(--pk-clay) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 var(--pk-clay-lo), 0 8px 18px rgba(120,55,25,.18) !important;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.pk-btn:hover { background:var(--pk-clay-hi) !important; }
.pk-btn.pk-alt { color:var(--pk-sage-ink) !important; background:var(--pk-sage) !important; box-shadow:0 2px 0 #c3ccb8, 0 6px 14px rgba(60,75,45,.12) !important; }
.pk-btn.pk-alt:hover { background:var(--pk-sage-hi) !important; }
.pk-btn.pk-small { padding:9px 20px !important; font-size:.9rem !important; border-radius:14px !important; }
.pk-btn:active { transform:translateY(2px); box-shadow:0 0 0 transparent, 0 3px 8px rgba(120,55,25,.15) !important; }
.pk-btn:disabled { opacity:.45; cursor:default; }
/* chips: small rounded toolbar buttons */
.pk-chip {
  border:0 !important; border-radius:12px !important; font-family:var(--pk-slab) !important; font-weight:700 !important;
  color:var(--pk-ink) !important; text-shadow:none !important; background:#fffaf3 !important;
  box-shadow:inset 0 0 0 1px rgba(90,60,30,.16), 0 2px 5px rgba(90,60,30,.12) !important;
}
.pk-chip.on, .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; }
.pk-btn[hidden], .pk-chip[hidden] { display:none !important; }
/* dark mode: chips become soft lamplit panels so they never vanish into the background */
body.dark .pk-chip { color:#f3e6cc !important; background:rgba(255,240,220,.12) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.1) !important; }
body.dark .pk-chip.on, body.dark .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; box-shadow:none !important; }
/* ...except inside the cream cards, which stay light in both modes */
body.dark .pk-card .pk-chip { color:var(--pk-ink) !important; background:#fffaf3 !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.16), 0 2px 5px rgba(90,60,30,.12) !important; }
body.dark .pk-card .pk-chip.on, body.dark .pk-card .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; }
.pk-chip:disabled { opacity:1 !important; cursor:default; color:rgba(59,46,34,.38) !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.12) !important; }
body.dark .pk-chip:disabled { color:rgba(243,230,204,.36) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.08) !important; }
/* cards: soft cream, generously rounded, gently lifted */
.pk-card {
  color:var(--pk-ink) !important; background:var(--pk-card) !important;
  border:0 !important; border-radius:24px !important;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 20px 44px rgba(50,30,12,.28), 0 2px 6px rgba(50,30,12,.12) !important;
}
.pk-card :is(h2, h3) { font-family:var(--pk-slab) !important; color:var(--pk-ink) !important; letter-spacing:-.01em; }
.pk-card :is(p, li, small, label, dd, dt) { color:var(--pk-ink-2) !important; }
.pk-card b, .pk-card strong { color:var(--pk-ink) !important; }
.pk-card .x, .pk-card button.ib[data-close] { color:var(--pk-ink-2) !important; }
/* "The Bear & Bean presents", with both landlords' faces */
.pk-presents { display:flex; align-items:center; justify-content:center; gap:7px; margin:0 0 10px;
  font:700 .66rem/1 var(--pk-slab); letter-spacing:.14em; text-transform:uppercase; color:var(--pk-ink-3); }
.pk-presents img { width:24px; height:24px; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 3px rgba(60,35,15,.25); }
/* a word from Bear or Bean */
.pk-says { display:flex; align-items:center; gap:10px; text-align:left; margin:12px auto 6px; padding:9px 12px; max-width:290px;
  border-radius:16px; background:var(--pk-card-2); }
.pk-says img { width:42px; height:42px; flex:none; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 4px rgba(60,35,15,.25); }
.pk-says b { display:block; font:700 .66rem/1.2 var(--pk-slab); letter-spacing:.1em; text-transform:uppercase; color:var(--pk-clay-text) !important; }
.pk-says span { display:block; font-weight:700; font-size:.98rem; color:var(--pk-ink); }
/* header buttons: a soft tinted square in whatever colour the game's header uses */
.pk-home { background:color-mix(in srgb, currentColor 11%, transparent) !important; border:0 !important; border-radius:13px !important; box-shadow:none !important; }
.pk-home:active { background:color-mix(in srgb, currentColor 20%, transparent) !important; }
</style>
<script id="pub-kit-settings">
window.BB = (() => {
  const KEY = 'bearbean-settings'; let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  return {
    get muted() { return 'muted' in s ? !!s.muted : null; }, set muted(v) { s.muted = !!v; put(); },
    get theme() { return s.theme || null; }, set theme(v) { if (v) s.theme = v; else delete s.theme; put(); },
  };
})();
</script>

<div id="app">

  <div class="ov show" id="ovMenu"><div class="card pk-card">

<script>
(() => {
'use strict';
const W = 360;
let H = 680, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a);
const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

/* ---------- the snakes (all original designs) ---------- */
const SKINS = [
  { id: 'pip', name: 'Pip', main: '#5ccf6e', dark: '#2f9e45', accent: '#c8f56a', pat: 'stripes', unlock: 1 },
  { id: 'coral', name: 'Coral', main: '#ff7f6e', dark: '#d8483a', accent: '#ffd2a0', pat: 'spots', unlock: 4 },
  { id: 'sunny', name: 'Sunny', main: '#ffcd3c', dark: '#e09a10', accent: '#ff7a3d', pat: 'zigzag', unlock: 8 },
  { id: 'grape', name: 'Grape', main: '#a77cf2', dark: '#7046c8', accent: '#ffd1f2', pat: 'diamond', unlock: 12 },
  { id: 'minty', name: 'Minty', main: '#4fd1c5', dark: '#1e9a8f', accent: '#ffffff', pat: 'spots', unlock: 18 },
  { id: 'rainbow', name: 'Prism', main: '#ff6b9d', dark: '#c43a70', accent: '#ffe066', pat: 'rainbow', unlock: 25 },
];
let save = { level: 1, stars: {}, skin: 'pip', muted: false };
try { save = Object.assign(save, JSON.parse(localStorage.getItem('slitherslide') || '{}')); } catch (e) {}
if (BB.muted === null) BB.muted = save.muted; else save.muted = BB.muted;   // sound is shared by every game
const persist = () => { try { localStorage.setItem('slitherslide', JSON.stringify(save)); } catch (e) {} };
const skin = () => SKINS.find(s => s.id === save.skin) || SKINS[0];
const RAINBOW = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa'];

function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 600, 780));
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
  layout();
}

/* ---------- sound (synthesised) ---------- */
let ac = null;
function audio() { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, d, type = 'sine', vol = .05, delay = 0, slide = 0) {
  if (!ac || save.muted) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
let nb = null;
function hiss(d, vol) {
  if (!ac || save.muted) return; if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nb; f.type = 'highpass'; f.frequency.value = 4500;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + d);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
let paintStreak = 0;
const sPaint = () => { tone(523 * Math.pow(2, SCALE[Math.min(10, paintStreak)] / 12), .08, 'triangle', .035); paintStreak++; };
const sBump = () => { tone(140, .09, 'sine', .07, 0, -40); };
const sWin = () => { hiss(.5, .05); [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .2, 'triangle', .06, .1 + i * .09)); };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- level generation: carve a maze by recording slides, so it is always solvable ---------- */
function rng32(seed) { let s = seed >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function generate(n) {
  const cols = Math.min(11, 7 + Math.floor((n - 1) / 4)), rows = Math.min(15, 9 + Math.floor((n - 1) / 3));
  const steps = Math.min(34, 6 + Math.floor(n * 1.15));
  for (let attempt = 0; attempt < 60; attempt++) {
    const rand = rng32(n * 1013 + attempt * 7919 + 17);
    const g = Array.from({ length: rows }, () => Array(cols).fill(0)), stop = new Set();
    const inner = (r, c) => r > 0 && c > 0 && r < rows - 1 && c < cols - 1;
    let r = 1 + Math.floor(rand() * (rows - 2)), c = 1 + Math.floor(rand() * (cols - 2)); const start = [r, c]; g[r][c] = 1;
    const moves = []; let last = null;
    for (let k = 0; k < steps * 6 && moves.length < steps; k++) {
      const dname = ['up', 'down', 'left', 'right'][Math.floor(rand() * 4)]; if (dname === last) continue;
      const [dr, dc] = DIRS[dname], L = 1 + Math.floor(rand() * 5);
      let rr = r, cc = c, carved = 0;
      for (let i = 0; i < L; i++) { const nr = rr + dr, nc = cc + dc; if (!inner(nr, nc) || stop.has(nr * 64 + nc)) break; rr = nr; cc = nc; carved++; }
      if (!carved) continue;
      // carve, then keep sliding over any floor that already exists, exactly as the snake will
      let pr = r, pc = c; for (let i = 0; i < carved; i++) { pr += dr; pc += dc; g[pr][pc] = 1; }
      while (inner(rr + dr, cc + dc) && g[rr + dr][cc + dc] === 1) { rr += dr; cc += dc; }
      const br = rr + dr, bc = cc + dc; if (inner(br, bc)) stop.add(br * 64 + bc);
      if (rr === r && cc === c) continue;
      moves.push(dname); r = rr; c = cc; last = dname;
    }
    let floor = 0; for (const row of g) for (const v of row) floor += v;
    if (moves.length >= Math.min(steps, 5) && floor >= (rows - 2) * (cols - 2) * .38) return { g, rows, cols, start, par: moves.length, moves };
  }
  return generate(n + 1000);
}

/* ---------- state ---------- */
let L = null, grid, head, moving = null, queue = [], trail = [], history = [], movesUsed = 0, state = 'menu', time = 0, pops = [], parts = [], callout = null, won = 0, BX = 0, BY = 0, CS = 30, tongue = 0, blink = 0, dir = 'down';
function layout() {
  if (!L) return;
  const availH = H - 150, cs = Math.floor(Math.min((W - 20) / L.cols, availH / L.rows));
  CS = cs; BX = (W - cs * L.cols) / 2; BY = 104 + (availH - cs * L.rows) / 2;
}
function startLevel(n) {
  L = generate(n); L.n = n; layout();
  grid = L.g.map(row => row.map(v => v));
  head = { r: L.start[0], c: L.start[1], x: L.start[1], y: L.start[0] };
  grid[head.r][head.c] = 2; trail = Array.from({ length: 7 }, () => [head.x, head.y]);
  moving = null; queue = []; history = []; movesUsed = 0; pops = [{ r: head.r, c: head.c, t: 0 }]; parts = []; won = 0; dir = 'down';
  state = 'play'; callout = { t: 'Level ' + n, life: 1.3 };
}
const floorLeft = () => { let n = 0; for (const row of grid) for (const v of row) if (v === 1) n++; return n; };
const floorTotal = () => { let n = 0; for (const row of grid) for (const v of row) if (v) n++; return n; };

function slide(dname) {
  if (state !== 'play') return;
  if (moving) { if (queue.length < 2) queue.push(dname); return; }
  const [dr, dc] = DIRS[dname]; let r = head.r, c = head.c; const path = [];
  while (grid[r + dr] && grid[r + dr][c + dc]) { r += dr; c += dc; path.push([r, c]); }
  dir = dname;
  if (!path.length) { sBump(); head.bump = { dr, dc, t: 0 }; return; }
  history.push({ grid: grid.map(row => row.slice()), r: head.r, c: head.c, movesUsed, dir });
  movesUsed++; paintStreak = 0;
  moving = { path, i: 0, f: 0, dr, dc, speed: 20 + path.length * .8 };
  hiss(.12 + path.length * .02, .02);
}
function undo() {
  if (moving || !history.length || state !== 'play') return;
  const h = history.pop(); grid = h.grid; head.r = h.r; head.c = h.c; head.x = h.c; head.y = h.r; movesUsed = h.movesUsed; dir = h.dir;
  trail = Array.from({ length: 7 }, () => [head.x, head.y]); tone(400, .08, 'sine', .04, 0, -150);
}

/* ---------- input ---------- */
let down = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (y < 64) {
    if (x < 56) { openMenu(); return; }
    if (x > W - 56) { save.muted = !save.muted; BB.muted = save.muted; persist(); return; }
    if (x > W - 104) { if (state === 'play') { startLevel(L.n); tone(500, .08, 'triangle', .05); } return; }
    if (x > W - 152) { undo(); return; }
  }
  down = { x: e.clientX, y: e.clientY, used: false };
});
cv.addEventListener('pointermove', e => {
  if (!down || down.used) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.hypot(dx, dy) < 22) return;
  down.used = true; slide(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
cv.addEventListener('pointerup', () => { down = null; });
addEventListener('keydown', e => {
