<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fde4ea">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Stack Drop</title>
<meta name="description" content="Hold to send Bean bouncing down through a sweet papercraft tower. Let go before the liquorice, or build a sugar rush and break through anything. Free to play, works offline, no ads or tracking. From The Bear &amp; Bean Games.">
<link rel="canonical" href="https://crunchy000.github.io/Games/stack-drop/">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#fbe3ea; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { position:relative; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360;
let H = 680, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pick = a => a[Math.floor(Math.random() * a.length)];
let dizzy = 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
let best = 0, maxLevel = 1, muted = false;
try { const s = JSON.parse(localStorage.getItem('stackdrop') || '{}'); best = s.best || 0; maxLevel = s.level || 1; muted = !!s.muted; } catch (e) {}
const persist = () => { try { localStorage.setItem('stackdrop', JSON.stringify({ best, level: maxLevel, muted })); } catch (e) {} };

function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 560, 780));
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
}

/* ---------- sound (synthesised) ---------- */
let ac = null, nb = null;
function audio() { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, d, type = 'sine', vol = .05, delay = 0, slide = 0) {
  if (!ac || muted) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, f = 2000) {
  if (!ac || muted) return; if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nb; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = .8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + d);
}
const PENT = [0, 2, 4, 7, 9];
const sSmash = n => { const step = n % 15, f = 330 * Math.pow(2, (PENT[step % 5] + 12 * Math.floor(step / 5)) / 12); tone(f, .09, 'triangle', .05); noise(.08, .08, 2600); };
const sBounce = () => tone(220, .12, 'sine', .07, 0, 140);
const sCrash = () => { noise(.4, .25, 700); tone(300, .35, 'sawtooth', .04, 0, -220); };
const sFire = () => { noise(.5, .15, 900); tone(200, .5, 'sawtooth', .03, 0, 400); };
const sWin = () => [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .22, 'triangle', .06, i * .08));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- tower geometry: rings seen from slightly above ---------- */
const CX = W / 2, R = 120, RI = 34, POLE = 22, SY = .36, T = 13, D = 46, SEG = 12, BALL = 13, FRONT = (R + RI) / 2 * SY;
const PALETTES = [
  { bg: ['#fff1e6', '#fbd3e0'], discs: ['#ff9ec4', '#ffc4dc'], pole: '#ff9ec4', ink: '#c2457a' },
  { bg: ['#eef8ff', '#cfe6ff'], discs: ['#8fd0ff', '#bfe4ff'], pole: '#7cc0f0', ink: '#2f7ab8' },
  { bg: ['#f3ffe8', '#d6f5c4'], discs: ['#9be38b', '#c8f2b5'], pole: '#7fd36e', ink: '#3f8a38' },
  { bg: ['#fff8e1', '#ffe2b3'], discs: ['#ffc861', '#ffe0a1'], pole: '#ffb547', ink: '#c27a12' },
  { bg: ['#f6f0ff', '#e0d2ff'], discs: ['#c6a7ff', '#e0d0ff'], pole: '#b48cff', ink: '#7a52c8' },
  { bg: ['#e9fffb', '#c4f1ea'], discs: ['#6fdcc8', '#a9ecdf'], pole: '#54c9b4', ink: '#1f8f7c' },
];
const LIQ = '#2e2438', LIQ_SIDE = '#1c1524', LIQ_SWIRL = '#4d3e63', INK = '#5a3d4a';
const IMG = { bear: new Image(), bean: new Image() }; IMG.bear.src = '../icons/bear.png'; IMG.bean.src = '../icons/bean.png';
// a little paper texture: speckles and fibres, used over rings, cards and the background
const PAPER = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
  for (let i = 0; i < 260; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(90,60,40,.05)' : 'rgba(255,255,255,.12)'; g.fillRect(Math.random() * 96, Math.random() * 96, 1 + Math.random(), 1 + Math.random()); }
  g.strokeStyle = 'rgba(255,255,255,.1)'; g.lineWidth = .6; for (let i = 0; i < 18; i++) { const x = Math.random() * 96, y = Math.random() * 96; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6, y + 3, x + 12, y + Math.random() * 6 - 3); g.stroke(); }
  return c;
})();
let paperPat = null;
function shade(hex, f) { const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, k = Math.abs(f); const c = s => Math.round(((n >> s) & 255) + (t - ((n >> s) & 255)) * k); return `rgb(${c(16)},${c(8)},${c(0)})`; }

/* ---------- levels ---------- */
function rng32(seed) { let s = seed >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeLevel(n) {
  const rand = rng32(n * 7717 + 3), count = Math.min(110, 40 + n * 5), discs = [];
  const twist = rnd(.12, .3) * (rand() < .5 ? 1 : -1), style = n < 3 ? 0 : Math.floor(rand() * 3);
  let darkRun = 0;
  for (let i = 0; i < count; i++) {
    const segs = Array(SEG).fill(0);
    // dark sections grow with the level; the first few rings are always safe
    const danger = i < 3 ? 0 : Math.min(.55, .08 + n * .035 + i / count * .12);
    let dark = 0;
    if (rand() < .35 + n * .04 && i >= 3) dark = 1 + Math.floor(rand() * Math.min(SEG / 2, 1 + n / 2));
    if (darkRun > 3) dark = 0;
    darkRun = dark ? darkRun + 1 : 0;
    const start = Math.floor(rand() * SEG);
    if (style === 1 && dark) for (let k = 0; k < dark; k++) segs[(start + k * 2) % SEG] = 1;
    else for (let k = 0; k < dark; k++) segs[(start + k) % SEG] = 1;
    if (danger > 0 && rand() < danger * .3) segs[(start + SEG / 2) % SEG] = 1;
    if (segs.every(v => v)) segs[0] = 0;
    discs.push({ segs, off: i * twist, broken: false });
  }
  const spin = (1 + Math.min(1.6, n * .09)) * (rand() < .5 ? 1 : -1), wobble = n >= 4 && rand() < .5;
  return { n, discs, spin, wobble, pal: PALETTES[(n - 1) % PALETTES.length], count };
}

/* ---------- state ---------- */
let L, rot = 0, cur = 0, by = 0, vy = 0, holding = false, heat = 0, fire = 0, state = 'ready', score = 0, levelStart = 0, combo = 0;
let camY = 0, frags = [], splats = [], sparks = [], time = 0, endT = 0, squash = 0, msg = null;
function startLevel(n) {
  L = makeLevel(n); rot = 0; cur = 0; by = -60; vy = 0; heat = 0; fire = 0; combo = 0; frags = []; splats = []; sparks = [];
  camY = by - H * .32; state = 'play'; levelStart = score; endT = 0; msg = { t: 'Level ' + n, life: 1.4 };
}
const discY = i => i * D;                       // world y of a ring's top surface
const rotNow = () => rot + (L.wobble ? Math.sin(time * 1.3) * .8 : 0);
function segAtFront(i) {
  const d = L.discs[i], a = ((Math.PI / 2 - rotNow() - d.off) % TAU + TAU) % TAU;
  return d.segs[Math.floor(a / (TAU / SEG)) % SEG];
}

/* ---------- input: hold to smash ---------- */
function press() {
  audio();
  if (state === 'ready') { startLevel(maxLevel); return; }
  if (state === 'crash' && endT > .6) { score = levelStart; startLevel(L.n); return; }
  if (state === 'win' && endT > .8) { startLevel(L.n + 1); return; }
  holding = true;
}
const release = () => { holding = false; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (x < 50 && y < 56) { location.href = '../'; return; }
  if (x > W - 50 && y < 56) { muted = !muted; persist(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  press();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, release));
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') release(); });
addEventListener('blur', release);

/* ---------- update ---------- */
const G = 2600, BOUNCE = 560, PLUNGE = 720;
function smash(i, viaFire) {
  const d = L.discs[i]; d.broken = true; combo++;
  const pts = 1 + Math.floor(combo / 8); score += pts; if (score > best) best = score;
  if (!viaFire) heat = Math.min(100, heat + 3.4);
  if (heat >= 100 && fire <= 0) { fire = 2.6; heat = 0; sFire(); buzz(40); msg = { t: 'Sugar rush!', life: 1.1 }; }
  sSmash(combo); if (combo % 5 === 0) buzz(8);
  const y = discY(i), r0 = rotNow() + d.off;
  for (let k = 0; k < SEG; k += 2) {
    const a = r0 + (k + 1) * TAU / SEG;
    frags.push({ y, a0: r0 + k * TAU / SEG, dark: d.segs[k] || d.segs[k + 1], col: L.pal.discs[i % 2], r: 0, vr: rnd(320, 440), vy: rnd(-40, 60), dy: 0, spin: rnd(-4, 4), ang: 0, dir: a, life: .38 });
  }
  if (frags.length > 36) frags.splice(0, frags.length - 36);
}
function crash() {
  state = 'crash'; endT = 0; holding = false; sCrash(); buzz([40, 40, 80]);
  for (let k = 0; k < 14; k++) { const a = rnd(0, TAU), s = rnd(40, 160); sparks.push({ x: CX, y: by + FRONT - BALL * 1.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: rnd(.5, .9), c: pick(['#ffe36b', '#fff', '#ff9ec4']), star: true }); }
  dizzy = 0; msg = { t: 'Oops!', life: 9 };
}
function win() {
  state = 'win'; endT = 0; holding = false; sWin(); buzz(60);
  maxLevel = Math.max(maxLevel, L.n + 1); persist();
  for (let k = 0; k < 70; k++) sparks.push({ x: rnd(0, W), y: camY + rnd(-40, 0), vx: rnd(-40, 40), vy: rnd(40, 200), life: rnd(1.2, 2.2), c: ['#ffd43b', '#ff6b9d', '#74c0fc', '#69db7c', '#fff'][k % 5], conf: true, rot: rnd(0, 6) });
}
function update(dt) {
  time += dt; squash = Math.max(0, squash - dt * 5);
  if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }
  for (const f of frags) { f.life -= dt; f.r += f.vr * dt; f.vr *= Math.pow(.2, dt); f.vy += 420 * dt; f.dy += f.vy * dt; f.ang += f.spin * dt; }
  dizzy += dt; frags = frags.filter(f => f.life > 0);
  for (const s of sparks) { s.life -= dt; s.vy += (s.conf ? 120 : 600) * dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.conf) s.rot += dt * 5; } sparks = sparks.filter(s => s.life > 0);
  for (const s of splats) s.life -= dt; splats = splats.filter(s => s.life > 0);
  if (state !== 'play') { endT += dt; return; }
  rot += L.spin * dt;
  if (fire > 0) fire -= dt;
  if (!holding) { heat = Math.max(0, heat - 28 * dt); combo = 0; }
  const ground = cur >= L.count;
  const contact = discY(Math.min(cur, L.count));
  if (holding && !ground) vy = PLUNGE * (fire > 0 ? 1.25 : 1);
  else vy += G * dt;
  by += vy * dt;
  while (by >= contact && vy > 0) {
    const c = discY(Math.min(cur, L.count));
    if (by < c) break;
    if (cur >= L.count) { by = c; win(); return; }
    if (holding) {
      const dark = segAtFront(cur);
      if (dark && fire <= 0) { by = c; crash(); return; }
      smash(cur, dark && fire > 0); cur++;
      if (cur >= L.count) continue;
    } else {
      by = c; vy = -BOUNCE; squash = 1; sBounce();
      splats.push({ i: cur, a: Math.PI / 2 - rotNow() - L.discs[cur].off, life: 2.2, s: rnd(.8, 1.2), bits: Array.from({ length: 7 }, () => [rnd(0, TAU), rnd(4, 15), rnd(0, 3), pick(['#ff6b9d', '#ffd43b', '#74c0fc', '#69db7c', '#fff', '#c6a7ff'])]) });
      break;
    }
  }
  const target = by - H * .3;
  camY += (target - camY) * Math.min(1, dt * (holding ? 12 : 6));
}

/* ---------- drawing ---------- */
const sy = y => y - camY;                      // world → screen
function ringPath(y, a0, a1, r0, r1) {
  const n = Math.max(2, Math.ceil((a1 - a0) / .12));
  ctx.beginPath();
  for (let k = 0; k <= n; k++) { const a = a0 + (a1 - a0) * k / n; ctx.lineTo(CX + Math.cos(a) * r1, y + Math.sin(a) * r1 * SY); }
  for (let k = n; k >= 0; k--) { const a = a0 + (a1 - a0) * k / n; ctx.lineTo(CX + Math.cos(a) * r0, y + Math.sin(a) * r0 * SY); }
  ctx.closePath();
}
function sidePath(y, a0, a1, r) {   // the outer wall, front half only
  const lo = Math.max(a0, 0), hi = Math.min(a1, Math.PI); if (hi <= lo) return false;
  const n = Math.max(2, Math.ceil((hi - lo) / .12));
  ctx.beginPath();
  for (let k = 0; k <= n; k++) { const a = lo + (hi - lo) * k / n; ctx.lineTo(CX + Math.cos(a) * r, y + Math.sin(a) * r * SY); }
  for (let k = n; k >= 0; k--) { const a = lo + (hi - lo) * k / n; ctx.lineTo(CX + Math.cos(a) * r, y + T + Math.sin(a) * r * SY); }
  ctx.closePath(); return true;
}
function paperFill(alpha = .9) { if (!paperPat) paperPat = ctx.createPattern(PAPER, 'repeat'); ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = paperPat; ctx.fill(); ctx.restore(); }
function drawDisc(i, y) {
  const d = L.discs[i], r0 = rotNow() + d.off, step = TAU / SEG, col = L.pal.discs[i % 2];
  // a soft paper shadow on the layer below
  ctx.fillStyle = 'rgba(90,50,60,.13)'; ctx.beginPath(); ctx.ellipse(CX + 3, y + T + 6, R + 2, (R + 2) * SY, 0, 0, TAU); ctx.fill();
  for (let k = 0; k < SEG; k++) {
    const a0 = ((r0 + k * step) % TAU + TAU) % TAU, a1 = a0 + step, liq = d.segs[k];
    ctx.fillStyle = liq ? LIQ_SIDE : shade(col, -.16);
    if (sidePath(y, a0, a1, R)) ctx.fill();
    if (a1 > TAU && sidePath(y, a0 - TAU, a1 - TAU, R)) ctx.fill();
  }
  for (let k = 0; k < SEG; k++) {
    const a0 = r0 + k * step, a1 = a0 + step, liq = d.segs[k];
    ringPath(y, a0, a1 + .004, RI, R);
    ctx.fillStyle = liq ? LIQ : shade(col, .06 * Math.sin(k * 2.1 + i));
    ctx.fill();
    if (liq) {   // liquorice swirls
      ctx.strokeStyle = LIQ_SWIRL; ctx.lineWidth = 2.2;
      for (const rr of [(R + RI) / 2 - 12, (R + RI) / 2 + 12]) { ctx.beginPath(); ctx.ellipse(CX, y, rr, rr * SY, 0, a0 + .08, a1 - .08); ctx.stroke(); }
    }
    ringPath(y, a0, a1 + .004, RI, R); ctx.strokeStyle = liq ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
  }
  ringPath(y, 0, TAU, RI, R); paperFill(.9);
  // the white cut edge along the front
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(CX, y, R - 1, (R - 1) * SY, 0, .12, Math.PI - .12); ctx.stroke();
  // sprinkles where Bean bounced
  for (const s of splats) if (s.i === i) {
    const a = s.a + r0, x = CX + Math.cos(a) * (R + RI) / 2, yy = y + Math.sin(a) * (R + RI) / 2 * SY;
    ctx.globalAlpha = clamp(s.life, 0, 1);
    for (const [q, dd, rot, c] of s.bits) { ctx.save(); ctx.translate(x + Math.cos(q) * dd * s.s, yy + Math.sin(q) * dd * s.s * SY); ctx.rotate(rot); ctx.fillStyle = c; ctx.fillRect(-3, -1, 6, 2.2); ctx.restore(); }
    ctx.globalAlpha = 1;
  }
}
function drawPole(yBottom, yTop) {
  // a striped candy stick, turning with the tower
  const h = yBottom - yTop + 6;
  ctx.save(); ctx.beginPath(); ctx.rect(CX - POLE, yTop, POLE * 2, h); ctx.ellipse(CX, yBottom + 6, POLE, POLE * SY, 0, 0, Math.PI); ctx.clip();
  ctx.fillStyle = '#fffaf2'; ctx.fillRect(CX - POLE, yTop, POLE * 2, h + POLE);
  ctx.fillStyle = L.pal.pole; const off = ((rotNow() * 20) % 24 + 24) % 24;
  for (let yy = yTop - 30 - off; yy < yBottom + 30; yy += 24) { ctx.beginPath(); ctx.moveTo(CX - POLE, yy); ctx.lineTo(CX + POLE, yy - 14); ctx.lineTo(CX + POLE, yy - 5); ctx.lineTo(CX - POLE, yy + 9); ctx.fill(); }
  const g = ctx.createLinearGradient(CX - POLE, 0, CX + POLE, 0); g.addColorStop(0, 'rgba(90,50,60,.18)'); g.addColorStop(.4, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(90,50,60,.25)');
  ctx.fillStyle = g; ctx.fillRect(CX - POLE, yTop, POLE * 2, h + POLE);
  ctx.restore();
}
function beanPath(k) {
  ctx.beginPath(); ctx.moveTo(-6 * k, -15 * k);
  ctx.bezierCurveTo(6 * k, -19 * k, 15 * k, -9 * k, 12 * k, 3 * k); ctx.bezierCurveTo(10 * k, 12 * k, 2 * k, 17 * k, -6 * k, 15 * k);
  ctx.bezierCurveTo(-14 * k, 13 * k, -15 * k, 4 * k, -10 * k, -3 * k); ctx.bezierCurveTo(-7 * k, -7 * k, -14 * k, -12 * k, -6 * k, -15 * k); ctx.closePath();
}
function drawBean(x, y, size, opt = {}) {
  // Bean: a pink jelly bean in a little brown hat
  const k = size / 16, sq = opt.squash || 0, rush = opt.rush, dz = opt.dizzy;
  ctx.save(); ctx.translate(x, y); ctx.scale(1 + sq * .25, 1 - sq * .25); ctx.rotate(opt.tilt || 0);
  if (rush) { for (let j = 0; j < 3; j++) { ctx.globalAlpha = .35 - j * .1; ctx.fillStyle = ['#ffd43b', '#ff9ec4', '#74c0fc'][(j + Math.floor(time * 12)) % 3]; ctx.beginPath(); ctx.arc(0, 0, size * (1.35 + j * .25), 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
  const g = ctx.createRadialGradient(-5 * k, -8 * k, 1, 0, 0, 18 * k); g.addColorStop(0, '#ffc0dc'); g.addColorStop(.55, '#ff5fa2'); g.addColorStop(1, '#d63a7e');
  beanPath(k); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = '#b8306a'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(-3 * k, -9 * k, 4 * k, 2 * k, -.5, 0, TAU); ctx.fill();
  // face
