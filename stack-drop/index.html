<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1f5c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Stack Drop</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#1b1440; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { position:relative; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360;
let H = 680, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
let best = 0, maxLevel = 1, muted = false;
try { const s = JSON.parse(localStorage.getItem('stackdrop') || '{}'); best = s.best || 0; maxLevel = s.level || 1; muted = !!s.muted; } catch (e) {}
const persist = () => { try { localStorage.setItem('stackdrop', JSON.stringify({ best, level: maxLevel, muted })); } catch (e) {} };

function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 560, 780));
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
}

/* ---------- sound (synthesised) ---------- */
let ac = null, nb = null;
function audio() { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, d, type = 'sine', vol = .05, delay = 0, slide = 0) {
  if (!ac || muted) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, f = 2000) {
  if (!ac || muted) return; if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nb; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = .8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + d);
}
const PENT = [0, 2, 4, 7, 9];
const sSmash = n => { const step = n % 15, f = 330 * Math.pow(2, (PENT[step % 5] + 12 * Math.floor(step / 5)) / 12); tone(f, .09, 'triangle', .05); noise(.08, .08, 2600); };
const sBounce = () => tone(220, .12, 'sine', .07, 0, 140);
const sCrash = () => { noise(.4, .25, 700); tone(300, .35, 'sawtooth', .04, 0, -220); };
const sFire = () => { noise(.5, .15, 900); tone(200, .5, 'sawtooth', .03, 0, 400); };
const sWin = () => [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .22, 'triangle', .06, i * .08));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- tower geometry: rings seen from slightly above ---------- */
const CX = W / 2, R = 120, RI = 34, POLE = 22, SY = .36, T = 13, D = 46, SEG = 12, BALL = 13, FRONT = (R + RI) / 2 * SY;
const PALETTES = [
  { bg: ['#ffb3c7', '#7b5cd6'], disc: '#ff5fa2', pole: '#fff1f6' },
  { bg: ['#9be7ff', '#3a5bd9'], disc: '#ffb020', pole: '#f1fbff' },
  { bg: ['#c3f7a8', '#2f8f7a'], disc: '#8a5cf6', pole: '#f4fff0' },
  { bg: ['#ffe29a', '#e0562e'], disc: '#22b8cf', pole: '#fffaf0' },
  { bg: ['#d7c4ff', '#5a2ea6'], disc: '#3ddc84', pole: '#faf6ff' },
  { bg: ['#ffd1a8', '#c2367a'], disc: '#4dabf7', pole: '#fff6ef' },
];
const DARK = '#25213a', DARK_SIDE = '#14121f';
function shade(hex, f) { const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, k = Math.abs(f); const c = s => Math.round(((n >> s) & 255) + (t - ((n >> s) & 255)) * k); return `rgb(${c(16)},${c(8)},${c(0)})`; }

/* ---------- levels ---------- */
function rng32(seed) { let s = seed >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeLevel(n) {
  const rand = rng32(n * 7717 + 3), count = Math.min(110, 40 + n * 5), discs = [];
  const twist = rnd(.12, .3) * (rand() < .5 ? 1 : -1), style = n < 3 ? 0 : Math.floor(rand() * 3);
  let darkRun = 0;
  for (let i = 0; i < count; i++) {
    const segs = Array(SEG).fill(0);
    // dark sections grow with the level; the first few rings are always safe
    const danger = i < 3 ? 0 : Math.min(.55, .08 + n * .035 + i / count * .12);
    let dark = 0;
    if (rand() < .35 + n * .04 && i >= 3) dark = 1 + Math.floor(rand() * Math.min(SEG / 2, 1 + n / 2));
    if (darkRun > 3) dark = 0;
    darkRun = dark ? darkRun + 1 : 0;
    const start = Math.floor(rand() * SEG);
    if (style === 1 && dark) for (let k = 0; k < dark; k++) segs[(start + k * 2) % SEG] = 1;
    else for (let k = 0; k < dark; k++) segs[(start + k) % SEG] = 1;
    if (danger > 0 && rand() < danger * .3) segs[(start + SEG / 2) % SEG] = 1;
    if (segs.every(v => v)) segs[0] = 0;
    discs.push({ segs, off: i * twist, broken: false });
  }
  const spin = (1 + Math.min(1.6, n * .09)) * (rand() < .5 ? 1 : -1), wobble = n >= 4 && rand() < .5;
  return { n, discs, spin, wobble, pal: PALETTES[(n - 1) % PALETTES.length], count };
}

/* ---------- state ---------- */
let L, rot = 0, cur = 0, by = 0, vy = 0, holding = false, heat = 0, fire = 0, state = 'ready', score = 0, levelStart = 0, combo = 0;
let camY = 0, frags = [], splats = [], sparks = [], time = 0, endT = 0, squash = 0, msg = null;
function startLevel(n) {
  L = makeLevel(n); rot = 0; cur = 0; by = -60; vy = 0; heat = 0; fire = 0; combo = 0; frags = []; splats = []; sparks = [];
  camY = by - H * .32; state = 'play'; levelStart = score; endT = 0; msg = { t: 'Level ' + n, life: 1.4 };
}
const discY = i => i * D;                       // world y of a ring's top surface
const rotNow = () => rot + (L.wobble ? Math.sin(time * 1.3) * .8 : 0);
function segAtFront(i) {
  const d = L.discs[i], a = ((Math.PI / 2 - rotNow() - d.off) % TAU + TAU) % TAU;
  return d.segs[Math.floor(a / (TAU / SEG)) % SEG];
}

/* ---------- input: hold to smash ---------- */
function press() {
  audio();
  if (state === 'ready') { startLevel(maxLevel); return; }
  if (state === 'crash' && endT > .6) { score = levelStart; startLevel(L.n); return; }
  if (state === 'win' && endT > .8) { startLevel(L.n + 1); return; }
  holding = true;
}
const release = () => { holding = false; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (x < 50 && y < 56) { location.href = '../'; return; }
  if (x > W - 50 && y < 56) { muted = !muted; persist(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  press();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, release));
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') release(); });
addEventListener('blur', release);

/* ---------- update ---------- */
const G = 2600, BOUNCE = 560, PLUNGE = 720;
function smash(i, viaFire) {
  const d = L.discs[i]; d.broken = true; combo++;
  const pts = 1 + Math.floor(combo / 8); score += pts; if (score > best) best = score;
  if (!viaFire) heat = Math.min(100, heat + 3.4);
  if (heat >= 100 && fire <= 0) { fire = 2.6; heat = 0; sFire(); buzz(40); msg = { t: 'ON FIRE!', life: 1 }; }
  sSmash(combo); if (combo % 5 === 0) buzz(8);
  const y = discY(i), r0 = rotNow() + d.off;
  for (let k = 0; k < SEG; k += 2) {
    const a = r0 + (k + 1) * TAU / SEG;
    frags.push({ y, a0: r0 + k * TAU / SEG, dark: d.segs[k] || d.segs[k + 1], r: 0, vr: rnd(380, 520), vy: rnd(-40, 80), dy: 0, spin: rnd(-6, 6), ang: 0, dir: a, life: .42 });
  }
  if (frags.length > 90) frags.splice(0, frags.length - 90);
}
function crash() {
  state = 'crash'; endT = 0; holding = false; sCrash(); buzz([40, 40, 80]);
  for (let k = 0; k < 26; k++) { const a = rnd(0, TAU), s = rnd(60, 260); sparks.push({ x: CX, y: by + FRONT - BALL, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: rnd(.5, 1), c: k % 2 ? '#fff' : L.pal.disc }); }
  msg = { t: 'Oops!', life: 9 };
}
function win() {
  state = 'win'; endT = 0; holding = false; sWin(); buzz(60);
  maxLevel = Math.max(maxLevel, L.n + 1); persist();
  for (let k = 0; k < 70; k++) sparks.push({ x: rnd(0, W), y: camY + rnd(-40, 0), vx: rnd(-40, 40), vy: rnd(40, 200), life: rnd(1.2, 2.2), c: ['#ffd43b', '#ff6b9d', '#74c0fc', '#69db7c', '#fff'][k % 5], conf: true, rot: rnd(0, 6) });
}
function update(dt) {
  time += dt; squash = Math.max(0, squash - dt * 5);
  if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }
  for (const f of frags) { f.life -= dt; f.r += f.vr * dt; f.vy += 900 * dt; f.dy += f.vy * dt; f.ang += f.spin * dt; } frags = frags.filter(f => f.life > 0);
  for (const s of sparks) { s.life -= dt; s.vy += (s.conf ? 120 : 600) * dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.conf) s.rot += dt * 5; } sparks = sparks.filter(s => s.life > 0);
  for (const s of splats) s.life -= dt; splats = splats.filter(s => s.life > 0);
  if (state !== 'play') { endT += dt; return; }
  rot += L.spin * dt;
  if (fire > 0) fire -= dt;
  if (!holding) { heat = Math.max(0, heat - 28 * dt); combo = 0; }
  const ground = cur >= L.count;
  const contact = discY(Math.min(cur, L.count));
  if (holding && !ground) vy = PLUNGE * (fire > 0 ? 1.25 : 1);
  else vy += G * dt;
  by += vy * dt;
  while (by >= contact && vy > 0) {
    const c = discY(Math.min(cur, L.count));
    if (by < c) break;
    if (cur >= L.count) { by = c; win(); return; }
    if (holding) {
      const dark = segAtFront(cur);
      if (dark && fire <= 0) { by = c; crash(); return; }
      smash(cur, dark && fire > 0); cur++;
      if (cur >= L.count) continue;
    } else {
      by = c; vy = -BOUNCE; squash = 1; sBounce();
      splats.push({ i: cur, a: Math.PI / 2 - rotNow() - L.discs[cur].off, life: 2.2, s: rnd(.8, 1.2) });
      break;
    }
  }
  const target = by - H * .3;
  camY += (target - camY) * Math.min(1, dt * (holding ? 12 : 6));
}

/* ---------- drawing ---------- */
const sy = y => y - camY;                      // world → screen
function ringPath(y, a0, a1, r0, r1) {
  const n = Math.max(2, Math.ceil((a1 - a0) / .12));
  ctx.beginPath();
  for (let k = 0; k <= n; k++) { const a = a0 + (a1 - a0) * k / n; ctx.lineTo(CX + Math.cos(a) * r1, y + Math.sin(a) * r1 * SY); }
  for (let k = n; k >= 0; k--) { const a = a0 + (a1 - a0) * k / n; ctx.lineTo(CX + Math.cos(a) * r0, y + Math.sin(a) * r0 * SY); }
  ctx.closePath();
}
function sidePath(y, a0, a1, r) {   // the outer wall, front half only
  const lo = Math.max(a0, 0), hi = Math.min(a1, Math.PI); if (hi <= lo) return false;
  const n = Math.max(2, Math.ceil((hi - lo) / .12));
  ctx.beginPath();
  for (let k = 0; k <= n; k++) { const a = lo + (hi - lo) * k / n; ctx.lineTo(CX + Math.cos(a) * r, y + Math.sin(a) * r * SY); }
  for (let k = n; k >= 0; k--) { const a = lo + (hi - lo) * k / n; ctx.lineTo(CX + Math.cos(a) * r, y + T + Math.sin(a) * r * SY); }
  ctx.closePath(); return true;
}
function drawDisc(i, y) {
  const d = L.discs[i], r0 = rotNow() + d.off, step = TAU / SEG, col = L.pal.disc, gold = i === L.count;
  // walls first (front half), then tops
  for (let k = 0; k < SEG; k++) {
    let a0 = ((r0 + k * step) % TAU + TAU) % TAU, a1 = a0 + step;
    const dark = !gold && d.segs[k];
    ctx.fillStyle = gold ? '#c99a0e' : dark ? DARK_SIDE : shade(col, -.28);
    if (sidePath(y, a0, a1, R)) ctx.fill();
    if (a1 > TAU && sidePath(y, a0 - TAU, a1 - TAU, R)) ctx.fill();
  }
  for (let k = 0; k < SEG; k++) {
    const a0 = r0 + k * step, a1 = a0 + step, dark = !gold && d.segs[k];
    ringPath(y, a0, a1 + .004, RI, R);
    if (gold) ctx.fillStyle = '#ffd23f';
    else if (dark) ctx.fillStyle = DARK;
    else { const lit = .1 + .12 * Math.sin(a0 + step / 2 + .6); ctx.fillStyle = shade(col, lit); }
    ctx.fill();
    if (dark) { ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  // soft highlight along the front rim
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(CX, y, R - 2, (R - 2) * SY, 0, .25, Math.PI - .25); ctx.stroke();
  for (const s of splats) if (s.i === i) {
    const a = s.a + r0, x = CX + Math.cos(a) * (R + RI) / 2, yy = y + Math.sin(a) * (R + RI) / 2 * SY;
    ctx.globalAlpha = clamp(s.life, 0, 1) * .7; ctx.fillStyle = shade(col, -.45);
    ctx.beginPath(); ctx.ellipse(x, yy, 12 * s.s, 12 * s.s * SY, 0, 0, TAU); ctx.fill();
    for (let k = 0; k < 5; k++) { const q = k * 1.3 + s.s; ctx.beginPath(); ctx.ellipse(x + Math.cos(q) * 15 * s.s, yy + Math.sin(q) * 15 * s.s * SY, 3, 3 * SY, 0, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
function drawPole(yBottom, yTop) {
  const g = ctx.createLinearGradient(CX - POLE, 0, CX + POLE, 0); g.addColorStop(0, shade(L.pal.pole, -.25)); g.addColorStop(.4, L.pal.pole); g.addColorStop(1, shade(L.pal.pole, -.35));
  ctx.fillStyle = g; ctx.fillRect(CX - POLE, yTop, POLE * 2, yBottom - yTop + 6);
  ctx.beginPath(); ctx.ellipse(CX, yBottom + 6, POLE, POLE * SY, 0, 0, Math.PI); ctx.fill();
}
function drawBall() {
  const y = sy(by) + FRONT, r = BALL, sq = squash * .3;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(CX, sy(discY(Math.min(cur, L.count))) + FRONT, r * (1 - Math.min(.6, (discY(cur) - by) / 300)), r * .35, 0, 0, TAU); ctx.fill();
  if (fire > 0) {
    for (let k = 0; k < 6; k++) { ctx.globalAlpha = .5 - k * .07; ctx.fillStyle = k % 2 ? '#ffd43b' : '#ff6b3d'; ctx.beginPath(); ctx.arc(CX + Math.sin(time * 30 + k) * 3, y - r - k * 9, r * (1 - k * .12), 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  } else if (holding && state === 'play') {
    for (let k = 1; k < 5; k++) { ctx.globalAlpha = .18 - k * .03; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(CX, y - r - k * 10, r * (1 - k * .1), 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  const g = ctx.createRadialGradient(CX - 4, y - r - 5, 2, CX, y - r, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, fire > 0 ? '#ffd43b' : L.pal.disc); g.addColorStop(1, shade(fire > 0 ? '#ff6b3d' : L.pal.disc, -.35));
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(CX, y - r * (1 - sq), r * (1 + sq), r * (1 - sq), 0, 0, TAU); ctx.fill();
}
function txt(t, x, y, size, col, align = 'center', stroke = 'rgba(30,20,60,.55)') {
  ctx.font = `900 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size / 5; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); } ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function homeIcon(cx, cy) {
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 8.5, cy + .5); ctx.lineTo(cx, cy - 8); ctx.lineTo(cx + 8.5, cy + .5); ctx.moveTo(cx - 6, cy - 1.5); ctx.lineTo(cx - 6, cy + 8); ctx.lineTo(cx + 6, cy + 8); ctx.lineTo(cx + 6, cy - 1.5); ctx.stroke();
}
function soundIcon(cx, cy) {
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx - 4, cy - 3); ctx.lineTo(cx + 1, cy - 8); ctx.lineTo(cx + 1, cy + 8); ctx.lineTo(cx - 4, cy + 3); ctx.lineTo(cx - 8, cy + 3); ctx.closePath(); ctx.fill();
  if (muted) { ctx.beginPath(); ctx.moveTo(cx + 4, cy - 5); ctx.lineTo(cx + 10, cy + 5); ctx.moveTo(cx + 10, cy - 5); ctx.lineTo(cx + 4, cy + 5); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(cx + 2, cy, 5, -.9, .9); ctx.stroke(); }
}
function draw() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  const pal = L ? L.pal : PALETTES[0];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, pal.bg[0]); g.addColorStop(1, pal.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .12; ctx.fillStyle = '#fff'; for (let k = 0; k < 7; k++) { const x = (k * 97 + 30) % W, y = ((k * 173 - camY * .15) % (H + 200) + H + 200) % (H + 200) - 100; ctx.beginPath(); ctx.arc(x, y, 30 + (k % 3) * 18, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
  if (!L) return;
  // rings from the bottom of the screen upwards, with the pole drawn between them
  let first = Math.max(cur, Math.floor((camY - 40) / D)), last = Math.min(L.count, Math.ceil((camY + H + 40) / D));
  for (let i = last; i >= first; i--) {
    if (i < L.count && L.discs[i].broken) continue;
    const y = sy(discY(i)), above = i - 1 >= first && i - 1 >= cur ? sy(discY(i - 1)) : -20;
    if (i === L.count) { drawGoal(y); drawPole(y, above); continue; }
    drawDisc(i, y); drawPole(y, above);
  }
  // flying pieces of smashed rings
  for (const f of frags) {
    const y = sy(f.y) + f.dy, step = TAU / SEG, a = f.a0 + f.ang * .1, push = f.r;
    ctx.save(); ctx.globalAlpha = clamp(f.life * 2.6, 0, 1);
    ctx.translate(Math.cos(f.dir) * push, Math.sin(f.dir) * push * SY);
    ringPath(y, a, a + step * 2, RI + f.r * .15, R); ctx.fillStyle = f.dark ? DARK : shade(L.pal.disc, .1); ctx.fill(); ctx.restore();
  }
  if (state !== 'crash' || endT < .05) drawBall();
  for (const s of sparks) {
    ctx.globalAlpha = clamp(s.life * 2, 0, 1); ctx.fillStyle = s.c;
    if (s.conf) { ctx.save(); ctx.translate(s.x, sy(s.y)); ctx.rotate(s.rot); ctx.fillRect(-4, -2, 8, 4); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(s.x, sy(s.y), 3.5, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

}
