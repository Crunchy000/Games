<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd8f2">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Honey Heights</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#2f6b3a; }
  #app { position:relative; height:100vh; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Honey Heights: help Bear climb the trees for honey"></canvas></div>
<script>
(() => {
'use strict';
const W = 360, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let H = 680, SC = 1, GROUND = 600, TOP = 150;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const TX = [W * .2, W * .5, W * .8], TRUNK = 30;
const IMG = { bear: new Image(), bean: new Image() }; IMG.bear.src = '../icons/bear.png'; IMG.bean.src = '../icons/bean.png';
let hi = 0; try { hi = +localStorage.getItem('honeyheights-hi') || 0; } catch (e) {}

function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 600, 780)); GROUND = H - 78; TOP = 150;
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W; bgCache = null;
  if (bear) bear.y = clamp(bear.y, TOP, GROUND);
}

/* ---------- sound ---------- */
let ac = null, muted = false;
function beep(f, d, type = 'sine', vol = .05, slide = 0, delay = 0) {
  if (muted) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sGrab = () => [660, 880, 1046].forEach((f, i) => beep(f, .12, 'triangle', .05, 0, i * .05));
const sBank = n => [523, 659, 784, 1046, 1318].slice(0, 2 + n).forEach((f, i) => beep(f, .16, 'triangle', .06, 0, i * .07));
const sBump = () => { beep(420, .35, 'sine', .07, -300); beep(900, .12, 'sawtooth', .02, -500, .05); };
const sLeap = () => beep(300, .18, 'triangle', .04, 300);
const sBuzz = () => beep(170 + Math.random() * 30, .25, 'sawtooth', .012, 20);
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- state ---------- */
let state = 'title', lvl = 1, score = 0, banked = 0, timeLeft = 60, time = 0, stateT = 0, bear = null, hives = [], bees = [], parts = [], toasts = [], falling = [], hiveT = 0, buzzT = 0;
const target = () => 4 + lvl * 2;
function startLevel(n, fresh) {
  lvl = n; if (fresh) score = 0;
  banked = 0; timeLeft = 45; hives = []; bees = []; parts = []; toasts = []; falling = []; hiveT = 0;
  bear = { tree: 1, x: TX[1], y: GROUND, ty: GROUND, carry: 0, dizzy: 0, safe: 0, leap: null, climb: 0, face: 1 };
  for (let i = 0; i < 3; i++) addHive();
  const patrol = Math.min(5, 1 + Math.floor((lvl - 1) * .75));
  for (let i = 0; i < patrol; i++) bees.push(newPatrol(i, patrol));
  state = 'play'; stateT = 0;
}
function newPatrol(i, n) {
  const y = TOP + 40 + (GROUND - TOP - 120) * (n === 1 ? .45 : i / (n - 1)) + rnd(-15, 15);
  return { kind: 'patrol', x: rnd(0, W), y, by: y, vx: (Math.random() < .5 ? -1 : 1) * (42 + Math.min(lvl, 10) * 5 + rnd(0, 12)), ph: rnd(0, 6), amp: rnd(10, 26), life: 1e9 };
}
function addHive() {
  for (let tries = 0; tries < 30; tries++) {
    const tree = Math.floor(Math.random() * 3), y = rnd(TOP + 20, GROUND - 110), side = Math.random() < .5 ? -1 : 1;
    if (hives.some(h => h.tree === tree && Math.abs(h.y - y) < 70)) continue;
    const gold = lvl >= 2 && Math.random() < .18;
    hives.push({ tree, y, side, gold, grow: 0, sway: rnd(0, 6) }); return;
  }
}

/* ---------- input: drag Bear up and down; slide onto another tree to leap ---------- */
let touch = null;
function local(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
const treeAt = x => x < W * .35 ? 0 : x > W * .65 ? 2 : 1;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = local(e);
  if (p.x < 48 && p.y < 54) { location.href = '../'; return; }
  if (p.x > W - 48 && p.y < 54) { muted = !muted; beep(660, .08, 'triangle', .05); return; }
  if (state === 'title' || (state === 'over' && stateT > .8)) { startLevel(1, true); beep(520, .15, 'triangle', .06, 300); return; }
  if (state === 'win' && stateT > .8) { startLevel(lvl + 1); return; }
  if (state !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  touch = p; steer(p);
});
cv.addEventListener('pointermove', e => { if (touch) { touch = local(e); steer(touch); } });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { touch = null; }));
function steer(p) {
  if (!bear || bear.dizzy > 0) return;
  bear.ty = clamp(p.y + 10, TOP, GROUND);
  const t = treeAt(p.x);
  if (t !== bear.tree && !bear.leap) leap(t > bear.tree ? bear.tree + 1 : bear.tree - 1);
}
function leap(to) {
  if (to < 0 || to > 2 || bear.leap || bear.dizzy > 0) return;
  bear.leap = { from: bear.tree, to, t: 0, x0: bear.x, y0: bear.y }; bear.face = to > bear.tree ? 1 : -1; bear.tree = to; sLeap();
}
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((state === 'title' || (state === 'over' && stateT > .8)) && [' ', 'Enter'].includes(e.key)) startLevel(1, true);
  else if (state === 'win' && stateT > .8 && [' ', 'Enter'].includes(e.key)) startLevel(lvl + 1);
  if (state === 'play') { if (e.key === 'ArrowLeft') leap(bear.tree - 1); if (e.key === 'ArrowRight') leap(bear.tree + 1); }
});
addEventListener('keyup', e => { keys[e.key] = false; });

/* ---------- update ---------- */
function toast(t, x, y, c = '#fff', size = 15) { toasts.push({ t, x, y, c, size, life: 1.2 }); }
function puff(x, y, c, n = 8, sp = 90) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(20, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, g: 160, life: rnd(.4, .8), max: .8, s: rnd(1.5, 3.2), c }); } }
function bump(from) {
  if (bear.safe > 0 || bear.dizzy > 0) return;
  bear.dizzy = 1.3; bear.safe = 2.6; sBump(); if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
  if (bear.carry) { for (let i = 0; i < bear.carry; i++) falling.push({ x: bear.x + rnd(-10, 10), y: bear.y - 30, vx: rnd(-50, 50), vy: rnd(-120, -40), r: 0, vr: rnd(-6, 6) }); toast('Dropped the honey!', bear.x, bear.y - 70, '#ffe08a', 14); bear.carry = 0; }
  else toast('Buzz off!', bear.x, bear.y - 70, '#fff', 15);
  bear.ty = Math.min(GROUND, bear.y + 110);
  if (from) from.vx = -from.vx;
}
function update(dt) {
  time += dt; stateT += dt;
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; } parts = parts.filter(q => q.life > 0);
  for (const t of toasts) { t.life -= dt; t.y -= 26 * dt; } toasts = toasts.filter(t => t.life > 0);
  for (const f of falling) { f.vy += 600 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.r += f.vr * dt; if (f.y > GROUND + 10 && !f.splat) { f.splat = .8; puff(f.x, GROUND + 6, '#f2b72a', 8, 70); } if (f.splat) f.splat -= dt; }
  falling = falling.filter(f => !f.splat || f.splat > 0);
  for (const h of hives) h.grow = Math.min(1, h.grow + dt * 2.5);
  if (state !== 'play') { for (const b of bees) moveBee(b, dt); return; }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; end(); return; }
  // bear
  const B = bear, wasDizzy = B.dizzy > 0; B.dizzy = Math.max(0, B.dizzy - dt); B.safe = Math.max(0, B.safe - dt);
  if (wasDizzy && B.dizzy <= 0 && touch) steer(touch);   // keep following a finger that stayed down
  if (keys.ArrowUp) B.ty = Math.max(TOP, B.y - 40); if (keys.ArrowDown) B.ty = Math.min(GROUND, B.y + 40);
  if (B.leap) {
    B.leap.t += dt / .38; const t = Math.min(1, B.leap.t), e = t * t * (3 - 2 * t);
    B.x = B.leap.x0 + (TX[B.leap.to] - B.leap.x0) * e; B.y = B.leap.y0 - Math.sin(Math.PI * t) * 34;
    if (t >= 1) { B.y = B.leap.y0; B.x = TX[B.leap.to]; B.leap = null; puff(B.x, B.y - 20, '#7bbf5a', 6, 60); if (touch) steer(touch); }
  } else {
    const sp = B.dizzy > 0 ? 260 : 190, d = B.ty - B.y;
    if (Math.abs(d) > 1) { B.y += Math.sign(d) * Math.min(Math.abs(d), sp * dt); B.climb += dt * (B.dizzy > 0 ? 0 : 1); }
  }
  // grab honey
  if (!B.leap && B.dizzy <= 0 && B.carry < 3) for (const h of hives) {
    if (h.tree !== B.tree || h.grow < 1 || Math.abs(h.y + 14 - (B.y - 26)) > 26) continue;
    const n = h.gold ? 3 : 1; const take = Math.min(n, 3 - B.carry); B.carry += take; h.gone = true; sGrab(); B.safe = Math.max(B.safe, .9);
    toast(h.gold ? 'Golden hive!' : '+1 honey', TX[h.tree] + h.side * 30, h.y - 10, '#ffe08a');
    puff(TX[h.tree] + h.side * 26, h.y + 10, '#f7c331', 12);
    const angry = h.gold ? 3 : Math.min(3, 1 + Math.floor(lvl / 3));
    for (let i = 0; i < angry; i++) bees.push({ kind: 'angry', x: TX[h.tree] + h.side * (40 + i * 10), y: h.y + 6 - i * 8, vx: 0, vy: 0, ph: rnd(0, 6), life: 3.8 + lvl * .3, sp: 70 + lvl * 8 + i * 10, wait: .7 + i * .15 });
    hiveT = 0; break;
  }
  hives = hives.filter(h => !h.gone);
  hiveT += dt; if (hives.length < 3 && hiveT > 1.2) { addHive(); hiveT = 0; }
  // bank at the bottom
  if (B.carry && B.y >= GROUND - 2 && !B.leap) {
    banked += B.carry; score += B.carry * 100 + (B.carry === 3 ? 150 : 0); sBank(B.carry);
    toast(B.carry === 3 ? '+3 honey! Full load bonus' : '+' + B.carry + ' honey', B.x, GROUND - 70, '#ffe08a', 16);
    puff(B.x, GROUND - 20, '#ffd84a', 16, 120); B.carry = 0; beanCheer = 1;
    if (banked >= target()) { win(); return; }
  }
  // bees
  for (const b of bees) {
    moveBee(b, dt);
    if (!(b.wait > 0) && Math.hypot(b.x - B.x, b.y - (B.y - 26)) < 20 && !B.leap) bump(b);
  }
  bees = bees.filter(b => b.life > 0);
  buzzT -= dt; if (buzzT <= 0) { buzzT = .5; if (bees.some(b => b.kind === 'angry' || Math.hypot(b.x - B.x, b.y - B.y) < 90)) sBuzz(); }
  beanCheer = Math.max(0, beanCheer - dt * 1.5);
}
let beanCheer = 0;
function moveBee(b, dt) {
  b.ph += dt * 3;
  if (b.kind === 'patrol') {
    b.x += b.vx * dt; b.y = b.by + Math.sin(b.ph) * b.amp;
    if (b.x < -20) { b.x = -20; b.vx = Math.abs(b.vx); } if (b.x > W + 20) { b.x = W + 20; b.vx = -Math.abs(b.vx); }
  } else {
    b.life -= dt;
    if (b.wait > 0) { b.wait -= dt; b.y += Math.sin(b.ph * 4) * .4; return; }   // buzz about the hive for a moment before giving chase
    const tx = bear.x + Math.sin(b.ph * 1.7) * 14, ty = bear.y - 30 + Math.cos(b.ph * 1.3) * 10, dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
    const sp = b.life < .6 ? -120 : b.sp; b.vx += (dx / d * sp - b.vx) * Math.min(1, dt * 2.2); b.vy += (dy / d * sp - b.vy) * Math.min(1, dt * 2.2);
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
}
function win() {
  state = 'win'; stateT = 0; const bonus = Math.round(timeLeft) * 10; score += bonus; toast('+' + bonus + ' time bonus', W / 2, H * .5, '#fff', 15);
  [523, 659, 784, 1046, 1318].forEach((f, i) => beep(f, .2, 'triangle', .06, 0, i * .1));
  bees.forEach(b => { b.kind = 'angry'; b.life = .5; });
  if (score > hi) { hi = score; try { localStorage.setItem('honeyheights-hi', hi); } catch (e) {} }
}
function end() {
  state = 'over'; stateT = 0; [392, 330, 262].forEach((f, i) => beep(f, .25, 'sine', .06, 0, i * .14));
  if (score > hi) { hi = score; try { localStorage.setItem('honeyheights-hi', hi); } catch (e) {} }
}

/* ---------- drawing ---------- */
function ell(x, y, rx, ry, c, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, 6.2832); ctx.fillStyle = c; ctx.fill(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(t, x, y, size, col, align = 'center', stroke = 'rgba(40,24,6,.85)', w = 900) {
  ctx.font = `${w} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 4); ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
let bgCache = null;
function buildBG() {
  const c = document.createElement('canvas'); c.width = Math.ceil(W * SC); c.height = Math.ceil(H * SC); const g = c.getContext('2d'); g.setTransform(SC, 0, 0, SC, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#8fd3f4'); sky.addColorStop(.6, '#d6f1e4'); sky.addColorStop(1, '#bfe6a8'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.85)'; for (const [x, y, s] of [[60, 70, 1], [260, 50, 1.2], [180, 110, .8]]) { for (const [dx, dy, r] of [[0, 0, 16], [16, -6, 20], [34, 0, 15], [17, 6, 16]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 6.3); g.fill(); } }
  // far hills and trees
  g.fillStyle = '#9fd38a'; g.beginPath(); g.moveTo(0, GROUND - 60); for (let x = 0; x <= W; x += 30) g.quadraticCurveTo(x + 15, GROUND - 95 - (x * 7 % 30), x + 30, GROUND - 60); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  g.fillStyle = '#7cbf6a'; for (let x = 10; x < W; x += 34) { g.beginPath(); g.arc(x, GROUND - 58, 18 + (x * 3 % 9), 0, 6.3); g.fill(); }
  // ground
  const gr = g.createLinearGradient(0, GROUND, 0, H); gr.addColorStop(0, '#6cbf4f'); gr.addColorStop(1, '#3f8f38'); g.fillStyle = gr; g.fillRect(0, GROUND - 4, W, H);
  g.strokeStyle = '#4a9a3a'; g.lineWidth = 1.5; for (let x = 4; x < W; x += 7) { g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x + 2, GROUND - 6 - (x * 13 % 5)); g.stroke(); }
  for (let i = 0; i < 14; i++) { const x = (i * 53 + 17) % W, y = GROUND + 18 + (i * 29 % (H - GROUND - 30)); g.fillStyle = ['#fff', '#ffd6e8', '#fff2a8'][i % 3]; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.26) * 3, y + Math.sin(k * 1.26) * 3, 2.2, 0, 6.3); g.fill(); } g.fillStyle = '#f2b72a'; g.beginPath(); g.arc(x, y, 1.6, 0, 6.3); g.fill(); }
  // the three big trees
  for (const x of TX) {
    const tg = g.createLinearGradient(x - TRUNK / 2, 0, x + TRUNK / 2, 0); tg.addColorStop(0, '#6b4423'); tg.addColorStop(.45, '#946238'); tg.addColorStop(1, '#5a381b');
    g.fillStyle = tg; g.beginPath(); g.moveTo(x - TRUNK / 2, TOP - 30); g.lineTo(x + TRUNK / 2, TOP - 30); g.lineTo(x + TRUNK / 2 + 6, GROUND + 4); g.quadraticCurveTo(x, GROUND - 4, x - TRUNK / 2 - 6, GROUND + 4); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(50,28,10,.35)'; g.lineWidth = 1.2; for (let y = TOP; y < GROUND; y += 18) { g.beginPath(); g.moveTo(x - 9 + (y * 7 % 6), y); g.quadraticCurveTo(x - 6, y + 8, x - 8 + (y % 5), y + 14); g.stroke(); g.beginPath(); g.moveTo(x + 7, y + 6); g.quadraticCurveTo(x + 9, y + 12, x + 6, y + 18); g.stroke(); }
    g.fillStyle = '#5a381b'; g.beginPath(); g.ellipse(x + 3, GROUND - 120, 4, 6, 0, 0, 6.3); g.fill();
  }
  // canopy across the top
  const can = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill(); };
  for (const x of TX) { can(x - 40, TOP - 50, 40, '#3f8f38'); can(x + 40, TOP - 50, 40, '#3f8f38'); can(x, TOP - 70, 48, '#4ea345'); can(x - 22, TOP - 34, 32, '#5cb24f'); can(x + 26, TOP - 30, 30, '#5cb24f'); }
  for (let i = 0; i < 40; i++) can(rnd(0, W), rnd(TOP - 110, TOP - 20), rnd(4, 9), 'rgba(140,210,110,.5)');
  // Bean's honey jar at the foot of the middle tree
  bgCache = c;
}
function drawHive(h) {
  const x = TX[h.tree] + h.side * (TRUNK / 2 + 20), y = h.y, s = h.grow * (h.gold ? 1.15 : 1), sw = Math.sin(time * 2 + h.sway) * .08;
  // branch
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(TX[h.tree] + h.side * TRUNK / 2 - h.side * 2, y + 4); ctx.quadraticCurveTo(x - h.side * 6, y - 8, x + h.side * 10, y - 6); ctx.stroke();
  ell(x + h.side * 14, y - 9, 7, 4, '#5cb24f', h.side * .4);
  ctx.save(); ctx.translate(x, y - 4); ctx.rotate(sw); ctx.scale(s, s);
  ctx.strokeStyle = '#4a2e14'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 6); ctx.stroke();
  const g = ctx.createRadialGradient(-4, 12, 2, 0, 18, 16); g.addColorStop(0, h.gold ? '#fff2a0' : '#ffd36b'); g.addColorStop(1, h.gold ? '#e8a400' : '#d48a1a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(13, 6, 15, 26, 0, 32); ctx.bezierCurveTo(-15, 26, -13, 6, 0, 5); ctx.fill();
  ctx.strokeStyle = h.gold ? '#b87a00' : '#a8620e'; ctx.lineWidth = 1.4; for (const yy of [12, 18, 24]) { const w = 12 - Math.abs(yy - 18) * .5; ctx.beginPath(); ctx.moveTo(-w, yy); ctx.quadraticCurveTo(0, yy + 3, w, yy); ctx.stroke(); }
  ell(0, 27, 3, 2.4, '#5a3410');
  if (h.gold) { ctx.fillStyle = '#fff'; ctx.globalAlpha = .6 + .4 * Math.sin(time * 6); ctx.beginPath(); ctx.arc(-6, 10, 1.8, 0, 6.3); ctx.arc(7, 20, 1.3, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
}
function drawBee(b) {
  const angry = b.kind === 'angry', dir = b.vx < 0 ? -1 : 1, flap = Math.sin(time * 50 + b.ph) * .5 + .5;
