<title>Pyramid Hop</title>
<meta name="description" content="Hop a hedgehog round a jungle pyramid to light every cube (a second hop puts it out) while snakes slither up from the bottom. Free to play, works offline, no ads or tracking. From The Bear &amp; Bean Games.">
<link rel="canonical" href="https://bearandbean.uk/pyramid-hop/">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#05040c; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  #app { height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; }

<script id="pub-kit-canvas">
/* The Bear & Bean house style for canvas games: soft clay, drawn with a 2D context.
   tools/pub-kit.py copies this into each canvas game that uses it. */
window.PK = (() => {
  const CLAY = '#c8643b', CLAY_LO = '#a94f2c', SAGE = '#dce3d3', SAGE_INK = '#3f4e35', SAGE_LO = '#c3ccb8';
  const CARD = '#f7f1e7', CARD_2 = '#efe5d6', INK = '#3b2e22', INK_2 = '#6e6152', INK_3 = '#8e7f6c', ON_CLAY = '#fff5ec', CLAY_TEXT = '#b5532e';
  const SLAB = '"ui-rounded","SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,sans-serif';
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  // a rounded button centred on (x, y); alt = sage
  function plank(g, x, y, w, h, label, opt = {}) {
    const x0 = x - w / 2, y0 = y - h / 2 + (opt.pressed ? 2 : 0), r = Math.min(16, h / 2);
    g.save();
    g.fillStyle = opt.alt ? 'rgba(60,75,45,.14)' : 'rgba(120,55,25,.2)'; rr(g, x0, y0 + 6, w, h, r); g.fill();
    g.fillStyle = opt.alt ? SAGE_LO : CLAY_LO; rr(g, x0, y0 + 2, w, h, r); g.fill();
    g.fillStyle = opt.alt ? SAGE : CLAY; rr(g, x0, y0, w, h, r); g.fill();
    g.font = `700 ${opt.size || 17}px ${SLAB}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = opt.alt ? SAGE_INK : ON_CLAY; g.fillText(label, x, y0 + h / 2 + 1);
    g.restore();
  }
  // a soft cream card
  function board(g, x, y, w, h) {
    g.save();
    g.fillStyle = 'rgba(50,30,12,.16)'; rr(g, x + 1, y + 10, w - 2, h, 24); g.fill();
    g.fillStyle = 'rgba(50,30,12,.1)'; rr(g, x, y + 3, w, h, 24); g.fill();
    g.fillStyle = CARD; rr(g, x, y, w, h, 24); g.fill();
    g.restore();
  }
  // a small rounded square button with an icon drawn by fn(g, cx, cy)
  function sign(g, x, y, w, h, fn) {
    g.save();
    g.fillStyle = 'rgba(50,30,12,.18)'; rr(g, x, y + 3, w, h, 13); g.fill();
    g.fillStyle = CARD; rr(g, x, y, w, h, 13); g.fill();
    g.strokeStyle = INK; g.fillStyle = INK; g.lineWidth = 2; g.lineJoin = 'round'; g.lineCap = 'round';
    if (fn) fn(g, x + w / 2, y + h / 2);
    g.restore();
  }
  function house(g, cx, cy) { g.beginPath(); g.moveTo(cx - 8, cy); g.lineTo(cx, cy - 7); g.lineTo(cx + 8, cy); g.moveTo(cx - 5.5, cy - 2); g.lineTo(cx - 5.5, cy + 7); g.lineTo(cx + 5.5, cy + 7); g.lineTo(cx + 5.5, cy - 2); g.stroke(); }
  function homeSign(g, x, y, w = 38, h = 38) { sign(g, x, y, w, h, house); }
  // "THE BEAR & BEAN PRESENTS" with both faces
  function presents(g, x, y, imgs, opt = {}) {
    const s = opt.size || 10, txt = (opt.text || 'THE BEAR & BEAN PRESENTS').split('').join(String.fromCharCode(8202));
    g.save(); g.font = `700 ${s}px ${SLAB}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(txt).width, r = s * 1.15;
    g.fillStyle = opt.color || INK_3; g.fillText(txt, x, y);
    if (imgs) [[imgs[0], x - tw / 2 - r - 6], [imgs[1], x + tw / 2 + r + 6]].forEach(([im, cx]) => face(g, im, cx, y, r));
    g.restore();
  }
  function face(g, im, cx, cy, r) {
    g.save(); g.fillStyle = 'rgba(60,35,15,.22)'; g.beginPath(); g.arc(cx, cy + 1, r + 2, 0, 6.2832); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, r + 2, 0, 6.2832); g.fill();
    if (im && im.complete && im.naturalWidth) { g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.clip(); g.drawImage(im, cx - r, cy - r, r * 2, r * 2); }
    g.restore();
  }
  // a word from Bear or Bean
  function says(g, x, y, w, im, who, line, opt = {}) {
    g.save(); const h = 54;
    g.fillStyle = CARD_2; rr(g, x, y, w, h, 16); g.fill();
    face(g, im, x + 30, y + h / 2, 18);
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = `700 10px ${SLAB}`; g.fillStyle = CLAY_TEXT; g.fillText(who.toUpperCase() + ' SAYS', x + 58, y + 17);
    g.font = `700 ${opt.size || 14}px ${SLAB}`; g.fillStyle = INK; g.fillText(line, x + 58, y + 36);
    g.restore();
  }
  // CREAM and CREAM_DIM are the text colours to use on a card (named before the restyle)
  return { plank, board, sign, homeSign, house, presents, face, says, rr, SLAB, CREAM: INK, CREAM_DIM: INK_2, INK, INK_2, INK_3, CLAY, CLAY_TEXT, CARD, BRASS: CLAY_TEXT };
})();
</script>
<script id="pub-kit-settings">
window.BB = (() => {
  const KEY = 'bearbean-settings'; let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  return {
    get muted() { return 'muted' in s ? !!s.muted : null; }, set muted(v) { s.muted = !!v; put(); },
    get theme() { return s.theme || null; }, set theme(v) { if (v) s.theme = v; else delete s.theme; put(); },
  };
})();
</script>

<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360, CX = 180, TW = 46, SD = 28, RY = 39, N = 7, HW = TW / 2, HH = 13;
let H = 560, Y0 = 150, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DR = [-1, -1, 1, 1, 0], DC = [-1, 0, 0, 1, 0];      // 0 up-left, 1 up-right, 2 down-left, 3 down-right, 4 hop on the spot
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
let hi = 0; try { hi = +localStorage.getItem('pyramidhop-hi') || 0; } catch (e) {}

/* ---------- sizing ---------- */
let bgCache = null;
function resize() {
  const oldY = Y0;
  H = Math.round(clamp(W * innerHeight / innerWidth, 500, 740)); Y0 = Math.round(H * .5 - 128);
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
  bgCache = null; const d = Y0 - oldY; parts.forEach(q => q.y += d); toasts.forEach(t => t.y += d);
  if (p && p.fall) p.fall.y += d; if (enemies) enemies.forEach(e => { if (e.fall) e.fall.y += d; });
}

/* ---------- audio ---------- */
let ac = null;
function beep(f, d, type = 'square', vol = .04, slide = 0, delay = 0) { if (BB.muted) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- themes ---------- */
const PALS = [   // weathered temple stone in the rainforest: morning, golden afternoon, misty dusk
  { top: ['#8d917b', '#d9a441', '#3fcf96'], l: '#4b5040', r: '#686d58', sky: ['#d9efcf', '#8fcf98', '#2f7350'], far: '#6fae80', mid: '#3f8456', near: '#1d5236', sun: 'rgba(255,246,200,.75)', mist: 'rgba(235,255,235,.35)' },
  { top: ['#91877c', '#ffb02e', '#ff7aa8'], l: '#4f4540', r: '#6e625a', sky: ['#ffe2a8', '#f0a26e', '#6e4a52'], far: '#a87a6a', mid: '#6b5048', near: '#33282c', sun: 'rgba(255,220,150,.8)', mist: 'rgba(255,230,200,.3)' },
  { top: ['#808d8c', '#7cd0ff', '#ffe066'], l: '#3e4a4a', r: '#5a6a69', sky: ['#e6f3f2', '#9ccbc5', '#2c605c'], far: '#8bbab2', mid: '#4f8a80', near: '#1e4c46', sun: 'rgba(240,255,250,.6)', mist: 'rgba(240,255,250,.45)' }
];
let state = 'title', lvl = 1, score = 0, lives = 3, cubes, cfx, rescues = 2, enemies = [], p, pal = PALS[0], mode = { steps: 1 };
let chain = 0, powerT = 0, spawnT = 0, stateT = 0, deadT = 0, time = 0, lvlTime = 0, overT = 0, shake = 0, toasts = [], parts = [], fwT = 0, slow = 1;

const valid = (r, c) => r >= 0 && r < N && c >= 0 && c <= r;
const P = (r, c) => ({ x: CX + (c - r / 2) * TW, y: Y0 + r * RY });
const target = () => mode.toggle ? 1 : mode.steps;
const doneCount = () => cubes.reduce((a, row) => a + row.filter(s => s === target()).length, 0);

function setupLevel() {
  pal = PALS[(lvl - 1) % 3]; bgCache = null;
  mode = lvl % 2 === 1 ? { steps: 1 } : { steps: 2 };   // every level: hop on a lit cube again and its light goes out
  cubes = Array.from({ length: N }, (_, r) => Array(r + 1).fill(0));
  cfx = Array.from({ length: N }, (_, r) => Array(r + 1).fill(0));
  rescues = 0;
  enemies = []; powerT = 0; spawnT = 3; lvlTime = 0; toasts = []; parts = [];
  resetPlayer();
}
function resetPlayer() { p = { r: 0, c: 0, pr: 0, pc: 0, t: 1, hop: false, kind: 'cube', buf: -1, fall: null, ride: null, face: 3, dead: false, splat: false, sq: 0, blink: 2 }; }
function startGame() { lvl = 1; score = 0; lives = 3; setupLevel(); state = 'play'; beep(400, .2, 'triangle', .07, 400); beep(600, .2, 'triangle', .06, 600, .12); }

/* ---------- input: swipe diagonally / tap toward target ---------- */
// a swipe needs a little travel before it counts, and keeping the finger down needs a longer drag (and a short pause) for another hop
const surf = document.getElementById('app'), ptrs = new Map(), SW = 36, SW_AGAIN = 64, AGAIN_MS = 220;
const dirOf = (dx, dy) => dy < 0 ? (dx < 0 ? 0 : 1) : (dx < 0 ? 2 : 3);
function onDir(d) { if (state === 'title' || (state === 'over' && overT > .8)) { startGame(); return; } move(d); }
surf.addEventListener('pointerdown', e => { e.preventDefault(); { const r = cv.getBoundingClientRect(), lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height; if (lx < 48 && ly < 52 && lx > -20) { location.href = '../'; return; } } try { surf.setPointerCapture(e.pointerId); } catch (_) {} ptrs.set(e.pointerId, { ax: e.clientX, ay: e.clientY, t: performance.now(), moved: false }); });
surf.addEventListener('pointermove', e => {
  const q = ptrs.get(e.pointerId); if (!q) return;
  const dx = e.clientX - q.ax, dy = e.clientY - q.ay;
  const now = performance.now();
  if (Math.hypot(dx, dy) > (q.moved ? SW_AGAIN : SW) && (!q.moved || now - q.last > AGAIN_MS)) { q.moved = true; q.last = now; q.ax = e.clientX; q.ay = e.clientY; onDir(dirOf(dx, dy)); }
});
function endPtr(e) {
  const q = ptrs.get(e.pointerId); if (!q) return; ptrs.delete(e.pointerId);
  if (!q.moved && e.type === 'pointerup' && performance.now() - q.t < 300) {
    if (state !== 'play') { onDir(0); return; }
    const r = cv.getBoundingClientRect(), lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
    onDir(4);   // a tap hops on the spot, switching that cube's light
  }
}
['pointerup', 'pointercancel'].forEach(ev => surf.addEventListener(ev, endPtr));
surf.addEventListener('contextmenu', e => e.preventDefault());
const KM = { q: 0, w: 1, a: 2, s: 3, ArrowLeft: 0, ArrowUp: 1, ArrowDown: 2, ArrowRight: 3 };
addEventListener('keydown', e => { if (e.key in KM) { e.preventDefault(); onDir(KM[e.key]); } else if (e.key === ' ') { e.preventDefault(); onDir(3); } });

/* ---------- particles ---------- */
function addP(o) { if (parts.length < 420) parts.push(o); }
function puff(x, y, col, n = 6) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28); addP({ k: 'dot', x, y, vx: Math.cos(a) * rnd(20, 50), vy: Math.sin(a) * rnd(8, 20) - 10, g: 0, life: rnd(.3, .5), max: .5, s: rnd(1.5, 3), c: col }); } }
function sparkle(x, y, col, n = 8) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(40, 120); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 180, life: rnd(.35, .7), max: .7, s: rnd(1.5, 2.8), c: col }); } }
function isoRing(x, y, col) { addP({ k: 'ring', x, y, vx: 0, vy: 0, g: 0, life: .4, max: .4, s: 30, c: col }); }
function firework(x, y) { const col = pick(['#ffd43b', '#ff6b9d', '#74c0fc', '#69db7c', '#da77f2', '#ffffff']); for (let i = 0; i < 26; i++) { const a = i / 26 * 6.28, s = rnd(70, 130); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 90, life: rnd(.7, 1.1), max: 1.1, s: 2.2, c: col }); } beep(rnd(200, 400), .3, 'triangle', .03, -100); }

/* ---------- actors ---------- */
function gpos(a) {   // position without hop arc (ground track)
  if (a.hop) { const A = P(a.pr, a.pc), B = P(a.r, a.c), t = a.t; return { x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t }; }
  return P(a.r, a.c);
}
function pos(a) {
  if (a.fall) return { x: a.fall.x, y: a.fall.y };
  if (a.ride) { const B = P(0, 0), t = a.ride.t, e = t * t * (3 - 2 * t); return { x: a.ride.x0 + (B.x - a.ride.x0) * e, y: a.ride.y0 + (B.y - a.ride.y0) * e - Math.sin(Math.PI * t) * 60 }; }
  if (a.hop) { const g = gpos(a); return a.crawl ? g : { x: g.x, y: g.y - Math.sin(Math.PI * a.t) * (a.type ? 14 : 22) }; }
  return P(a.r, a.c);
}
const hopH = a => a.hop && !a.crawl ? Math.sin(Math.PI * a.t) * (a.type ? 14 : 22) : 0;
function move(d) {
  if (state !== 'play' || p.dead || p.fall || p.ride) return;
  if (p.hop) { p.buf = d; return; }
  const nr = p.r + DR[d], nc = p.c + DC[d];
  if (d < 4) p.face = d; p.pr = p.r; p.pc = p.c; p.r = nr; p.c = nc; p.hop = true; p.t = 0;
  p.kind = valid(nr, nc) ? 'cube' : 'off';
  beep(520 + (d % 2) * 60, .06, 'square', .025, 120);
}
function landPlayer() {
  const at = P(p.r, p.c);
  if (p.kind === 'cube') {
    p.sq = 1; const s = cubes[p.r][p.c]; let changed = false;
    if (s >= target()) { cubes[p.r][p.c] = 0; changed = true; toast('LIGHTS OUT', at.x, at.y - 34, '#cfd8dc', 10); beep(300, .18, 'sine', .04, -140); }
    else { cubes[p.r][p.c]++; changed = true; score += 25; toast('+25', at.x, at.y - 34, '#fff', 10); }
    if (changed) {
      cfx[p.r][p.c] = 1; const nc = topColor(p.r, p.c, cubes[p.r][p.c]);
      isoRing(at.x, at.y, nc); sparkle(at.x, at.y, nc, cubes[p.r][p.c] === target() ? 10 : 5);
      if (cubes[p.r][p.c]) beep(cubes[p.r][p.c] === target() ? 880 : 660, .08, 'triangle', .04, 200);
    } else puff(at.x, at.y + 2, 'rgba(255,255,255,.7)', 4);
    if (cubes.every(row => row.every(s => s === target()))) { win(); return; }
    if (p.buf >= 0) { const d = p.buf; p.buf = -1; move(d); }
  } else {
    const q = pos(p); p.fall = { x: q.x, y: q.y, vy: -60, t: 0, rescue: true }; p.buf = -1;
    if (p.fall.rescue) { beep(500, .3, 'sawtooth', .04, -300); beep(1400, .12, 'square', .03, 300, .15); beep(1700, .12, 'square', .03, 300, .27); toast('WHOOPS!', q.x, q.y - 30, '#fff', 14); }
    else { beep(500, .7, 'sawtooth', .05, -420); toast('WHOOPS!', q.x, q.y - 30, '#fff', 14); }
  }
}
function win() {
  state = 'win'; stateT = 3; enemies.forEach(e => sparkle(pos(e).x, pos(e).y, '#fff', 6)); enemies = []; fwT = 0;
  score += 500 + (rescues ? 0 : 300);
  [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .22, 'triangle', .06, 0, i * .12));
}
function toast(t, x, y, col = '#ffd43b', size = 13) { toasts.push({ t, x, y, life: 1.2, col, size }); }
function shoo(e) {   // a nervous snake bumped by a powered-up hedgehog bounces off home, Pac-Man style points
  const q = pos(e); e.fall = { x: q.x, y: q.y, vy: -220, spin: 0 }; chain++;
  const pts = 200 * Math.pow(2, Math.min(3, chain - 1)); score += pts;
  toast('SHOOED! +' + pts, q.x, q.y - 24, '#ffd43b', 13); sparkle(q.x, q.y - 6, '#a5d8ff', 10); isoRing(q.x, q.y, '#ffd43b');
  beep(520 + chain * 120, .14, 'triangle', .05, 300); beep(780 + chain * 120, .16, 'triangle', .04, 300, .08);
}
function kill() {
  if (p.dead) return; p.dead = true; p.splat = true; deadT = 1.6; shake = 7; slow = .35;
  const q = pos(p); for (let i = 0; i < 14; i++) { const a = rnd(3.3, 6.1); addP({ k: 'dot', x: q.x, y: q.y - 8, vx: Math.cos(a) * rnd(40, 110), vy: Math.sin(a) * rnd(60, 150), g: 420, life: rnd(.5, .9), max: .9, s: rnd(2, 4), c: '#ff7fb5' }); }
  beep(150, .5, 'sawtooth', .07, -100); beep(90, .4, 'square', .05, -40, .1);
}

/* ---------- enemies: snakes slither up from the bottom (c wanders, k chases); frost crystal (g) drops from the top ---------- */
function spawn() {
  const alive = enemies.filter(e => !e.fall && !e.leaving);
  if (alive.length >= Math.min(2 + Math.floor(lvl / 3), 4)) return;
  const hasK = alive.some(e => e.type === 'k'), hasG = alive.some(e => e.type === 'g');
  const roll = Math.random(); let type = 'c';
  if (lvl >= 2 && !hasK && roll < .4) type = 'k'; else if (!hasG && roll > .78) type = 'g';
  if (type === 'g') {
    enemies.push({ type, pr: -1, pc: 0, r: 1, c: Math.random() < .5 ? 0 : 1, hop: true, t: 0, dur: .45, wait: .4, fall: null, sq: 0, spin: rnd(0, 6), hatch: 0 });
    beep(1200, .1, 'triangle', .03, 400); return;
  }
  // slither in from the ground onto a cube on the bottom row
  const c = Math.floor(Math.random() * N), pc = c + (Math.random() < .5 ? 0 : 1);
  const e = { type, crawl: true, pr: N, pc, r: N - 1, c, hop: true, t: 0, dur: 1, wait: .1, fall: null, sq: 0, spin: rnd(0, 6), hatch: 0, dir: -1, steps: 0, trail: [] };
  const A = P(N, pc), B = P(N - 1, c), dx = A.x - B.x, dy = A.y - B.y, L = Math.hypot(dx, dy);
  for (let k = 16; k >= 0; k--) e.trail.push({ x: A.x + dx / L * k * 5, y: A.y + dy / L * k * 5 });   // body already trailing behind, off the bottom
  enemies.push(e);
  beep(type === 'k' ? 300 : 220, .12, 'triangle', .03, -50);
}
function crawlSpeed(e) { return e.type === 'k' ? Math.max(.6, .85 - lvl * .02) : Math.max(.75, 1.05 - lvl * .025); }
function ehop(e) {
  let d = -1;

  for (const q of parts) {
    const a = clamp(q.life / q.max * 1.5, 0, 1);
    if (q.k === 'ring') { const t = 1 - q.life / q.max; ctx.globalAlpha = 1 - t; ctx.strokeStyle = q.c; ctx.lineWidth = 2.5 * (1 - t) + .5; poly(ctx, [[q.x, q.y - HH * (1 + t * .6)], [q.x + HW * (1 + t * .6), q.y], [q.x, q.y + HH * (1 + t * .6)], [q.x - HW * (1 + t * .6), q.y]]); ctx.stroke(); continue; }
    ctx.globalAlpha = a;
    if (q.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; ell(q.x, q.y, q.s, q.s, q.c); ctx.globalCompositeOperation = 'source-over'; }
    else if (q.k === 'leaf') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.beginPath(); ctx.ellipse(0, 0, q.s * 1.4, q.s * .6, 0, 0, 6.28); ctx.fill(); ctx.restore(); }
    else if (q.k === 'shard' || q.k === 'flake') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; if (q.k === 'flake') { for (let i = 0; i < 3; i++) { ctx.rotate(1.047); ctx.fillRect(-q.s, -.5, q.s * 2, 1); } } else ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * .7); ctx.restore(); }
    else ell(q.x, q.y, q.s, q.s, q.c);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  for (const t of toasts) { ctx.globalAlpha = clamp(t.life * 2, 0, 1); text(t.t, t.x, t.y, t.size, t.col); } ctx.globalAlpha = 1;
  if (powerT > 0) { const g = ctx.createRadialGradient(CX, H / 2, H * .3, CX, H / 2, H * .75); g.addColorStop(0, 'rgba(255,200,90,0)'); g.addColorStop(1, `rgba(255,200,90,${.16 * Math.min(1, powerT)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(CX, H * .5, H * .3, CX, H * .5, H * .8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state !== 'title') drawHUD();
  homeIcon(27, 28, '#dcefd2');
  if (state === 'play' && lvl === 1 && lvlTime < 6) { panel(H - 74, 50); text('Swipe diagonally to hop · tap to hop on the spot', CX, H - 58, 12, PK.INK, 'center', null, 800); text('Light every cube · a second hop turns it off', CX, H - 40, 11, PK.INK_2, 'center', null, 700); }
  if (state === 'win') { logoText('LEVEL CLEAR!', H * .2); text('+' + (500 + (rescues ? 0 : 300)) + ' bonus' + (rescues ? '' : ' · no rescues needed!'), CX, H * .2 + 34, 13, '#fff', 'center');
    PK.says(ctx, 30, H * .2 + 52, W - 60, IMG.bean, 'Bean', ['Hop-tastic!', 'Every cube, done!', 'Bean-ready for more!', 'Sweet hopping!'][lvl % 4]); }
  if (state === 'title') {
    ctx.fillStyle = 'rgba(5,22,12,.35)'; ctx.fillRect(0, 0, W, H); PK.presents(ctx, CX, H * .13 - 44, [IMG.bear, IMG.bean], { size: 9, color: '#f6ead2' }); logo(H * .13);
    const y = H * .13 + 92; panel(y, 132);
    text('Light every cube, but a second hop puts it out!', CX, y + 20, 12, PK.INK, 'center', null, 800);
    const rows = [['c', 'Snakes slither up from the bottom'], ['k', 'Orange ones chase you: dodge them!'], ['g', 'Grab a berry, then chase the snakes off!'], ['pad', 'Hop off? The toucan always catches you']];
    rows.forEach(([k, t], i) => {
      const ry = y + 46 + i * 22;
      if (k === 'pad') drawToucan(58, ry + 2, .55, 1);
      else if (k === 'g') { ctx.save(); ctx.translate(56, ry + 8); ctx.scale(.75, .75); drawEnemy({ type: k, hop: false, t: 0, sq: 0, spin: 0, hatch: 0, r: 0, c: 0, fall: { x: 0, y: 0, spin: 0 } }); ctx.restore(); }
      else { ctx.save(); ctx.translate(66, ry - 3); ctx.scale(.7, .7); const fzWas = powerT; powerT = 0; drawSnake({ type: k, legend: true }); powerT = fzWas; ctx.restore(); }
      text(t, 80, ry, 11, PK.INK_2, 'left', null, 700);
    });
    if (Math.sin(time * 5) > -.3) text('TAP TO START', CX, y + 160, 18, '#ffd43b');
    if (hi) text('BEST ' + hi, CX, y + 184, 11, '#dcefd2', 'center', null, 800);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,22,12,.6)'; ctx.fillRect(0, 0, W, H); logoText('GAME OVER', H * .3);
    text('Score ' + score + '  ·  Best ' + Math.max(hi, score), CX, H * .3 + 40, 14, '#fff', 'center', null, 800);
    text('Reached level ' + lvl, CX, H * .3 + 62, 12, '#dcefd2', 'center', null, 700);
    PK.says(ctx, 30, H * .3 + 80, W - 60, IMG.bear, 'Bear', score > 0 && score >= hi ? 'A new best! Bravo, little hog!' : 'He\'ll get them next time!');
    if (overT > .8 && Math.sin(time * 5) > -.3) text('TAP TO PLAY AGAIN', CX, H * .3 + 162, 16, '#ffd43b');
  }
}
function logoText(t, y) {
  ctx.save(); ctx.translate(CX, y); ctx.scale(1 + Math.sin(time * 6) * .03, 1 + Math.sin(time * 6) * .03);
  ctx.font = '900 34px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 8; ctx.strokeStyle = '#0b2416'; ctx.strokeText(t, 0, 0);
  const g = ctx.createLinearGradient(0, -18, 0, 18); g.addColorStop(0, '#ffd43b'); g.addColorStop(1, '#ff6b9d'); ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,150,80,.6)'; ctx.shadowBlur = 16; ctx.fillText(t, 0, 0);
  ctx.restore();
}

/* ---------- loop ---------- */
addEventListener('resize', resize); resize(); setupLevel();
let last = performance.now();
(function loop(now) { const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
})();
</script>
