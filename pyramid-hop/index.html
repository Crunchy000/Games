<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Pyramid Hop</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#05040c; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  #app { height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360, CX = 180, TW = 46, SD = 28, RY = 39, N = 7, HW = TW / 2, HH = 13;
let H = 560, Y0 = 150, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DR = [-1, -1, 1, 1], DC = [-1, 0, 0, 1];            // 0 up-left, 1 up-right, 2 down-left, 3 down-right
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
let hi = 0; try { hi = +localStorage.getItem('pyramidhop-hi') || 0; } catch (e) {}

/* ---------- sizing ---------- */
let bgCache = null;
function resize() {
  const oldY = Y0;
  H = Math.round(clamp(W * innerHeight / innerWidth, 500, 740)); Y0 = Math.round(H * .5 - 128);
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
  bgCache = null; const d = Y0 - oldY; parts.forEach(q => q.y += d); toasts.forEach(t => t.y += d);
  if (p && p.fall) p.fall.y += d; if (enemies) enemies.forEach(e => { if (e.fall) e.fall.y += d; });
}

/* ---------- audio ---------- */
let ac = null;
function beep(f, d, type = 'square', vol = .04, slide = 0, delay = 0) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- themes ---------- */
const PALS = [
  { top: ['#3b5bdb', '#74c0fc', '#ffd43b'], l: '#1c2a6b', r: '#2c3f99', bg: ['#060a22', '#1a1446', '#3a1d5c'], neb: ['rgba(90,90,255,.28)', 'rgba(255,90,200,.18)', 'rgba(60,200,255,.14)'], planet: ['#ff9f6b', '#a33f5a'] },
  { top: ['#c2255c', '#ff922b', '#69db7c'], l: '#5c1430', r: '#8a1e45', bg: ['#12050e', '#3a0d2a', '#5a1a2a'], neb: ['rgba(255,80,120,.24)', 'rgba(255,170,60,.16)', 'rgba(120,60,255,.12)'], planet: ['#7fd1ff', '#2a4a9a'] },
  { top: ['#5f3dc4', '#da77f2', '#3bc9db'], l: '#2b1a66', r: '#40279a', bg: ['#070516', '#21103d', '#0f2a4a'], neb: ['rgba(160,90,255,.26)', 'rgba(60,200,220,.16)', 'rgba(255,120,200,.12)'], planet: ['#b2f2bb', '#2b8a3e'] }
];
let state = 'title', lvl = 1, score = 0, lives = 3, cubes, cfx, pads, enemies = [], p, pal = PALS[0], mode = { steps: 1 };
let freezeT = 0, spawnT = 0, stateT = 0, deadT = 0, time = 0, lvlTime = 0, overT = 0, shake = 0, toasts = [], parts = [], fwT = 0, slow = 1;

const valid = (r, c) => r >= 0 && r < N && c >= 0 && c <= r;
const P = (r, c) => ({ x: CX + (c - r / 2) * TW, y: Y0 + r * RY });
const target = () => mode.toggle ? 1 : mode.steps;
const doneCount = () => cubes.reduce((a, row) => a + row.filter(s => s === target()).length, 0);

function setupLevel() {
  pal = PALS[(lvl - 1) % 3]; bgCache = null;
  const m = lvl % 3; mode = m === 1 ? { steps: 1 } : m === 2 ? { steps: 2 } : { steps: 1, toggle: true };
  cubes = Array.from({ length: N }, (_, r) => Array(r + 1).fill(0));
  cfx = Array.from({ length: N }, (_, r) => Array(r + 1).fill(0));
  pads = [{ r: 3, c: -1, used: false }, { r: 4, c: 5, used: false }];
  enemies = []; freezeT = 0; spawnT = 3; lvlTime = 0; toasts = []; parts = [];
  resetPlayer();
}
function resetPlayer() { p = { r: 0, c: 0, pr: 0, pc: 0, t: 1, hop: false, kind: 'cube', buf: -1, fall: null, ride: null, face: 3, dead: false, splat: false, sq: 0, blink: 2 }; }
function startGame() { lvl = 1; score = 0; lives = 3; setupLevel(); state = 'play'; beep(400, .2, 'triangle', .07, 400); beep(600, .2, 'triangle', .06, 600, .12); }

/* ---------- input: swipe diagonally / tap toward target ---------- */
const surf = document.getElementById('app'), ptrs = new Map(), SW = 26;
const dirOf = (dx, dy) => dy < 0 ? (dx < 0 ? 0 : 1) : (dx < 0 ? 2 : 3);
function onDir(d) { if (state === 'title' || (state === 'over' && overT > .8)) { startGame(); return; } move(d); }
surf.addEventListener('pointerdown', e => { e.preventDefault(); { const r = cv.getBoundingClientRect(), lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height; if (lx < 48 && ly < 52 && lx > -20) { location.href = '../'; return; } } try { surf.setPointerCapture(e.pointerId); } catch (_) {} ptrs.set(e.pointerId, { ax: e.clientX, ay: e.clientY, t: performance.now(), moved: false }); });
surf.addEventListener('pointermove', e => {
  const q = ptrs.get(e.pointerId); if (!q) return;
  const dx = e.clientX - q.ax, dy = e.clientY - q.ay;
  if (Math.hypot(dx, dy) > SW) { q.moved = true; q.ax = e.clientX; q.ay = e.clientY; onDir(dirOf(dx, dy)); }
});
function endPtr(e) {
  const q = ptrs.get(e.pointerId); if (!q) return; ptrs.delete(e.pointerId);
  if (!q.moved && e.type === 'pointerup' && performance.now() - q.t < 300) {
    if (state !== 'play') { onDir(0); return; }
    const r = cv.getBoundingClientRect(), lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
    const pp = pos(p); onDir(dirOf(lx - pp.x, ly - (pp.y - 10)));
  }
}
['pointerup', 'pointercancel'].forEach(ev => surf.addEventListener(ev, endPtr));
surf.addEventListener('contextmenu', e => e.preventDefault());
const KM = { q: 0, w: 1, a: 2, s: 3, ArrowLeft: 0, ArrowUp: 1, ArrowDown: 2, ArrowRight: 3 };
addEventListener('keydown', e => { if (e.key in KM) { e.preventDefault(); onDir(KM[e.key]); } else if (e.key === ' ') { e.preventDefault(); onDir(3); } });

/* ---------- particles ---------- */
function addP(o) { if (parts.length < 420) parts.push(o); }
function puff(x, y, col, n = 6) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28); addP({ k: 'dot', x, y, vx: Math.cos(a) * rnd(20, 50), vy: Math.sin(a) * rnd(8, 20) - 10, g: 0, life: rnd(.3, .5), max: .5, s: rnd(1.5, 3), c: col }); } }
function sparkle(x, y, col, n = 8) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(40, 120); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 180, life: rnd(.35, .7), max: .7, s: rnd(1.5, 2.8), c: col }); } }
function isoRing(x, y, col) { addP({ k: 'ring', x, y, vx: 0, vy: 0, g: 0, life: .4, max: .4, s: 30, c: col }); }
function firework(x, y) { const col = pick(['#ffd43b', '#ff6b9d', '#74c0fc', '#69db7c', '#da77f2', '#ffffff']); for (let i = 0; i < 26; i++) { const a = i / 26 * 6.28, s = rnd(70, 130); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 90, life: rnd(.7, 1.1), max: 1.1, s: 2.2, c: col }); } beep(rnd(200, 400), .3, 'triangle', .03, -100); }

/* ---------- actors ---------- */
function gpos(a) {   // position without hop arc (ground track)
  if (a.hop) { const A = P(a.pr, a.pc), B = P(a.r, a.c), t = a.t; return { x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t }; }
  return P(a.r, a.c);
}
function pos(a) {
  if (a.fall) return { x: a.fall.x, y: a.fall.y };
  if (a.ride) { const A = P(a.ride.d.r, a.ride.d.c), B = P(0, 0), t = a.ride.t, e = t * t * (3 - 2 * t); return { x: A.x + (B.x - A.x) * e, y: A.y + (B.y - A.y) * e - Math.sin(Math.PI * t) * 46 - 8 }; }
  if (a.hop) { const g = gpos(a); return { x: g.x, y: g.y - Math.sin(Math.PI * a.t) * (a.type ? 14 : 22) }; }
  return P(a.r, a.c);
}
const hopH = a => a.hop ? Math.sin(Math.PI * a.t) * (a.type ? 14 : 22) : 0;
function move(d) {
  if (state !== 'play' || p.dead || p.fall || p.ride) return;
  if (p.hop) { p.buf = d; return; }
  const nr = p.r + DR[d], nc = p.c + DC[d];
  p.face = d; p.pr = p.r; p.pc = p.c; p.r = nr; p.c = nc; p.hop = true; p.t = 0;
  const pad = pads.find(x => !x.used && x.r === nr && x.c === nc);
  p.kind = valid(nr, nc) ? 'cube' : pad ? 'pad' : 'off'; p.pad = pad;
  beep(520 + (d % 2) * 60, .06, 'square', .025, 120);
}
function landPlayer() {
  const at = P(p.r, p.c);
  if (p.kind === 'cube') {
    p.sq = 1; const s = cubes[p.r][p.c]; let changed = false;
    if (mode.toggle) { cubes[p.r][p.c] = 1 - s; changed = true; if (s === 0) { score += 25; toast('+25', at.x, at.y - 34, '#fff', 10); } }
    else if (s < mode.steps) { cubes[p.r][p.c]++; changed = true; score += 25; toast('+25', at.x, at.y - 34, '#fff', 10); }
    if (changed) {
      cfx[p.r][p.c] = 1; const nc = topColor(p.r, p.c, cubes[p.r][p.c]);
      isoRing(at.x, at.y, nc); sparkle(at.x, at.y, nc, cubes[p.r][p.c] === target() ? 10 : 5);
      beep(cubes[p.r][p.c] === target() ? 880 : 660, .08, 'triangle', .04, 200);
    } else puff(at.x, at.y + 2, 'rgba(255,255,255,.7)', 4);
    if (cubes.every(row => row.every(s => s === target()))) { win(); return; }
    if (p.buf >= 0) { const d = p.buf; p.buf = -1; move(d); }
  } else if (p.kind === 'pad') {
    p.pad.used = true; p.ride = { d: p.pad, t: 0 }; p.buf = -1; beep(300, .9, 'sine', .05, 700);
    enemies.forEach(e => { if (e.type === 's' && !e.fall) { const q = pos(e); e.fall = { x: q.x, y: q.y, vy: -160, spin: 0 }; score += 500; toast('LURED! +500', q.x, q.y - 20, '#ffd43b', 13); sparkle(q.x, q.y, '#ff6b6b', 10); } });
  } else { const q = pos(p); p.fall = { x: q.x, y: q.y, vy: -60 }; p.buf = -1; beep(500, .7, 'sawtooth', .05, -420); toast('WHOOPS!', q.x, q.y - 30, '#fff', 14); }
}
function win() {
  state = 'win'; stateT = 3; enemies.forEach(e => sparkle(pos(e).x, pos(e).y, '#fff', 6)); enemies = []; fwT = 0;
  const left = pads.filter(d => !d.used).length; score += 500 + left * 100;
  [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .22, 'triangle', .06, 0, i * .12));
}
function toast(t, x, y, col = '#ffd43b', size = 13) { toasts.push({ t, x, y, life: 1.2, col, size }); }
function kill() {
  if (p.dead) return; p.dead = true; p.splat = true; deadT = 1.6; shake = 7; slow = .35;
  const q = pos(p); for (let i = 0; i < 14; i++) { const a = rnd(3.3, 6.1); addP({ k: 'dot', x: q.x, y: q.y - 8, vx: Math.cos(a) * rnd(40, 110), vy: Math.sin(a) * rnd(60, 150), g: 420, life: rnd(.5, .9), max: .9, s: rnd(2, 4), c: '#2fd6b4' }); }
  beep(150, .5, 'sawtooth', .07, -100); beep(90, .4, 'square', .05, -40, .1);
}

/* ---------- enemies: ember (r), seed (p) → urchin (s), frost crystal (g) ---------- */
function spawn() {
  const alive = enemies.filter(e => !e.fall);
  if (alive.length >= Math.min(2 + Math.floor(lvl / 3), 4)) return;
  const hasP = alive.some(e => e.type === 'p' || e.type === 's'), hasG = alive.some(e => e.type === 'g');
  const roll = Math.random(); let type = 'r';
  if (!hasP && roll < .38) type = 'p'; else if (!hasG && roll > .86) type = 'g';
  enemies.push({ type, pr: -1, pc: 0, r: 1, c: Math.random() < .5 ? 0 : 1, hop: true, t: 0, dur: .45, wait: .4, fall: null, sq: 0, spin: rnd(0, 6), hatch: 0 });
  beep(type === 'g' ? 1200 : 240, .1, 'triangle', .03, type === 'g' ? 400 : -60);
}
function ehop(e) {
  let d;
  if (e.type === 's') {
    const tp = (p.ride || p.fall || p.dead) ? null : pos(p); let best = 1e9, bd = [];
    for (let k = 0; k < 4; k++) {
      const nr = e.r + DR[k], nc = e.c + DC[k]; if (!valid(nr, nc)) continue;
      const q = P(nr, nc), dist = tp ? Math.hypot(q.x - tp.x, q.y - tp.y) : Math.random() * 100;
      if (dist < best - .5) { best = dist; bd = [k]; } else if (Math.abs(dist - best) <= .5) bd.push(k);
    }
    d = bd.length ? bd[Math.floor(Math.random() * bd.length)] : 2;
  } else d = Math.random() < .5 ? 2 : 3;
  e.face = d; e.pr = e.r; e.pc = e.c; e.r += DR[d]; e.c += DC[d]; e.hop = true; e.t = 0; e.dur = .24;
}
function eland(e) {
  if (!valid(e.r, e.c)) { const q = P(e.r, e.c); e.fall = { x: q.x, y: q.y, vy: -40, spin: 0 }; return; }
  e.sq = 1; const q = P(e.r, e.c);
  if (e.type === 'r') puff(q.x, q.y + 2, 'rgba(255,140,80,.8)', 3);
  e.wait = e.type === 's' ? Math.max(.34, .62 - lvl * .03) : Math.max(.4, .75 - lvl * .03);
  if (e.type === 'p' && e.r === N - 1) { e.type = 's'; e.hatch = 1; e.wait = .7; beep(200, .25, 'sawtooth', .05, 150); for (let i = 0; i < 10; i++) addP({ k: 'shard', x: q.x, y: q.y - 8, vx: rnd(-60, 60), vy: rnd(-120, -40), g: 400, life: .8, max: .8, s: rnd(2, 4), c: pick(['#e9d8ff', '#b197fc']), r: rnd(0, 6), vr: rnd(-10, 10) }); toast('HATCHED!', q.x, q.y - 34, '#ff8787', 12); }
}

/* ---------- update ---------- */
function update(rdt) {
  time += rdt; shake *= Math.pow(.02, rdt); slow = Math.min(1, slow + rdt * .8);
  const dt = rdt * slow;
  for (const q of parts) { q.life -= dt; q.vy += (q.g || 0) * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.vr) q.r += q.vr * dt; }
  parts = parts.filter(q => q.life > 0);
  toasts.forEach(t => { t.life -= dt; t.y -= 22 * dt; }); toasts = toasts.filter(t => t.life > 0);
  for (const row of cfx) for (let i = 0; i < row.length; i++) row[i] = Math.max(0, row[i] - dt * 2.5);
  p.sq = Math.max(0, p.sq - dt * 6); p.blink -= dt; if (p.blink < -.12) p.blink = rnd(2, 4);
  enemies.forEach(e => { e.sq = Math.max(0, e.sq - dt * 6); e.spin += dt; e.hatch = Math.max(0, e.hatch - dt * 2); });
  if (state === 'title') { if (!p.hop && Math.random() < dt * .9) { p.pr = p.r; p.pc = p.c; p.hop = true; p.t = 0; } if (p.hop) { p.t += dt / .3; if (p.t >= 1) { p.hop = false; p.t = 1; p.sq = 1; } } return; }
  if (state === 'over') { overT += dt; return; }
  if (state === 'win') { stateT -= dt; fwT -= dt; if (fwT <= 0) { fwT = .28; firework(rnd(40, W - 40), rnd(Y0 - 60, Y0 + 120)); } if (stateT <= 0) { lvl++; setupLevel(); state = 'play'; } return; }
  if (state !== 'play') return;
  lvlTime += dt; freezeT = Math.max(0, freezeT - dt);
  if (p.hop) { p.t += dt / .2; if (Math.random() < .5) addP({ k: 'dot', x: pos(p).x + rnd(-4, 4), y: pos(p).y - 8, vx: 0, vy: 10, g: 0, life: .3, max: .3, s: 1.6, c: 'rgba(124,240,216,.7)' }); if (p.t >= 1) { p.t = 1; p.hop = false; landPlayer(); if (state !== 'play') return; } }
  if (p.ride) { p.ride.t += dt / 1.3; const q = pos(p); addP({ k: 'spark', x: q.x + rnd(-10, 10), y: q.y + 4, vx: 0, vy: 30, g: 0, life: .4, max: .4, s: 2, c: pick(['#74c0fc', '#da77f2', '#ffd43b']) }); if (p.ride.t >= 1) { p.ride = null; p.r = 0; p.c = 0; p.pr = 0; p.pc = 0; p.kind = 'cube'; p.sq = 1; isoRing(P(0, 0).x, P(0, 0).y, '#fff'); beep(700, .1, 'triangle', .05); } }
  if (p.fall) { p.fall.vy += 900 * dt; p.fall.y += p.fall.vy * dt; if (p.fall.y > H + 30 && !p.dead) { p.dead = true; deadT = .7; } }
  if (p.dead) {
    deadT -= dt;
    if (deadT <= 0) {
      lives--;
      if (lives <= 0) { state = 'over'; overT = 0; if (score > hi) { hi = score; try { localStorage.setItem('pyramidhop-hi', hi); } catch (e) {} } return; }
      resetPlayer(); enemies = []; spawnT = 2.5; freezeT = 0; isoRing(P(0, 0).x, P(0, 0).y, '#2fd6b4'); sparkle(P(0, 0).x, P(0, 0).y - 10, '#7cf0d8', 10);
    }
  }
  spawnT -= dt; if (spawnT <= 0 && !p.dead) { spawnT = Math.max(1.6, 3.8 - lvl * .25); if (lvlTime > 2) spawn(); }
  for (const e of enemies) {
    if (e.fall) { e.fall.vy += 900 * dt; e.fall.y += e.fall.vy * dt; e.fall.spin += dt * 8; if (e.fall.y > H + 40) e.gone = true; continue; }
    if (e.hop) { e.t += dt / e.dur; if (e.t >= 1) { e.t = 1; e.hop = false; eland(e); } }
    else if (!p.dead && (freezeT <= 0 || e.type === 'g')) { e.wait -= dt; if (e.wait <= 0) ehop(e); }
    if (e.type === 'r' && Math.random() < .25) { const q = pos(e); addP({ k: 'spark', x: q.x + rnd(-3, 3), y: q.y - 8, vx: rnd(-8, 8), vy: -30, g: 0, life: .3, max: .3, s: 1.6, c: pick(['#ffd43b', '#ff922b']) }); }
  }
  enemies = enemies.filter(e => !e.gone);
  if (!p.dead && !p.fall && !p.ride) {
    const pp = pos(p);
    for (const e of enemies) {
      if (e.fall) continue;
      const q = pos(e);
      if (Math.hypot(q.x - pp.x, q.y - pp.y) < 15) {
        if (e.type === 'g') { e.gone = true; freezeT = 4.5; score += 100; toast('FREEZE! +100', q.x, q.y - 26, '#a5f3fc', 14); beep(880, .25, 'sine', .06, 400); beep(1320, .3, 'sine', .04, 400, .1); for (let i = 0; i < 16; i++) addP({ k: 'flake', x: q.x, y: q.y - 10, vx: rnd(-90, 90), vy: rnd(-110, 20), g: 60, life: rnd(.8, 1.4), max: 1.4, s: rnd(2, 3.5), c: '#e3fafc', r: rnd(0, 6), vr: rnd(-4, 4) }); }
        else if (freezeT <= 0) { kill(); break; }
      }
    }
    enemies = enemies.filter(e => !e.gone);
  }
}

/* ---------- drawing helpers ---------- */
function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, 6.2832); ctx.fillStyle = fill; ctx.fill(); }

  if (state !== 'over' && !(p.fall)) {
    const q = pos(p);
    acts.push({ y: p.ride ? 1e4 : gpos(p).y, f: () => {
      if (p.ride) drawPad(null, q.x, q.y + 6, true); else if (!p.dead || p.splat) shadow(gpos(p).x, gpos(p).y, hopH(p), 11);
      drawBlip(q.x, q.y, p.face, { stretch: p.hop ? Math.sin(Math.PI * p.t) : 0, sq: p.sq, splat: p.splat });
      if (p.splat) { ctx.fillStyle = '#fff'; rr(q.x + 8, q.y - 46, 46, 22, 9); ctx.fill(); ctx.beginPath(); ctx.moveTo(q.x + 14, q.y - 26); ctx.lineTo(q.x + 8, q.y - 16); ctx.lineTo(q.x + 22, q.y - 25); ctx.fill(); text('OOF!', q.x + 31, q.y - 35, 13, '#c92a2a', 'center', null, 900);
        for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.1; text('★', q.x + Math.cos(a) * 12, q.y - 14 + Math.sin(a) * 4, 9, '#ffd43b', 'center', null); } }
    } });
  }
  acts.sort((a, b) => a.y - b.y).forEach(a => a.f());
  // particles
  for (const q of parts) {
    const a = clamp(q.life / q.max * 1.5, 0, 1);
    if (q.k === 'ring') { const t = 1 - q.life / q.max; ctx.globalAlpha = 1 - t; ctx.strokeStyle = q.c; ctx.lineWidth = 2.5 * (1 - t) + .5; poly(ctx, [[q.x, q.y - HH * (1 + t * .6)], [q.x + HW * (1 + t * .6), q.y], [q.x, q.y + HH * (1 + t * .6)], [q.x - HW * (1 + t * .6), q.y]]); ctx.stroke(); continue; }
    ctx.globalAlpha = a;
    if (q.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; ell(q.x, q.y, q.s, q.s, q.c); ctx.globalCompositeOperation = 'source-over'; }
    else if (q.k === 'shard' || q.k === 'flake') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; if (q.k === 'flake') { for (let i = 0; i < 3; i++) { ctx.rotate(1.047); ctx.fillRect(-q.s, -.5, q.s * 2, 1); } } else ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * .7); ctx.restore(); }
    else ell(q.x, q.y, q.s, q.s, q.c);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  for (const t of toasts) { ctx.globalAlpha = clamp(t.life * 2, 0, 1); text(t.t, t.x, t.y, t.size, t.col); } ctx.globalAlpha = 1;
  if (freezeT > 0) { const g = ctx.createRadialGradient(CX, H / 2, H * .3, CX, H / 2, H * .75); g.addColorStop(0, 'rgba(150,230,255,0)'); g.addColorStop(1, `rgba(150,230,255,${.18 + .05 * Math.sin(time * 6)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(CX, H * .5, H * .3, CX, H * .5, H * .8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state !== 'title') drawHUD();
  ctx.fillStyle = 'rgba(10,6,30,.55)'; rr(8, 8, 38, 40, 12); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.stroke(); homeIcon(27, 28, '#cfd8ff');
  if (state === 'play' && lvl === 1 && lvlTime < 6) { panel(H - 74, 50); text('Swipe diagonally (or tap) to hop', CX, H - 58, 12, '#fff', 'center', null, 800); text('Colour every cube · dodge the critters!', CX, H - 40, 11, '#cfd8ff', 'center', null, 700); }
  if (state === 'win') { logoText('LEVEL CLEAR!', H * .2); text('+' + (500 + pads.filter(d => !d.used).length * 100) + ' bonus', CX, H * .2 + 34, 13, '#fff', 'center'); }
  if (state === 'title') {
    ctx.fillStyle = 'rgba(5,3,15,.45)'; ctx.fillRect(0, 0, W, H); logo(H * .13);
    const y = H * .13 + 92; panel(y, 132);
    text('Hop on every cube to change its colour', CX, y + 20, 12, '#fff', 'center', null, 800);
    const rows = [['r', 'Embers bounce down — dodge'], ['p', 'Seeds hatch into chasing Urchins'], ['g', 'Grab Frost to freeze everything'], ['pad', 'Hover pads lift you to the top']];
    rows.forEach(([k, t], i) => {
      const ry = y + 46 + i * 22;
      if (k === 'pad') { ctx.save(); ctx.translate(56, ry + 2); ctx.scale(.6, .6); drawPad(null, 0, 0, false); ctx.restore(); }
      else { ctx.save(); ctx.translate(56, ry + 8); ctx.scale(.75, .75); drawEnemy({ type: k, hop: false, t: 0, sq: 0, spin: 0, hatch: 0, r: 0, c: 0, fall: { x: 0, y: 0, spin: 0 } }); ctx.restore(); }
      text(t, 80, ry, 11, '#cfd8ff', 'left', null, 700);
    });
    if (Math.sin(time * 5) > -.3) text('TAP TO START', CX, y + 160, 18, '#ffd43b');
    if (hi) text('BEST ' + hi, CX, y + 184, 11, '#cfd8ff', 'center', null, 800);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,3,15,.62)'; ctx.fillRect(0, 0, W, H); logoText('GAME OVER', H * .3);
    text('Score ' + score + '  ·  Best ' + Math.max(hi, score), CX, H * .3 + 40, 14, '#fff', 'center', null, 800);
    text('Reached level ' + lvl, CX, H * .3 + 62, 12, '#cfd8ff', 'center', null, 700);
    if (overT > .8 && Math.sin(time * 5) > -.3) text('TAP TO PLAY AGAIN', CX, H * .3 + 100, 16, '#ffd43b');
  }
}
function logoText(t, y) {
  ctx.save(); ctx.translate(CX, y); ctx.scale(1 + Math.sin(time * 6) * .03, 1 + Math.sin(time * 6) * .03);
  ctx.font = '900 34px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 8; ctx.strokeStyle = '#0a0620'; ctx.strokeText(t, 0, 0);
  const g = ctx.createLinearGradient(0, -18, 0, 18); g.addColorStop(0, '#ffd43b'); g.addColorStop(1, '#ff6b9d'); ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,150,80,.6)'; ctx.shadowBlur = 16; ctx.fillText(t, 0, 0);
  ctx.restore();
}

/* ---------- loop ---------- */
addEventListener('resize', resize); resize(); setupLevel();
let last = performance.now();
(function loop(now) { const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
})();
</script>
