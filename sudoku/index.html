<script>if ('serviceWorker' in navigator) {
  // keep installed copies current: check for a new version whenever the app comes back to the front,
  // and switch to it straight away if it lands just after opening, otherwise after the app has been away a while
  const had = !!navigator.serviceWorker.controller, t0 = Date.now(); let swap = false, away = 0;
  addEventListener('load', () => navigator.serviceWorker.register('../sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { away = Date.now(); return; }
      if (swap && Date.now() - away > 30000) { location.reload(); return; }
      reg.update().catch(() => {});
    });
  }).catch(() => {}));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || swap) return; swap = true; if (Date.now() - t0 < 10000) location.reload(); });
}</script>

<style>

<style id="pub-kit">
/* The Bear & Bean house style: soft clay. Muted terracotta and sage, soft cream cards, rounded shapes.

:root {

  --pk-sage:#dce3d3; --pk-sage-hi:#e6ecdf; --pk-sage-ink:#3f4e35;
  --pk-sand:#ede4d6; --pk-card:#f7f1e7; --pk-card-2:#efe5d6;
  --pk-ink:#3b2e22; --pk-ink-2:#6e6152; --pk-ink-3:#8e7f6c; --pk-on-clay:#fff5ec;
  /* older names kept so game styles that borrowed them still work */
  --pk-cream:var(--pk-ink); --pk-cream-dim:var(--pk-ink-2); --pk-brass:var(--pk-clay-text); --pk-oak:#e8d9c4;

/* buttons: terracotta for the main action, .pk-alt is sage */
.pk-btn {
  position:relative !important; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0 !important; border-radius:16px !important; padding:12px 26px !important; text-decoration:none !important;
  font:700 1.02rem/1.15 var(--pk-slab) !important; letter-spacing:.01em; cursor:pointer;
  color:var(--pk-on-clay) !important; text-shadow:none !important;
  background:var(--pk-clay) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 var(--pk-clay-lo), 0 8px 18px rgba(120,55,25,.18) !important;

}
.pk-btn:hover { background:var(--pk-clay-hi) !important; }
.pk-btn.pk-alt { color:var(--pk-sage-ink) !important; background:var(--pk-sage) !important; box-shadow:0 2px 0 #c3ccb8, 0 6px 14px rgba(60,75,45,.12) !important; }
.pk-btn.pk-alt:hover { background:var(--pk-sage-hi) !important; }

.pk-btn:active { transform:translateY(2px); box-shadow:0 0 0 transparent, 0 3px 8px rgba(120,55,25,.15) !important; }

/* chips: small rounded toolbar buttons */
.pk-chip {
  border:0 !important; border-radius:12px !important; font-family:var(--pk-slab) !important; font-weight:700 !important;
  color:var(--pk-ink) !important; text-shadow:none !important; background:#fffaf3 !important;

.pk-btn[hidden], .pk-chip[hidden] { display:none !important; }
/* dark mode: chips become soft lamplit panels so they never vanish into the background */
body.dark .pk-chip { color:#f3e6cc !important; background:rgba(255,240,220,.12) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.1) !important; }
body.dark .pk-chip.on, body.dark .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; box-shadow:none !important; }
/* ...except inside the cream cards, which stay light in both modes */
body.dark .pk-card .pk-chip { color:var(--pk-ink) !important; background:#fffaf3 !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.16), 0 2px 5px rgba(90,60,30,.12) !important; }
body.dark .pk-card .pk-chip.on, body.dark .pk-card .pk-chip[aria-pressed="true"] { color:var(--pk-on-clay) !important; background:var(--pk-clay) !important; }
.pk-chip:disabled { opacity:1 !important; cursor:default; color:rgba(59,46,34,.38) !important; box-shadow:inset 0 0 0 1px rgba(90,60,30,.12) !important; }
body.dark .pk-chip:disabled { color:rgba(243,230,204,.36) !important; box-shadow:inset 0 0 0 1px rgba(255,240,220,.08) !important; }
/* cards: soft cream, generously rounded, gently lifted */
.pk-card {
  color:var(--pk-ink) !important; background:var(--pk-card) !important;
  border:0 !important; border-radius:24px !important;

.pk-card :is(p, li, small, label, dd, dt) { color:var(--pk-ink-2) !important; }
.pk-card b, .pk-card strong { color:var(--pk-ink) !important; }
.pk-card .x, .pk-card button.ib[data-close] { color:var(--pk-ink-2) !important; }
/* "The Bear & Bean presents", with both landlords' faces */
.pk-presents { display:flex; align-items:center; justify-content:center; gap:7px; margin:0 0 10px;
  font:700 .66rem/1 var(--pk-slab); letter-spacing:.14em; text-transform:uppercase; color:var(--pk-ink-3); }
.pk-presents img { width:24px; height:24px; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 3px rgba(60,35,15,.25); }
/* a word from Bear or Bean */
.pk-says { display:flex; align-items:center; gap:10px; text-align:left; margin:12px auto 6px; padding:9px 12px; max-width:290px;
  border-radius:16px; background:var(--pk-card-2); }
.pk-says img { width:42px; height:42px; flex:none; border-radius:50%; background:#fff; border:2px solid #fff; box-shadow:0 1px 4px rgba(60,35,15,.25); }
.pk-says b { display:block; font:700 .66rem/1.2 var(--pk-slab); letter-spacing:.1em; text-transform:uppercase; color:var(--pk-clay-text) !important; }
.pk-says span { display:block; font-weight:700; font-size:.98rem; color:var(--pk-ink); }
/* header buttons: a soft tinted square in whatever colour the game's header uses */
.pk-home { background:color-mix(in srgb, currentColor 11%, transparent) !important; border:0 !important; border-radius:13px !important; box-shadow:none !important; }
.pk-home:active { background:color-mix(in srgb, currentColor 20%, transparent) !important; }
/* help as a short carousel: .pk-steps holds .pk-step slides; the script adds dots, Back/Skip and Next, and moves the
   card's own last button ("Let's play") onto the final step */
.pk-steps { display:grid; margin:2px 0 0; touch-action:pan-y; }
.pk-step { grid-area:1 / 1; opacity:0; visibility:hidden; transform:translateX(26px); transition:opacity .25s, transform .25s, visibility 0s .25s; text-align:center; }
.pk-step.before { transform:translateX(-26px); }
.pk-step.on { opacity:1; visibility:visible; transform:none; transition:opacity .25s, transform .25s; }
.pk-step-art { font-size:2.5rem; line-height:1.1; margin:2px 0 8px; }
.pk-step-art svg { max-width:100%; }
.pk-step h3 { margin:2px 0 6px; font:800 1.1rem/1.2 var(--pk-slab); }
.pk-step p { margin:5px auto; line-height:1.45; max-width:300px; }
.pk-step ul { display:inline-block; text-align:left; margin:4px auto; padding-left:20px; line-height:1.45; }
.pk-steps-nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:14px; }
.pk-steps-back { justify-self:start; background:none; border:0; padding:8px 4px; cursor:pointer; font:700 .92rem/1 var(--pk-slab); color:var(--pk-ink-3); }
.pk-steps-back[hidden] { display:block; visibility:hidden; }
.pk-dots { display:flex; gap:6px; }
.pk-dots button { position:relative; width:8px; height:8px; padding:0; border:0; border-radius:4px; cursor:pointer; background:rgba(90,60,30,.22); transition:width .2s, background .2s; }
.pk-dots button::after { content:''; position:absolute; inset:-9px -4px; }
.pk-dots button[aria-current="step"] { width:20px; background:var(--pk-clay); }
.pk-steps-go { justify-self:end; display:flex; }
@media (prefers-reduced-motion: reduce) { .pk-step, .pk-step.on { transition:none; transform:none; } }
/* "Leave this game?": shown by BB.home() when a game in progress would be lost */
.pk-leave { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(40,28,18,.55); }
.pk-leave.show { display:flex; }
.pk-leave-card { max-width:320px; width:100%; padding:20px 20px 18px; border-radius:20px; text-align:center; box-shadow:0 18px 40px rgba(40,20,10,.3); }

/* no pull-down-to-refresh or overscroll bounce: a stray drag must never reload the page mid-game */

<script id="pub-kit-settings">
window.BB = (() => {
  const KEY = 'bearbean-settings'; let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  return {
    get muted() { return 'muted' in s ? !!s.muted : null; }, set muted(v) { s.muted = !!v; put(); },
    get theme() { return s.theme || null; }, set theme(v) { if (v) s.theme = v; else delete s.theme; put(); },
    // going back to all the games: a game sets BB.leaveRisk to a function that says whether a game in progress would be
    // lost; if it would, BB.home() (and any link back home) asks first. BB.asking is true while the question is up, so a
    // game that runs on its own can pause.
    leaveRisk: null, asking: false,
    home(href = '../') { if (BB.leaveRisk && BB.leaveRisk()) askLeave(href); else location.href = href; },
  };
})();
function askLeave(href, byBack) {
  let d = document.getElementById('pk-leave');
  if (!d) {
    d = document.createElement('div'); d.id = 'pk-leave'; d.className = 'pk-leave';
    d.innerHTML = '<div class="pk-card pk-leave-card" role="alertdialog" aria-modal="true" aria-labelledby="pk-leave-t" aria-describedby="pk-leave-d">'
      + '<h2 id="pk-leave-t">Leave this game?</h2><p id="pk-leave-d">The game you’re playing won’t be saved.</p>'
      + '<div class="pk-leave-row"><button type="button" class="pk-btn pk-small" data-stay>Keep playing</button><button type="button" class="pk-btn pk-alt pk-small" data-go>Leave</button></div></div>';
    document.body.appendChild(d);
    const close = () => { d.classList.remove('show'); BB.asking = false; armBack(); };   // staying: the back gesture is guarded again
    const go = () => {
      if (d.dataset.back !== '1') { location.href = d.dataset.href; return; }
      // came by the back gesture: carry on back, or home if there's nowhere to go back to
      const t = setTimeout(() => { location.href = d.dataset.href; }, 500); addEventListener('pagehide', () => clearTimeout(t), { once: true }); history.back();
    };
    d.addEventListener('pointerdown', e => e.stopPropagation());
    d.addEventListener('click', e => { e.stopPropagation(); if (performance.now() - d.opened < 400) return;   // the tap that opened it
      if (e.target === d || e.target.closest('[data-stay]')) close(); else if (e.target.closest('[data-go]')) go(); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && d.classList.contains('show')) { e.stopPropagation(); close(); } }, true);
  }
  d.dataset.href = href; d.dataset.back = byBack ? '1' : ''; d.opened = performance.now(); d.classList.add('show'); BB.asking = true; d.querySelector('[data-stay]').focus();
}
// the phone's back gesture (or back button): a game page keeps one extra history entry, so going back lands here first.
// It's added on a tap, because browsers skip entries added without one. Landing on it with a game in progress asks the
// same question; with nothing to lose it simply carries on back.
let backArmed = false;
function armBack() {
  const d = document.getElementById('pk-leave');
  if (backArmed || (d && d.classList.contains('show'))) return;
  try { history.pushState({ bbStay: 1 }, ''); backArmed = true; } catch (e) {}
}
['pointerup', 'keydown'].forEach(t => addEventListener(t, armBack, true));
addEventListener('popstate', e => {
  if (e.state && e.state.bbStay) { backArmed = true; return; }   // forward again onto the extra entry
  backArmed = false;
  if (BB.leaveRisk && BB.leaveRisk()) { askLeave('../', true); return; }
  const t = setTimeout(() => { location.href = '../'; }, 500); addEventListener('pagehide', () => clearTimeout(t), { once: true }); history.back();
});
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href="../"]');
  if (a && BB.leaveRisk && BB.leaveRisk()) { e.preventDefault(); askLeave(a.getAttribute('href')); }
}, true);
</script>

<script>
(function () { const set = () => document.documentElement.style.setProperty('--app-h', (window.visualViewport ? visualViewport.height : innerHeight) + 'px'); set(); addEventListener('resize', set); window.visualViewport && visualViewport.addEventListener('resize', set); })();
(() => {
'use strict';
const $ = id => document.getElementById(id);
const LEVELS = { easy: { name: 'Easy', givens: 40, blurb: 'Hints start switched on' }, medium: { name: 'Medium', givens: 33, blurb: 'Needs a little thought' }, hard: { name: 'Hard', givens: 28, blurb: 'Notes will help' }, expert: { name: 'Expert', givens: 24, blurb: 'Fewest clues possible' } };
let S = { game: null, best: {}, won: {}, muted: false, theme: null };

const save = () => { try { localStorage.setItem('sudoku', JSON.stringify(S)); } catch (e) {} };

/* ---------- theme: follows the phone's setting until you pick one ---------- */
const sysDark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

const isDark = () => BB.theme ? BB.theme === 'dark' : !!(sysDark && sysDark.matches);
function applyTheme() {
  document.body.classList.toggle('dark', isDark());

  const b = document.getElementById('bTheme');
  if (b) b.innerHTML = isDark() ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
}
if (sysDark && sysDark.addEventListener) sysDark.addEventListener('change', () => { if (!BB.theme) applyTheme(); });
applyTheme();

/* ---------- sound ---------- */
let ac = null;

const NOTES_HZ = [0, 523, 587, 659, 698, 784, 880, 988, 1047, 1175];

/* ---------- generator: full grid, then remove clues while the solution stays unique ---------- */
const ROW = i => Math.floor(i / 9), COL = i => i % 9, BOX = i => Math.floor(ROW(i) / 3) * 3 + Math.floor(COL(i) / 3);

function generate(level) {

/* ---------- game state ---------- */
let G, sel = -1, history = [], paused = false;
function newGame(level) {

  S.game = G; history = []; sel = puz.findIndex(v => !v); save(); render();
}
function setCell(i, v) {

}

}

}
function erase() {

}

/* ---------- render ---------- */
const board = $('board'), cells = [];

const pad = $('pad');
for (let d = 1; d <= 9; d++) { const b = document.createElement('button'); b.className = 'num'; b.dataset.d = d; b.textContent = d; pad.appendChild(b); }

    c.classList.toggle('peer', sel >= 0 && i !== sel && (ROW(i) === ROW(sel) || COL(i) === COL(sel) || BOX(i) === BOX(sel)));
    c.classList.toggle('same', !!sv && i !== sel && v === sv);
    c.classList.toggle('bad', !!v && !G.puz[i] && v !== G.sol[i]);
    if (v) c.textContent = v;

    else c.textContent = '';
  }
  const cnt = Array(10).fill(0); G.cur.forEach((v, i) => { if (v && v === G.sol[i]) cnt[v]++; });
  const filt = helperOn();

  const nOn = sel >= 0 && !!G.noted[sel] && !G.cur[sel]; $('tNotes').classList.toggle('on', nOn); $('notesBadge').textContent = nOn ? 'ON' : 'OFF';

  $('bSound').innerHTML = S.muted ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

let toastT = null;
function flash(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 1400); }

/* ---------- input ---------- */

pad.addEventListener('click', e => { const b = e.target.closest('.num'); if (b) { audio(); place(+b.dataset.d); } });
$('tUndo').onclick = () => { audio(); undo(); };
$('tErase').onclick = () => { audio(); erase(); };
$('tNotes').onclick = () => { audio(); toggleNotes(); };
$('tHint').onclick = () => { audio(); toggleHelper(); };
function setPaused(p) { if (G.done) return; paused = p; render(); }
$('bPause').onclick = () => setPaused(!paused);
$('bTheme').onclick = () => { BB.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); audio(); tone(isDark() ? 440 : 880, .08, 'sine', .03); };
$('bSound').onclick = () => { S.muted = !S.muted; BB.muted = S.muted; save(); audio(); render(); tone(660, .08, 'triangle'); };
addEventListener('keydown', e => {

});
function openNew(cancellable) {

}

/* ---------- clock ---------- */
let last = performance.now();

else { G = { level: 'easy', puz: Array(81).fill(0), sol: Array(81).fill(0), cur: Array(81).fill(0), mistakes: 0, time: 0, done: true, noted: Array(81).fill(0), helper: false }; render(); openNew(false); }

})();
</script>

(() => { const pick = el => { try { const l = JSON.parse(el.dataset.lines || '[]'); if (l.length) el.querySelector('span').textContent = l[Math.floor(Math.random() * l.length)]; } catch (e) {} };
