<!DOCTYPE html>

<title>Thin Ice · Bear vs Bean</title>
<meta name="description" content="A two-player ice game: Bear and Bean take turns knocking blocks out of a frozen pond. Whoever drops Bear in the icy water loses. Play a friend or the computer. Free, works offline, no ads or tracking. From The Bear &amp; Bean Games.">
<link rel="canonical" href="https://crunchy000.github.io/Games/thin-ice/">
<style>
  :root {
    --bg1:#14304f; --bg2:#08121f; --card:rgba(255,255,255,.07); --card-b:rgba(255,255,255,.12);
    --ink:#f2f8ff; --mute:#9fb3cc; --p0:#e8994a; --p0-glow:rgba(232,153,74,.45); --p1:#ff5fa2; --p1-glow:rgba(255,95,162,.45); --accent:#8fd8ff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body { min-height:100dvh; display:flex; align-items:flex-start; justify-content:center; color:var(--ink);
         background:radial-gradient(800px 500px at 15% -10%, rgba(143,216,255,.18), transparent 60%),
                    radial-gradient(800px 500px at 100% 110%, rgba(255,95,162,.12), transparent 60%),
                    linear-gradient(170deg, var(--bg1), var(--bg2));
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:min(94vw,460px); padding:14px 0 22px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  h1 { margin:0; font-size:1.5rem; font-weight:900; letter-spacing:-.01em; }
  h1 .ice { color:var(--accent); }
  h1 .sub { display:block; font-size:.7rem; color:var(--mute); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-top:1px; }
  .head-btns { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--card-b); background:var(--card); color:var(--ink);
              display:grid; place-items:center; cursor:pointer; font-size:1.05rem; text-decoration:none; padding:0; }
  .icon-btn svg { width:22px; height:22px; }
  .icon-btn:disabled { opacity:.35; cursor:default; }
  button { font:inherit; }
  button:focus-visible, [contenteditable]:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  .opts { display:grid; grid-template-columns:1.25fr 1fr; gap:8px; }
  .seg { display:flex; padding:3px; border-radius:13px; background:var(--card); border:1px solid var(--card-b); }
  .seg button { flex:1; border:0; background:none; color:var(--mute); padding:7px 2px; font-weight:800; font-size:.82rem; cursor:pointer; border-radius:10px; transition:background .2s, color .2s; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg2); }

  .scores { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 6px; }
  .sc { position:relative; border-radius:16px; padding:9px 12px 8px; background:var(--card); border:1px solid var(--card-b); transition:transform .25s, box-shadow .25s, border-color .25s; }
  .sc .row { display:flex; align-items:center; gap:7px; }
  .sc .av { width:30px; height:30px; border-radius:50%; flex:none; border:2px solid var(--p0); background:#fff; }
  .sc.p1 .av { border-color:var(--p1); }
  .sc .name { font-weight:800; font-size:.95rem; min-width:2ch; max-width:100%; overflow:hidden; white-space:nowrap; border-radius:6px; padding:1px 3px; margin:-1px -3px; cursor:text; }
  .sc .cpu { font-size:.68rem; color:var(--mute); font-weight:700; margin-left:auto; }
  .sc .n { font-size:1.7rem; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums; }
  .sc .n small { font-size:.72rem; color:var(--mute); font-weight:700; margin-left:4px; }
  .sc.p0 .n { color:var(--p0); } .sc.p1 .n { color:var(--p1); }
  .sc.active.p0 { border-color:var(--p0); box-shadow:0 0 0 1px var(--p0), 0 8px 26px var(--p0-glow); transform:translateY(-2px); }
  .sc.active.p1 { border-color:var(--p1); box-shadow:0 0 0 1px var(--p1), 0 8px 26px var(--p1-glow); transform:translateY(-2px); }

  #status { min-height:1.5em; text-align:center; font-weight:800; font-size:1.04rem; margin:4px 0 0; }
  #status .p0 { color:var(--p0); } #status .p1 { color:var(--p1); }
  #left { text-align:center; color:var(--mute); font-size:.8rem; font-weight:600; margin:2px 0 8px; min-height:1.2em; }

  .board-wrap { border-radius:22px; background:var(--card); border:1px solid var(--card-b); box-shadow:0 20px 50px rgba(0,0,0,.3); padding:6px; }
  #board { display:block; width:100%; touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none; border-radius:16px; }

  .actions { display:flex; gap:10px; margin-top:12px; }
  .btn { flex:1; border:0; border-radius:14px; padding:13px; font-weight:800; font-size:1rem; cursor:pointer; transition:transform .12s; }
  .btn:active { transform:scale(.97); }
  .primary { background:linear-gradient(135deg, var(--p0), #ffe08a 50%, var(--p1)); color:#1a1020; }
  .ghost-btn { flex:.6; background:var(--card); color:var(--ink); border:1px solid var(--card-b); }
  .hint { text-align:center; color:var(--mute); font-size:.8rem; margin:12px 0 0; line-height:1.45; }
  #confetti { position:fixed; inset:0; pointer-events:none; width:100vw; height:100vh; z-index:5; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>

<body>
<canvas id="confetti"></canvas>
<main>
  <header>
    <h1><span class="ice">Thin Ice</span><small class="sub">Bear vs Bean</small></h1>
    <div class="head-btns">
      <a class="icon-btn" href="../" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
      <button class="icon-btn" id="undo" aria-label="Undo" title="Undo">↶</button>
      <button class="icon-btn" id="sound" aria-label="Sound on" title="Sound">🔊</button>
    </div>
  </header>

  <div class="opts">
    <div class="seg" id="segSize" role="group" aria-label="Pond size"><button data-v="2">Small</button><button data-v="3">Medium</button><button data-v="4">Big</button></div>
    <div class="seg" id="segMode" role="group" aria-label="Opponent"><button data-v="2p">2 players</button><button data-v="cpu">vs CPU</button></div>
  </div>

  <div class="scores">
    <div class="sc p0" id="card0"><div class="row"><img class="av" src="../icons/bear.png" alt=""><span class="name" id="name0" contenteditable="true" spellcheck="false" enterkeyhint="done" aria-label="Bear player name">Bear</span></div><div class="n" id="w0">0<small>wins</small></div></div>
    <div class="sc p1" id="card1"><div class="row"><img class="av" src="../icons/bean.png" alt=""><span class="name" id="name1" contenteditable="true" spellcheck="false" enterkeyhint="done" aria-label="Bean player name">Bean</span><span class="cpu" id="cpuTag"></span></div><div class="n" id="w1">0<small>wins</small></div></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="left"></div>

  <div class="board-wrap"><canvas id="board" aria-label="Frozen hexagonal pond of ice blocks with Bear standing in the middle"></canvas></div>

  <div class="actions">
    <button class="btn primary" id="newGame">New game</button>
    <button class="btn ghost-btn" id="resetWins">Reset wins</button>
  </div>
  <p class="hint">Take turns tapping an ice block to knock it out. A block needs three neighbours (the frame counts) and a path to the frame, or it drops too. Whoever drops Bear in the pond loses!<br>Tap a name to rename · Who starts swaps every game</p>
</main>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DEBUG = /[?&]debug\b/.test(location.search);
  const DEFAULT_NAMES = ['Bear', 'Bean'];
  let names = DEFAULT_NAMES.slice(), wins = [0, 0], n = 3, mode = '2p', muted = false;
  try {
    const s = JSON.parse(localStorage.getItem('thinice') || '{}');
    if (s.names) names = s.names; if (s.wins) wins = s.wins; if ([2, 3, 4].includes(s.n)) n = s.n;
    if (s.mode === 'cpu') mode = 'cpu'; muted = !!s.muted;
  } catch (e) {}
  const save = () => { try { localStorage.setItem('thinice', JSON.stringify({ names, wins, n, mode, muted })); } catch (e) {} };

  /* ---------- sound ---------- */
  let ac = null;
  const audio = () => { if (muted) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } return ac; };
  function tone(f, d = .12, type = 'sine', vol = .06, delay = 0, slide = 0) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
  }
  let noiseBuf = null;
  function noise(d, freq, q, vol, delay = 0, type = 'bandpass') {
    const a = audio(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + d + .02);
  }
  const sCrack = (delay = 0) => { noise(.07, 2600, 3, .25, delay); tone(1400 + Math.random() * 300, .05, 'triangle', .03, delay, -600); };
  const sPlop = (delay = 0) => { tone(340 + Math.random() * 80, .18, 'sine', .08, delay, -200); noise(.25, 700, .8, .07, delay + .02, 'lowpass'); };
  const sSplash = () => { noise(.6, 900, .7, .22, 0, 'lowpass'); tone(220, .4, 'sine', .07, 0, -120); };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  /* ---------- rules ---------- */
  // A hexagonal pond of hex blocks (axial coordinates), n rings round the middle.
  // A block stays up if it links to the frame through other blocks and has at least
  // three supports: neighbouring blocks, or sides that touch the frame.
  const KS = 3, DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];
  let CELLS = [], NB = [], EDGE = [], CENTRE = 0;
  function buildBoard() {
    CELLS = []; const idx = new Map();
    for (let r = -n; r <= n; r++) for (let q = -n; q <= n; q++) if (Math.abs(q + r) <= n) { idx.set(q + ',' + r, CELLS.length); CELLS.push([q, r]); }
    NB = CELLS.map(([q, r]) => DIRS.map(([a, b]) => idx.has((q + a) + ',' + (r + b)) ? idx.get((q + a) + ',' + (r + b)) : -1));
    EDGE = NB.map(l => l.filter(j => j < 0).length);
    CENTRE = idx.get('0,0');
  }
  const supports = (al, i) => { let k = 0; for (const j of NB[i]) if (j < 0 || al[j]) k++; return k; };
  function settle(al) {
    const waves = [], N = CELLS.length;
    for (;;) {
      const reach = new Uint8Array(N), st = [];
      for (let i = 0; i < N; i++) if (al[i] && EDGE[i]) { reach[i] = 1; st.push(i); }
      while (st.length) for (const j of NB[st.pop()]) if (j >= 0 && al[j] && !reach[j]) { reach[j] = 1; st.push(j); }
      const drop = [];
      for (let i = 0; i < N; i++) if (al[i] && (!reach[i] || supports(al, i) < KS)) drop.push(i);
      if (!drop.length) return waves;
      for (const i of drop) al[i] = 0;
      waves.push(drop);
    }
  }
  const P = () => CENTRE;
  const hexDist = i => { const [q, r] = CELLS[i]; return Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); };
  function apply(al, i) { const a = al.slice(); a[i] = 0; const waves = settle(a); return { al: a, waves: [[i], ...waves] }; }
  const legal = al => { const out = [], p = P(); for (let i = 0; i < CELLS.length; i++) if (al[i] && i !== p) out.push(i); return out; };
  const safeMoves = al => { const p = P(), out = []; for (const i of legal(al)) { const r = apply(al, i); if (r.al[p]) out.push({ i, al: r.al }); } return out; };

  /* ---------- state ---------- */
  let alive, turn = 0, starter = 0, hist = [], over = false, loser = -1, busy = false, lastMsg = '';
  let falling = [], rings = [], pip = null, hover = -1, cpuTimer = 0;
  const isCpu = p => mode === 'cpu' && p === 1;

  function newGame() {
    clearTimeout(cpuTimer);
    buildBoard(); alive = new Uint8Array(CELLS.length).fill(1);
    turn = starter; starter = 1 - starter;
    hist = []; over = false; loser = -1; busy = false; falling = []; rings = []; lastMsg = '';
    pip = { state: 'stand', t: 0, y: 0 };
    layout(); render(); maybeCpu();
  }

  function play(i, who = turn) {
    if (over || busy || !alive[i] || i === P()) return false;
    const res = apply(alive, i);
    const lost = !res.al[P()];
    hist.push({ prev: alive, player: who });
    alive = res.al;
    // animate the cascade wave by wave
    let total = 0;
    res.waves.forEach((w, k) => {
      const delay = k === 0 ? 0 : .12 + k * .16;
      for (const j of w) falling.push({ i: j, t: -delay, dur: .55, pip: j === P() });
      if (k === 0) { sCrack(); buzz(10); } else sCrack(delay);
      sPlop(delay + .3);
      total += w.length;
    });
    const end = .12 + (res.waves.length - 1) * .16 + .6;
    busy = true;
    lastMsg = total > 1 ? `Crack! ${total} blocks fell` : '';
    if (lost) {
      over = true; loser = who; wins[1 - who]++; save();
      pip.state = 'fall'; pip.t = -(.12 + (res.waves.length - 1) * .16);
      setTimeout(() => { sSplash(); buzz([30, 40, 30]); }, (end - .1) * 1000);
      setTimeout(() => { [523, 659, 784, 1047].forEach((f, k) => tone(f, .22, 'triangle', .07, k * .09)); confetti(1 - who); }, (end + .9) * 1000);
    } else turn = 1 - who;
    setTimeout(() => { busy = false; render(); maybeCpu(); }, end * 1000);
    render();
    return true;
  }

  function undo() {
    if (busy || !hist.length) return;
    clearTimeout(cpuTimer);
    let h;
    do { h = hist.pop(); } while (h && isCpu(h.player) && hist.length);   // vs CPU: go back to your own turn
    if (!h) return;
    if (over) { wins[1 - loser]--; save(); over = false; loser = -1; }
    alive = h.prev; turn = h.player; falling = []; rings = []; pip = { state: 'stand', t: 0, y: 0 }; lastMsg = '';
    tone(300, .08, 'sine', .04, 0, -80); render(); maybeCpu();
  }

  /* ---------- computer (plays Bean) ---------- */
  function cpuPick() {
    const safe = safeMoves(alive);
    if (!safe.length) { const l = legal(alive); return l[Math.floor(Math.random() * l.length)]; }
    const far = hexDist;
    // a move that leaves no safe reply wins outright
    const scored = safe.map(m => ({ m, opp: safeMoves(m.al) }));
    const win = scored.filter(s => !s.opp.length);
    if (win.length) return win[Math.floor(Math.random() * win.length)].m.i;
    let pool = scored;
    if (safe.length <= 16) {    // look one step further: avoid moves that hand over a winning reply
      const ok = scored.filter(s => !s.opp.some(o => safeMoves(o.al).length === 0));
      if (ok.length) pool = ok;
    }
    if (Math.random() < .18) return pool[Math.floor(Math.random() * pool.length)].m.i;   // a friendly wobble now and then
    pool.sort((a, b) => far(b.m.i) - far(a.m.i) + (Math.random() - .5) * 2.5);
    return pool[0].m.i;
  }
  function maybeCpu() {
    clearTimeout(cpuTimer);
    if (over || busy || !isCpu(turn)) return;
    cpuTimer = setTimeout(() => { if (!over && !busy && isCpu(turn)) { const i = cpuPick(); hover = i; setTimeout(() => { hover = -1; play(i, 1); }, 380); } }, 520);
  }

  /* ---------- drawing ---------- */
  const cv = $('board'), g = cv.getContext('2d');
  let W = 360, H = 330, SC = 1, s = 30, OX = 180, OY = 160;
  const K = .8, TH = 8, R3 = Math.sqrt(3);
  function layout() {
    const cw = cv.parentElement.clientWidth - 12;
    s = (W - 10) / (2 * R3 * (n + .95));
    const half = 1.5 * s * (n + .95) * K;
    H = Math.round(half * 2 + TH + 16);
    OX = W / 2; OY = half + 6;
    SC = cw / W; const dpr = Math.min(devicePixelRatio || 1, 3);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(H * SC * dpr);
    cv.style.height = (H * SC) + 'px';
    g.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
  }
  const cxOf = i => OX + R3 * s * (CELLS[i][0] + CELLS[i][1] / 2), cyOf = i => OY + 1.5 * s * CELLS[i][1] * K;
  function hexPath(x, y, rad, flat) {   // flat: flat-topped (the frame); otherwise pointy-topped (the blocks)
    g.beginPath();
    for (let k = 0; k < 6; k++) { const a = (flat ? 0 : Math.PI / 6) + k * Math.PI / 3; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad * K; k ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.closePath();
  }
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  const flakes = Array.from({ length: 26 }, () => ({ x: Math.random() * 360, y: Math.random() * 400, r: .8 + Math.random() * 1.6, v: 6 + Math.random() * 10, ph: Math.random() * 6 }));

  function drawBlock(i, dy = 0, sc = 1, alpha = 1, opts = {}) {
    const x = cxOf(i), y = cyOf(i) + dy, rad = (s - Math.max(1.2, s * .06)) * sc;
    g.save(); g.globalAlpha = alpha;
    // side (only seen over holes)
    hexPath(x, y + TH, rad, false); g.fillStyle = '#5a93b6'; g.fill();
    hexPath(x, y + TH * .5, rad, false); g.fillStyle = '#6ea9cc'; g.fill();
    // top
    const gr = g.createLinearGradient(x - rad, y - rad * K, x + rad, y + rad * K);
    gr.addColorStop(0, '#f4fbff'); gr.addColorStop(.55, '#cfeafa'); gr.addColorStop(1, '#a9d6f0');
    hexPath(x, y, rad, false); g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(80,140,180,.55)'; g.lineWidth = 1; g.lineJoin = 'round'; g.stroke();
    // shine
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = Math.max(1.2, s * .07); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - rad * .5, y - rad * .3 * K); g.lineTo(x - rad * .05, y - rad * .55 * K); g.stroke();
    g.beginPath(); g.moveTo(x - rad * .55, y - rad * .02 * K); g.lineTo(x - rad * .35, y - rad * .14 * K); g.stroke();
    if (opts.crack) {   // just enough support left: show a hairline crack
      g.strokeStyle = 'rgba(60,110,150,.75)'; g.lineWidth = 1.1;
      g.beginPath(); g.moveTo(x + rad * .25, y - rad * .8 * K); g.lineTo(x + rad * .05, y - rad * .1 * K); g.lineTo(x + rad * .35, y + rad * .25 * K); g.lineTo(x + rad * .15, y + rad * .8 * K); g.stroke();
      g.beginPath(); g.moveTo(x + rad * .05, y - rad * .1 * K); g.lineTo(x - rad * .4, y + rad * .2 * K); g.stroke();
    }
    if (opts.hl) { hexPath(x, y, rad - 2, false); g.strokeStyle = opts.hl; g.lineWidth = 3; g.stroke(); }
    g.restore();
  }

  function drawBear(x, y, sz, t, worried, ring) {
    g.save(); g.translate(x, y);
    if (ring) g.translate(0, Math.sin(t * 2.2) * 1.5);
    else if (worried) g.rotate(Math.sin(t * 5) * .06);
    const k = sz / 44; g.scale(k, k);
    const fur = '#9b5e2e', dark = '#6e3f1c', light = '#e8b98a';
    if (ring) { g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(0, 4, 32, 8, 0, 0, 7); g.fill();
      g.lineWidth = 9; g.strokeStyle = '#e8664a'; g.beginPath(); g.ellipse(0, -2, 23, 8, 0, Math.PI, Math.PI * 2); g.stroke(); }
    else {
      g.fillStyle = 'rgba(30,70,100,.25)'; g.beginPath(); g.ellipse(0, 0, 16, 5, 0, 0, 7); g.fill();
      g.fillStyle = dark; g.beginPath(); g.ellipse(-7, -2, 6.5, 4, 0, 0, 7); g.ellipse(7, -2, 6.5, 4, 0, 0, 7); g.fill();
    }
    // body and tummy
    g.fillStyle = fur; g.beginPath(); g.ellipse(0, -17, 14, 16, 0, 0, 7); g.fill();
    g.fillStyle = light; g.beginPath(); g.ellipse(0, -14, 9, 11, 0, 0, 7); g.fill();
    // arms (flap about when worried, wave from the ring)
    const flap = ring ? Math.sin(t * 6) * .5 : worried ? Math.sin(t * 9) * .4 : 0;
    g.fillStyle = fur;
    g.save(); g.translate(-12, -24); g.rotate(.5 + flap + (ring ? 1.6 : 0)); g.beginPath(); g.ellipse(0, 7, 4.5, 9, 0, 0, 7); g.fill(); g.restore();
    g.save(); g.translate(12, -24); g.rotate(-.5 - flap - (ring ? 1.6 : 0)); g.beginPath(); g.ellipse(0, 7, 4.5, 9, 0, 0, 7); g.fill(); g.restore();
    // head
    g.beginPath(); g.arc(-10, -46, 5.5, 0, 7); g.arc(10, -46, 5.5, 0, 7); g.fill();
    g.fillStyle = '#d99a6c'; g.beginPath(); g.arc(-10, -46, 2.8, 0, 7); g.arc(10, -46, 2.8, 0, 7); g.fill();
    g.fillStyle = fur; g.beginPath(); g.arc(0, -38, 12.5, 0, 7); g.fill();
    g.fillStyle = light; g.beginPath(); g.ellipse(0, -34, 6.5, 5, 0, 0, 7); g.fill();
    g.fillStyle = '#2a1a10'; g.beginPath(); g.ellipse(0, -36.5, 2.6, 1.9, 0, 0, 7); g.fill();
    g.strokeStyle = '#2a1a10'; g.lineWidth = 1.3; g.lineCap = 'round';
    g.beginPath(); if (worried) { g.ellipse(0, -31.5, 2, 1.4, 0, 0, 7); } else { g.moveTo(-2.5, -33); g.quadraticCurveTo(0, -30.5, 2.5, -33); } g.stroke();
    const ey = worried ? -41 : -41.5;
    g.fillStyle = '#2a1a10'; g.beginPath(); g.arc(-5, ey, worried ? 2.3 : 1.9, 0, 7); g.arc(5, ey, worried ? 2.3 : 1.9, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(-4.4, ey - .7, .7, 0, 7); g.arc(5.6, ey - .7, .7, 0, 7); g.fill();
    if (worried) { g.strokeStyle = '#2a1a10'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(-8, -46); g.lineTo(-3, -44.5); g.moveTo(8, -46); g.lineTo(3, -44.5); g.stroke(); }
    g.fillStyle = 'rgba(255,120,140,.45)'; g.beginPath(); g.arc(-8.5, -36, 2.2, 0, 7); g.arc(8.5, -36, 2.2, 0, 7); g.fill();
    // woolly hat and scarf
    g.fillStyle = '#8fd8ff'; g.beginPath(); g.arc(0, -45, 10, Math.PI, 0); g.fill();
    g.fillStyle = '#ffffff'; rr(-11, -47, 22, 4.5, 2.2); g.fill(); g.beginPath(); g.arc(0, -56, 3.2, 0, 7); g.fill();
    g.fillStyle = '#ff5fa2'; rr(-11, -28, 22, 5, 2.5); g.fill(); rr(5, -26, 5, 11, 2); g.fill();
    if (ring) { g.lineWidth = 9; g.strokeStyle = '#ff7a59'; g.beginPath(); g.ellipse(0, -2, 23, 8, 0, 0, Math.PI); g.stroke();
      g.strokeStyle = '#fff'; g.setLineDash([6, 10]); g.beginPath(); g.ellipse(0, -2, 23, 8, 0, 0, Math.PI); g.stroke(); g.setLineDash([]); }
    g.restore();
  }

  let time = 0, lastT = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000 || 0); lastT = now; time += dt;
    for (const f of falling) f.t += dt;
    for (const f of falling) if (f.t >= f.dur && !f.splashed) { f.splashed = true; rings.push({ x: cxOf(f.i), y: cyOf(f.i) + 10, t: 0 }); }
    falling = falling.filter(f => f.t < f.dur + .05);
    for (const r of rings) r.t += dt; rings = rings.filter(r => r.t < 1.4);
    if (pip.state === 'fall') { pip.t += dt; if (pip.t > .75) { pip.state = 'swim'; pip.t = 0; rings.push({ x: cxOf(P()), y: cyOf(P()) + 8, t: 0, big: 1 }); } }
    else pip.t += dt;
    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    g.clearRect(0, 0, W, H);
    const fr = R3 * s * (n + .95), wr = R3 * s * (n + .62);
    // hexagonal wooden frame with a snowy top edge
    hexPath(OX, OY + 7, fr, true); g.fillStyle = '#6e4426'; g.fill();
    hexPath(OX, OY, fr, true); g.fillStyle = '#a8703f'; g.fill();
    g.strokeStyle = '#8a5a36'; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    g.fillStyle = '#f4fbff';
    { const ax = OX + Math.cos(4 * Math.PI / 3) * fr, ay = OY + Math.sin(4 * Math.PI / 3) * fr * K, bx = OX + Math.cos(5 * Math.PI / 3) * fr;
      g.beginPath(); g.moveTo(ax + 3, ay + 1); for (let x = ax + 3; x < bx - 3; x += 14) g.quadraticCurveTo(x + 7, ay - 4, Math.min(bx - 3, x + 14), ay + 1); g.lineTo(bx - 6, ay + 5); g.lineTo(ax + 6, ay + 5); g.fill(); }
    // water
    const wg = g.createLinearGradient(0, OY - wr * K, 0, OY + wr * K); wg.addColorStop(0, '#1d5d86'); wg.addColorStop(1, '#123f60');
    hexPath(OX, OY + 3, wr, true); g.fillStyle = wg; g.fill();
    g.save(); hexPath(OX, OY + 3, wr, true); g.clip();
    g.strokeStyle = 'rgba(190,230,255,.10)'; g.lineWidth = 1.4;
    for (let k = 0; k < 14; k++) {
      const px = (k * 71 + time * 6) % (2 * wr + 40) + OX - wr - 20, py = OY - wr * K + ((k * 37) % (2 * wr * K));
      g.beginPath(); g.ellipse(px, py, 14, 3, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    }
    for (const r of rings) {
      const p = r.t / 1.4, rad = (r.big ? 26 : 14) + p * (r.big ? 40 : 26);
      g.strokeStyle = `rgba(220,245,255,${.5 * (1 - p)})`; g.lineWidth = 2;
      g.beginPath(); g.ellipse(r.x, r.y, rad, rad * .4, 0, 0, 7); g.stroke();
    }
    g.restore();
    // blocks, back to front
    const p = P(), danger = !over && alive[p] && supports(alive, p) <= 4;
    const fallBy = new Map(falling.map(f => [f.i, f]));
    for (let i = 0; i < CELLS.length; i++) {
      const f = fallBy.get(i);
      if (f) {
        const q = Math.max(0, f.t) / f.dur;
        if (f.t < 0) drawBlock(i, Math.sin(time * 26) * .5);   // wobble before it goes
        else drawBlock(i, q * q * 22, 1 - q * .3, 1 - q);
      } else if (alive[i]) {
        const crack = !over && i !== p && supports(alive, i) === KS;
        const hl = i === hover ? (turn ? '#ff5fa2' : '#e8994a') : null;
        drawBlock(i, 0, 1, 1, { crack, hl });
      }
    }
    // Bear on the ice
    const px = cxOf(p), py = cyOf(p) + s * .32, bsz = Math.min(52, s * 1.5);
    if (pip.state === 'stand') drawBear(px, py, bsz, time, danger, false);
    else if (pip.state === 'fall') {
      const q = Math.max(0, pip.t) / .75;
      g.save(); g.globalAlpha = 1 - q * .9; drawBear(px, py + q * q * 26, bsz * (1 - q * .2), time, true, false); g.restore();
    } else {
      const up = Math.min(1, pip.t / .6);
      g.save(); g.globalAlpha = up; drawBear(px, py + 8 + (1 - up) * 10, bsz, time, false, true); g.restore();
    }
    // gentle snowfall
    g.fillStyle = 'rgba(255,255,255,.55)';
    for (const f of flakes) {
      const y = (f.y + time * f.v) % (H + 10) - 5, x = f.x + Math.sin(time * .8 + f.ph) * 6;
      g.beginPath(); g.arc(x, y, f.r, 0, 7); g.fill();
    }
  }

  /* ---------- UI ---------- */
  const esc = t => t.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  function render() {
    for (const q of [0, 1]) {
      $('w' + q).innerHTML = `${wins[q]}<small>win${wins[q] === 1 ? '' : 's'}</small>`;
      $('card' + q).classList.toggle('active', !over && turn === q);
      if (document.activeElement !== $('name' + q)) $('name' + q).textContent = names[q];
    }
    $('cpuTag').textContent = mode === 'cpu' ? 'computer' : '';
    $('undo').disabled = !hist.length || busy || (mode === 'cpu' && !hist.some(h => !isCpu(h.player)));
    const nm = q => `<span class="p${q}">${esc(names[q])}</span>`;
    if (over) $('status').innerHTML = `Splash! ${nm(1 - loser)} wins! 🎉`;
    else if (isCpu(turn)) $('status').innerHTML = `${nm(1)} is thinking…`;
    else $('status').innerHTML = `${nm(turn)}'s turn · knock out a block`;
    const left = alive ? legal(alive).length : 0;
    $('left').textContent = over ? `Bear's gone for a swim. Don't worry, he loves it! Tap New game for a rematch`
      : lastMsg ? `${lastMsg} · ${left} left` : `${left} block${left === 1 ? '' : 's'} left`;
  }

  function hit(ev) {
    const b = cv.getBoundingClientRect(), x = (ev.clientX - b.left) / SC, y = (ev.clientY - b.top) / SC;
    const dx = x - OX, dy = (y - OY) / K;
    const fq = (R3 / 3 * dx - dy / 3) / s, fr = (2 / 3 * dy) / s;
    let rq = Math.round(fq), rr2 = Math.round(fr), rs = Math.round(-fq - fr);
    const ddq = Math.abs(rq - fq), ddr = Math.abs(rr2 - fr), dds = Math.abs(rs + fq + fr);
    if (ddq > ddr && ddq > dds) rq = -rr2 - rs; else if (ddr > dds) rr2 = -rq - rs;
    const i = CELLS.findIndex(([q, r]) => q === rq && r === rr2);
    return i >= 0 && alive[i] && i !== P() ? i : -1;
  }
  const canTap = () => !over && !busy && !isCpu(turn);
  cv.addEventListener('pointerdown', ev => { ev.preventDefault(); if (canTap()) hover = hit(ev); });
  cv.addEventListener('pointermove', ev => { if (canTap() && (ev.pointerType === 'mouse' || ev.buttons)) hover = hit(ev); });
  cv.addEventListener('pointerup', ev => {
    if (!canTap()) return;
    const i = hit(ev); hover = ev.pointerType === 'mouse' ? i : -1;
    if (i >= 0) { hover = -1; play(i); }
  });
  cv.addEventListener('pointerleave', () => { if (canTap()) hover = -1; });
  cv.addEventListener('pointercancel', () => { hover = -1; });

  for (const q of [0, 1]) {
    const ne = $('name' + q);
    ne.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ne.blur(); } else if (ne.textContent.length >= 14 && ev.key.length === 1) ev.preventDefault(); });
    ne.addEventListener('focus', () => { const r = document.createRange(); r.selectNodeContents(ne); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
    ne.addEventListener('blur', () => { names[q] = ne.textContent.replace(/\s+/g, ' ').trim().slice(0, 14) || DEFAULT_NAMES[q]; save(); render(); });
  }
  function segs() {
    document.querySelectorAll('#segSize button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === n));
    document.querySelectorAll('#segMode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === mode));
  }
  document.querySelectorAll('#segSize button').forEach(b => b.addEventListener('click', () => { n = +b.dataset.v; starter = 0; save(); segs(); newGame(); }));
  document.querySelectorAll('#segMode button').forEach(b => b.addEventListener('click', () => { if (b.dataset.v === mode) return; mode = b.dataset.v; starter = 0; save(); segs(); newGame(); }));
  $('newGame').addEventListener('click', newGame);
  $('undo').addEventListener('click', undo);
  $('resetWins').addEventListener('click', () => { wins = [0, 0]; save(); render(); });
  const setSoundIcon = () => { $('sound').textContent = muted ? '🔇' : '🔊'; $('sound').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); };
  $('sound').addEventListener('click', () => { muted = !muted; save(); setSoundIcon(); if (!muted) tone(660, .1, 'triangle', .06); });
  addEventListener('keydown', ev => {
    if (ev.target.isContentEditable) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); }
    else if (ev.key === 'n' || ev.key === 'N') newGame();
  });
  addEventListener('resize', () => { layout(); });

  /* ---------- confetti ---------- */
  const ccv = $('confetti'), cx = ccv.getContext('2d'); let bits = [], raf = 0;
  function confetti(q) {
    const dpr = Math.min(devicePixelRatio || 1, 2); ccv.width = innerWidth * dpr; ccv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const main = q ? '#ff5fa2' : '#e8994a', cols = [main, main, '#8fd8ff', '#ffffff', '#ffe08a'];
    for (let k = 0; k < 140; k++) bits.push({ x: innerWidth / 2 + (Math.random() - .5) * 140, y: innerHeight * .45, vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 4,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[k % cols.length], life: 1 });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) { b.vy += .42; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .007;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, b.life * 2)); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2))); cx.restore(); }
    bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 30);
    raf = bits.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
  }

  if (DEBUG) window.__ti = { get alive() { return alive; }, get turn() { return turn; }, get over() { return over; }, get loser() { return loser; }, get busy() { return busy; },
    play: i => play(i), safeMoves: () => safeMoves(alive), cpuPick, P, get n() { return n; },
    centre: i => { const b = cv.getBoundingClientRect(); return [b.left + cxOf(i) * SC, b.top + cyOf(i) * SC]; } };

  setSoundIcon(); segs(); newGame(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
