<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7cc4e8">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>Busy Beaver</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#3d6b3a; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { position:relative; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 360;
let H = 680, SC = 1, G = 560;            // G: ground line
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
let best = 0, muted = false;
try { const s = JSON.parse(localStorage.getItem('busybeaver') || '{}'); best = s.best || 0; muted = !!s.muted; } catch (e) {}
const persist = () => { try { localStorage.setItem('busybeaver', JSON.stringify({ best, muted })); } catch (e) {} };
function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 560, 780)); G = H - 96;
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W;
}

/* ---------- sound (synthesised) ---------- */
let ac = null, nb = null;
function audio() { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, d, type = 'sine', vol = .05, delay = 0, slide = 0) {
  if (!ac || muted) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, f = 2000, q = 1, delay = 0) {
  if (!ac || muted) return; if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime + delay, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nb; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + d);
}
const sChomp = () => { noise(.06, .22, rnd(2600, 3600), 2); tone(rnd(180, 230), .04, 'square', .02); };
const sCreak = () => tone(140, .35, 'sawtooth', .025, 0, -60);
const sTimber = () => { noise(.9, .12, 800, .6); tone(500, .7, 'sine', .03, 0, -380); };
const sThud = () => { noise(.35, .4, 160, .7); tone(70, .3, 'sine', .12, 0, -30); };
const sSplash = () => { noise(.6, .3, 1400, .5); tone(600, .25, 'sine', .03, .05, -400); };
const sBonk = () => { tone(520, .1, 'square', .04, 0, -200); tone(780, .15, 'triangle', .04, .08, -300); };
const sTwig = () => { tone(880, .07, 'triangle', .04); tone(1320, .1, 'triangle', .04, .06); };
const sWin = () => [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .22, 'triangle', .06, i * .08));
const sClimb = () => [0, 3, 5, 7].forEach((s, i) => tone(392 * Math.pow(2, s / 12), .07, 'triangle', .035, i * .06));
const sGiggle = () => [0, 1, 2, 3].forEach(i => tone(1200 + (i % 2) * 300, .06, 'sine', .035, i * .07));
const sThrow = () => tone(700, .12, 'triangle', .025, 0, -300);
const sSnack = () => { tone(660, .06, 'square', .025); tone(990, .09, 'triangle', .04, .05); };
const sNap = () => [7, 4, 0].forEach((s, i) => tone(392 * Math.pow(2, s / 12), .35, 'triangle', .05, i * .2));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- world ---------- */
const RIVER = 78;                                 // river along the right edge
const RX = () => W - RIVER;
const NOTCH = 15;                                 // chew height above the ground
const TYPES = {
  birch: { bark: '#ece7dc', barkD: '#c9c2b2', mark: '#3a332b', leaf: ['#a8d86a', '#86c24e', '#c3e88a'], hp: .55, shape: 'round' },
  oak: { bark: '#8a5a34', barkD: '#6b4226', mark: '#4e2f19', leaf: ['#4e9f45', '#3f8a38', '#6cbf5c'], hp: .75, shape: 'round' },
  pine: { bark: '#7a4a2a', barkD: '#5c3820', mark: '#40261a', leaf: ['#2f7a4a', '#25663c', '#3f9460'], hp: .65, shape: 'pine' },
};
let state = 'title', lvl = 1, score = 0, timeLeft = 40, tStart = 40, dam = 0, damNeed = 3, trees = [], parts = [], pops = [], twigs = [], time = 0, endT = 0, shake = 0, clearInfo = null;
let bv, squirrels = [], nuts = [], snacks = [], birds = [], sqT = 3, birdT = 6;
function makeBeaver() { return { x: 40, face: 1, vx: 0, walk: 0, chew: 0, cd: 0, dazed: 0, blink: 0, climb: null }; }
function setupLevel() {
  const n = Math.min(8, 3 + Math.floor(lvl / 2)), types = lvl < 2 ? ['birch'] : lvl < 4 ? ['birch', 'oak'] : ['birch', 'oak', 'pine'];
  trees = []; parts = []; pops = []; twigs = []; dam = 0; damNeed = Math.min(5, 2 + Math.floor(lvl / 2));
  const left = 54, right = RX() - 26, span = right - left;
  for (let i = 0; i < n; i++) {
    const type = pick(types), w = Math.round(rnd(14, 18) + Math.min(14, lvl * 1.4) * Math.random()), h = rnd(G * .42, G * .6);
    const x = left + span * (n === 1 ? .5 : i / (n - 1)) + rnd(-6, 6);
    const hp = Math.round(w * TYPES[type].hp + 2);
    trees.push({ apple: Math.random() < .35, x, w, h, type, hp, max: hp, st: 'stand', ang: 0, av: 0, dir: 1, fade: 1, sway: rnd(0, 6), marks: Array.from({ length: 6 }, () => [rnd(.15, .95), rnd(-.4, .4), rnd(.2, .5)]) });
  }
  if (!trees.some(t => t.apple)) trees[Math.floor(Math.random() * trees.length)].apple = true;
  bv = makeBeaver(); squirrels = []; nuts = []; snacks = []; birds = []; sqT = 2.5; birdT = 5;
  tStart = timeLeft = Math.round(18 + n * 7 - Math.min(14, lvl * 1.2));
  twigT = 4;
}
let twigT = 4, seenSquirrel = false;
function startGame() { lvl = 1; score = 0; state = 'play'; setupLevel(); msg('Level 1', 1.4); tone(440, .12, 'triangle', .05, 0, 220); }
let banner = null;
const msg = (t, life = 1.2) => banner = { t, life };

/* ---------- input: drag to walk, tap to chomp, hold to chew ---------- */
const keys = { left: 0, right: 0, chew: 0 };
let drag = null;
const canStart = () => state === 'title' || (state === 'over' && endT > 1.2);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (x < 50 && y < 56) { location.href = '../'; return; }
  if (x > W - 50 && y < 56) { muted = !muted; persist(); return; }
  if (canStart()) { startGame(); return; }
  if (state === 'clear' && endT > 1) { lvl++; setupLevel(); state = 'play'; msg('Level ' + lvl, 1.4); return; }
  if (state !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { id: e.pointerId, sx: e.clientX, x: e.clientX, sy: e.clientY, t: performance.now(), moved: false, held: false, climbed: false };
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return; drag.x = e.clientX;
  const r = cv.getBoundingClientRect(), up = (drag.sy - e.clientY) * H / r.height, side = Math.abs(drag.x - drag.sx) * W / r.width;
  if (!drag.climbed && up > 28 && up > side * 1.2) { drag.climbed = true; drag.moved = true; drag.sx = drag.x; tryClimb(); return; }
  if (Math.abs(drag.x - drag.sx) > 12) drag.moved = true;
});
function endDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved && performance.now() - drag.t < 260) chomp(true);
  drag = null;
}
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, endDrag));
const KM = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ' ': 'chew', ArrowDown: 'chew', Enter: 'chew', ArrowUp: 'climb', w: 'climb' };
addEventListener('keydown', e => {
  const k = KM[e.key]; if (!k) return; e.preventDefault(); audio();
  if (canStart()) { startGame(); return; }
  if (state === 'clear' && endT > 1) { lvl++; setupLevel(); state = 'play'; msg('Level ' + lvl, 1.4); return; }
  if (k === 'climb') { tryClimb(); return; }
  if (k === 'chew' && !keys.chew) chomp(true);
  keys[k] = 1;
});
addEventListener('keyup', e => { const k = KM[e.key]; if (k) keys[k] = 0; });
addEventListener('blur', () => { keys.left = keys.right = keys.chew = 0; drag = null; });

/* ---------- chewing ---------- */
const MOUTH = 17;
function target() {
  let best = null, bd = 1e9;
  for (const t of trees) if (t.st === 'stand') {
    const d = Math.abs(t.x - bv.x); if (d < t.w / 2 + 34 && d < bd) { bd = d; best = t; }
  }
  return best;
}
function tryClimb() {
  if (state !== 'play' || bv.dazed > 0 || bv.climb) return;
  const t = target(); if (!t) { tone(300, .05, 'triangle', .02); return; }
  bv.face = t.x >= bv.x ? 1 : -1; bv.x = t.x - bv.face * (t.w / 2 + 18);
  bv.climb = { tree: t, y: 0, phase: 'up', hold: 0 }; sClimb();
}
function reachTop(t) {
  let got = false;
  if (t.apple) { t.apple = false; got = true; timeLeft += 5; score += 50; pops.push({ t: 'Apple! +5s', x: t.x, y: G - t.h - 4, life: 1.3, c: '#ff8a8a' }); sTwig(); for (let i = 0; i < 8; i++) parts.push({ x: t.x, y: G - t.h + 20, vx: rnd(-80, 80), vy: rnd(-160, -40), g: 500, life: .7, max: .7, s: rnd(2, 3), c: '#ff5a5a', k: 'drop' }); }
  for (const q of squirrels) if (q.tree === t && q.st === 'sit') { tickle(q); got = true; }
  if (!got) pops.push({ t: 'Nice view!', x: t.x, y: G - t.h, life: 1, c: '#fff' });
}
function tickle(q) { q.st = 'run'; q.vy = -160; q.vx = (q.x < W / 2 ? -1 : 1) * 130; score += 150; sGiggle(); pops.push({ t: 'Tickled! +150', x: q.x, y: q.y - 20, life: 1.3, c: '#ffe36b' }); }
function chomp(tap) {
  if (state !== 'play' || bv.dazed > 0 || bv.cd > 0 || bv.climb) return;
  const t = target(); bv.chew = .14; bv.cd = tap ? .09 : .17;
  if (!t) { tone(300, .05, 'triangle', .02); return; }
  bv.face = t.x >= bv.x ? 1 : -1;
  // stand just beside the trunk while chewing
  bv.x += ((t.x - bv.face * (t.w / 2 + 18)) - bv.x) * .5;
  t.hp--; sChomp(); t.shake = .12;
  const cx = t.x - bv.face * t.w / 2, cy = G - NOTCH;
  for (let i = 0; i < 4; i++) parts.push({ x: cx, y: cy + rnd(-4, 4), vx: -bv.face * rnd(30, 140), vy: rnd(-180, -60), g: 700, life: rnd(.5, .9), max: .9, s: rnd(2, 4), c: pick([TYPES[t.type].bark, '#f2d9a6', '#e6c487']), r: rnd(0, 6), vr: rnd(-10, 10), k: 'chip' });

  if (t.hp <= 0) fell(t, bv.face);
}
function fell(t, dir) {
  for (const q of squirrels) if (q.tree === t && q.st === 'sit') { q.st = 'run'; q.vy = -120; q.vx = -dir * 120; pops.push({ t: 'Wheee!', x: q.x, y: q.y - 18, life: 1, c: '#fff' }); sGiggle(); }
  t.st = 'fall'; t.dir = dir; t.av = .4; sTimber(); buzz(30);
  msg(pick(['Timber!', 'Tim-berrr!', 'Timber!']), 1);
  for (let i = 0; i < 8; i++) parts.push({ x: t.x, y: G - NOTCH, vx: rnd(-80, 80), vy: rnd(-200, -60), g: 700, life: rnd(.5, 1), max: 1, s: rnd(2, 4), c: '#f2d9a6', r: rnd(0, 6), vr: rnd(-10, 10), k: 'chip' });
}
function landed(t) {
  const top = t.x + t.dir * t.h, inRiver = t.dir > 0 && top > RX() + 10;
  shake = 5; sThud(); buzz(50);
  // leaves burst where the canopy hits
  const lx = t.x + t.dir * (t.h - 30);
  for (let i = 0; i < 16; i++) parts.push({ x: lx + rnd(-30, 30), y: G - 10, vx: rnd(-80, 80), vy: rnd(-200, -40), g: 260, life: rnd(.8, 1.5), max: 1.5, s: rnd(3, 5), c: pick(TYPES[t.type].leaf), r: rnd(0, 6), vr: rnd(-6, 6), k: 'leaf' });
  if (inRiver) {
    t.st = 'river'; dam++; sSplash(); score += 150; pops.push({ t: '+150 dam log!', x: RX() + RIVER / 2 - 10, y: G - 60, life: 1.3, c: '#bff4ff' });
    for (let i = 0; i < 18; i++) parts.push({ x: rnd(RX(), W), y: G + 4, vx: rnd(-60, 60), vy: rnd(-260, -80), g: 700, life: rnd(.5, .9), max: .9, s: rnd(2, 4), c: pick(['#bfe9ff', '#ffffff', '#8fd3f4']), k: 'drop' });
    if (dam === damNeed) { score += 500; msg('Dam built! +500', 1.6); [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .18, 'triangle', .05, i * .07)); }
  } else { t.st = 'down'; score += 100; pops.push({ t: '+100', x: lx, y: G - 40, life: 1.1, c: '#fff' }); }
  timeLeft += 3; pops.push({ t: '+3s', x: t.x, y: G - 70, life: 1.1, c: '#9dff8a' });
  if (t.apple && !inRiver) { t.apple = false; snacks.push({ x: clamp(lx, 20, RX() - 20), kind: 'apple', life: 6 }); }
  // a tree landing on the beaver: a harmless bonk
  const a = Math.min(t.x, top), b = Math.max(t.x, top);
  if (bv.x > a + 8 && bv.x < b && Math.abs(bv.x - t.x) > t.w / 2 + 6 && bv.dazed <= 0) {
    bv.dazed = 1.6; sBonk(); bv.x = clamp(bv.x - t.dir * 10, 16, RX() - 10); pops.push({ t: 'Bonk!', x: bv.x, y: G - 50, life: 1, c: '#ffe36b' });
  }
}

/* ---------- update ---------- */
function update(dt) {
  time += dt; shake *= Math.pow(.01, dt);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  for (const p of parts) { p.life -= dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.r += p.vr * dt; if (p.k === 'leaf') p.vx *= Math.pow(.4, dt); if ((p.k === 'chip' || p.k === 'leaf') && p.y > G + 2 && p.x < RX()) { p.y = G + 2; p.vy = 0; p.vx *= .5; } }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 30 * dt; } pops = pops.filter(p => p.life > 0);
  for (const t of trees) {
    if (t.shake > 0) t.shake -= dt;
    if (t.st === 'fall') { t.av += (2.2 + Math.sin(t.ang) * 7) * dt; t.ang += t.av * dt; if (t.ang >= 1.5) { t.ang = 1.5; landed(t); } }
    else if (t.st === 'down' || t.st === 'river') { t.fade -= dt * (t.st === 'river' ? .25 : .5); }
  }
  if (state !== 'play') { endT += dt; return; }
  // walking
  let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (drag && drag.moved) { const r = cv.getBoundingClientRect(), off = (drag.x - drag.sx) * W / r.width; dir = Math.abs(off) > 6 ? Math.sign(off) : 0; }
  if (bv.dazed > 0) { bv.dazed -= dt; dir = 0; }
  if (bv.climb) {   // up the trunk, a peek at the top, then back down
    const c = bv.climb, top = c.tree.h - 34; dir = 0; bv.walk += dt;
    if (c.phase === 'up') { c.y += 230 * dt; if (c.y >= top) { c.y = top; c.phase = 'top'; reachTop(c.tree); } }
    else if (c.phase === 'top') { c.hold += dt; if (c.hold > .35) c.phase = 'down'; }
    else { c.y -= 320 * dt; if (c.y <= 0) bv.climb = null; }
  }
  bv.vx = dir * 120; if (dir) { bv.face = dir; bv.walk += dt; }
  bv.x = clamp(bv.x + bv.vx * dt, 22, RX() - 16);
  bv.cd -= dt; bv.chew -= dt; bv.blink = (bv.blink + dt) % 3.6;
  const holding = (drag && !drag.moved && performance.now() - drag.t > 260) || keys.chew;
  if (holding && !dir) chomp(false);
  // squirrels perch in the treetops and lob acorns; birds drop berries
  const standing = trees.filter(t => t.st === 'stand');
  if (lvl >= 2) { sqT -= dt; const maxSq = lvl >= 5 ? 2 : 1;
    if (sqT <= 0) { sqT = rnd(4, 7); const free = standing.filter(t => !squirrels.some(q => q.tree === t && q.st === 'sit') && !(bv.climb && bv.climb.tree === t));
      if (free.length && squirrels.filter(q => q.st === 'sit').length < maxSq) { const t = pick(free), side = Math.random() < .5 ? -1 : 1; squirrels.push({ tree: t, side, st: 'sit', x: t.x + side * 14, y: G - NOTCH - t.h + 26, throwT: 1.6, vx: 0, vy: 0, hop: 0 }); if (!seenSquirrel) { seenSquirrel = true; msg('Squirrel! Climb up to tickle it', 2); } } } }
  for (const q of squirrels) {
    if (q.st === 'sit') { q.hop += dt; q.throwT -= dt;
      if (q.throwT <= 0 && !(bv.climb && bv.climb.tree === q.tree)) { q.throwT = Math.max(1.6, 3.2 - lvl * .15) + rnd(0, 1); const T = .95, tx = clamp(bv.x + bv.vx * .5, 10, RX() - 10); nuts.push({ x: q.x, y: q.y - 6, vx: (tx - q.x) / T, vy: (G - 18 - (q.y - 6) - .5 * 600 * T * T) / T, g: 600, kind: 'acorn', r: 0 }); sThrow(); q.throwAnim = .25; } }
    else { q.vy += 600 * dt; q.x += q.vx * dt; q.y = Math.min(G - 4, q.y + q.vy * dt); if (q.y >= G - 4) q.vy = 0; if (q.x < -30 || q.x > W + 30) q.gone = true; }
    if (q.throwAnim) q.throwAnim = Math.max(0, q.throwAnim - dt);
  }
  squirrels = squirrels.filter(q => !q.gone);
  if (lvl >= 3) { birdT -= dt; if (birdT <= 0) { birdT = rnd(5, 8.5); const fromL = Math.random() < .5; birds.push({ x: fromL ? -20 : W + 20, y: G * .28 + rnd(-20, 30), vx: (fromL ? 1 : -1) * (85 + lvl * 4), dropped: false, ph: rnd(0, 6) }); } }
  for (const b of birds) { b.x += b.vx * dt; b.ph += dt * 14;
    if (!b.dropped && Math.abs(b.x - (bv.x + bv.vx * .55)) < 14 && b.x > 10 && b.x < RX()) { b.dropped = true; nuts.push({ x: b.x, y: b.y + 6, vx: b.vx * .25, vy: 20, g: 520, kind: 'berry', r: 0 }); tone(1500, .08, 'sine', .03, 0, 300); } }
  birds = birds.filter(b => b.x > -40 && b.x < W + 40);
  for (const n of nuts) {
    n.vy += n.g * dt; n.x += n.vx * dt; n.y += n.vy * dt; n.r += dt * 8;
    if (!bv.climb && bv.dazed <= 0 && Math.abs(n.x - bv.x) < 18 && n.y > G - 44 && n.y < G) { n.gone = true; bv.dazed = 1.1; sBonk(); buzz(25); pops.push({ t: n.kind === 'acorn' ? 'Bonk! Acorn!' : 'Splat! Berry!', x: bv.x, y: G - 60, life: 1, c: '#ffe36b' }); }
    else if (n.y >= G - 3) { n.gone = true; if (n.x < RX() - 6) snacks.push({ x: clamp(n.x, 12, RX() - 12), kind: n.kind, life: 5 }); }
  }

    const lines = ['Drag left or right to walk', 'Tap fast (or hold) to chew a tree', 'Chew from the left to build a dam!', 'Swipe up by a tree to climb for apples', 'Dodge acorns from cheeky squirrels', '(climb up and tickle them!)', 'Clear every tree before time runs out'];
    rr(30, H * .36, W - 60, lines.length * 22 + 20, 16); ctx.fillStyle = 'rgba(40,30,15,.55)'; ctx.fill();
    lines.forEach((l, i) => txt(l, W / 2, H * .36 + 22 + i * 22, 13, '#fff', 'center', null));
    if (Math.sin(time * 5) > -.3) txt('Tap to start', W / 2, H * .36 + lines.length * 22 + 56, 22, '#ffe36b', 'center', '#4a2f1a');
    if (best) txt('Best ' + best, W / 2, H * .36 + lines.length * 22 + 86, 13, '#fff');
  }
  if (state === 'clear' && endT > .3) {
    rr(40, H * .22, W - 80, 190, 22); ctx.fillStyle = 'rgba(255,248,230,.95)'; ctx.fill();
    txt('All chewed!', W / 2, H * .22 + 40, 32, '#8a5a34', 'center', null);
    txt(`Time bonus +${clearInfo.bonus}`, W / 2, H * .22 + 82, 15, '#4a2f1a', 'center', null);
    txt(clearInfo.dam >= damNeed ? `Dam built with ${clearInfo.dam} logs!` : `Dam logs: ${clearInfo.dam}/${damNeed}`, W / 2, H * .22 + 106, 15, '#2a7ab8', 'center', null);
    txt('Score ' + score, W / 2, H * .22 + 134, 17, '#4a2f1a', 'center', null);
    if (endT > 1 && Math.sin(time * 5) > -.3) txt('Tap for the next wood', W / 2, H * .22 + 166, 16, '#3f8a38', 'center', null);
  }
  if (state === 'over' && endT > .5) {
    rr(40, H * .22, W - 80, 170, 22); ctx.fillStyle = 'rgba(255,248,230,.95)'; ctx.fill();
    txt("Time's up!", W / 2, H * .22 + 40, 32, '#8a5a34', 'center', null);
    txt('Busy Beaver is having a nap.', W / 2, H * .22 + 76, 14, '#4a2f1a', 'center', null);
    txt(`Score ${score} · reached level ${lvl}`, W / 2, H * .22 + 102, 15, '#4a2f1a', 'center', null); txt('Best ' + Math.max(best, score), W / 2, H * .22 + 124, 13, '#8a5a34', 'center', null);
    if (endT > 1.2 && Math.sin(time * 5) > -.3) txt('Tap to chew again', W / 2, H * .22 + 152, 16, '#3f8a38', 'center', null);
  }
}

let last = performance.now();
function frame(now) { const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); draw(); requestAnimationFrame(frame); }
addEventListener('resize', resize); resize(); setupLevel();
if (/[?&]debug\b/.test(location.search)) window.__bb = { get state() { return state; }, get trees() { return trees.map(t => ({ x: t.x, w: t.w, h: t.h, st: t.st, hp: t.hp })); }, get bv() { return { x: bv.x, dazed: bv.dazed, climb: !!bv.climb }; }, get squirrels() { return squirrels.map(q => ({ st: q.st, x: q.x })); }, get nuts() { return nuts.length; }, get snacks() { return snacks.length; }, get birds() { return birds.length; }, tryClimb, setLevel(n) { lvl = n; setupLevel(); state = 'play'; }, get dam() { return dam; }, get time() { return timeLeft; }, get score() { return score; }, startGame };
requestAnimationFrame(frame);
})();
