<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120f1f">
<title>Naughts and Crosses</title>
<style>
  :root {
    --bg1:#1b1530; --bg2:#0d0b17; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.10);
    --ink:#f4f0ff; --mute:#a59fc0; --grid:rgba(255,255,255,.14);
    --x:#ff6b6b; --x-glow:rgba(255,107,107,.45); --o:#38d9a9; --o-glow:rgba(56,217,169,.45); --accent:#ffd43b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg1:#fff7ef; --bg2:#f1ecff; --card:rgba(255,255,255,.75); --card-b:rgba(30,20,60,.10);
            --ink:#1f1a33; --mute:#6c6585; --grid:rgba(30,20,60,.16); --x:#f03e3e; --x-glow:rgba(240,62,62,.3); --o:#0ca678; --o-glow:rgba(12,166,120,.3); --accent:#f08c00; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body { min-height:100dvh; display:flex; align-items:center; justify-content:center; color:var(--ink);
         background:radial-gradient(900px 600px at 20% -10%, color-mix(in srgb, var(--x) 22%, transparent), transparent 60%),
                    radial-gradient(900px 600px at 100% 110%, color-mix(in srgb, var(--o) 22%, transparent), transparent 60%),
                    linear-gradient(160deg, var(--bg1), var(--bg2));
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:min(94vw,430px); padding:22px 0 28px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { margin:0; font-size:1.55rem; font-weight:900; letter-spacing:-.02em; }
  h1 .x { color:var(--x); } h1 .o { color:var(--o); }
  .icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--card-b); background:var(--card); color:var(--ink);
              display:grid; place-items:center; cursor:pointer; font-size:1.05rem; backdrop-filter:blur(8px); }
  button { font:inherit; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  /* segmented mode control */
  .seg { position:relative; display:grid; grid-template-columns:repeat(3,1fr); padding:4px; border-radius:14px;
         background:var(--card); border:1px solid var(--card-b); backdrop-filter:blur(8px); }
  .seg .thumb { position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px)/3); border-radius:10px;
                background:var(--ink); transition:transform .28s cubic-bezier(.3,1.4,.5,1); }
  .seg button { position:relative; z-index:1; border:0; background:none; color:var(--mute); padding:9px 4px; font-weight:700; font-size:.88rem;
                cursor:pointer; border-radius:10px; transition:color .2s; }
  .seg button[aria-pressed="true"] { color:var(--bg2); }

  /* scoreboard */
  .scores { display:grid; grid-template-columns:1fr .8fr 1fr; gap:10px; margin:16px 0 14px; }
  .sc { border-radius:16px; padding:10px 12px; background:var(--card); border:1px solid var(--card-b); text-align:center;
        transition:transform .25s, box-shadow .25s, border-color .25s; backdrop-filter:blur(8px); }
  .sc .who { font-size:.74rem; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; display:flex; gap:6px; align-items:center; justify-content:center; }
  .sc .n { font-size:1.7rem; font-weight:900; line-height:1.2; font-variant-numeric:tabular-nums; }
  .sc.x .n { color:var(--x); } .sc.o .n { color:var(--o); }
  .sc.active.x { border-color:var(--x); box-shadow:0 0 0 1px var(--x), 0 8px 26px var(--x-glow); transform:translateY(-2px); }
  .sc.active.o { border-color:var(--o); box-shadow:0 0 0 1px var(--o), 0 8px 26px var(--o-glow); transform:translateY(-2px); }
  .sc .n.bump { animation:bump .45s ease; }
  @keyframes bump { 40% { transform:scale(1.35); } }
  .mini { width:12px; height:12px; flex:none; overflow:visible; }
  .mini path, .mini circle { fill:none; stroke-width:16; stroke-linecap:round; }

  #status { min-height:1.6em; text-align:center; font-weight:800; font-size:1.08rem; margin:4px 0 12px; }
  #status .x { color:var(--x); } #status .o { color:var(--o); }
  .thinking span { display:inline-block; animation:blink 1s infinite; } .thinking span:nth-child(2){animation-delay:.15s} .thinking span:nth-child(3){animation-delay:.3s}
  @keyframes blink { 0%,100% { opacity:.2 } 50% { opacity:1 } }

  /* board */
  .board-wrap { position:relative; padding:12px; border-radius:24px; background:var(--card); border:1px solid var(--card-b);
                box-shadow:0 20px 50px rgba(0,0,0,.25); backdrop-filter:blur(10px); }
  #board { position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; aspect-ratio:1; }
  .cell { position:relative; border:0; border-radius:16px; background:var(--grid); cursor:pointer; padding:0; aspect-ratio:1;
          transition:background .2s, transform .12s; }
  .cell:active:not(:disabled) { transform:scale(.95); }
  .cell:disabled { cursor:default; }
  .cell svg { position:absolute; inset:16%; width:68%; height:68%; overflow:visible; }
  .mark path, .mark circle { fill:none; stroke-width:15; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .32s ease-out forwards; }
  .mark.X path { stroke:var(--x); filter:drop-shadow(0 0 8px var(--x-glow)); } .mark.X path:nth-child(2) { animation-delay:.14s; }
  .mark.O circle { stroke:var(--o); filter:drop-shadow(0 0 8px var(--o-glow)); }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .ghost { opacity:0; transition:opacity .15s; }
  .ghost path, .ghost circle { fill:none; stroke-width:15; stroke-linecap:round; }
  @media (hover:hover) { #board:not(.locked) .cell:not(:disabled):hover .ghost { opacity:.18; } }
  .cell.win { animation:winpop .5s ease both; }
  .cell.win.X { background:color-mix(in srgb, var(--x) 22%, var(--grid)); } .cell.win.O { background:color-mix(in srgb, var(--o) 22%, var(--grid)); }
  .cell.dim .mark { opacity:.3; transition:opacity .4s; }
  .cell:disabled .ghost { display:none; }
  @keyframes winpop { 50% { transform:scale(1.07); } }
  #strike { position:absolute; inset:12px; pointer-events:none; width:calc(100% - 24px); height:calc(100% - 24px); overflow:visible; }
  #strike line { stroke-width:9; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; }
  #strike line.go { animation:draw .4s .15s ease-out forwards; }

  .actions { display:flex; gap:10px; margin-top:16px; }
  .btn { flex:1; border:0; border-radius:14px; padding:13px; font-weight:800; font-size:1rem; cursor:pointer; transition:transform .12s, filter .2s; }
  .btn:active { transform:scale(.97); }
  .primary { background:linear-gradient(135deg, var(--x), var(--accent) 55%, var(--o)); color:#140f22; }
  .ghost-btn { flex:.55; background:var(--card); color:var(--ink); border:1px solid var(--card-b); }
  .hint { text-align:center; color:var(--mute); font-size:.8rem; margin-top:14px; }
  #confetti { position:fixed; inset:0; pointer-events:none; width:100vw; height:100vh; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
  <header>
    <h1><span class="x">Naughts</span> &amp; <span class="o">Crosses</span></h1>
    <button class="icon-btn" id="sound" aria-label="Sound on" title="Sound">🔊</button>
  </header>

  <div class="seg" role="group" aria-label="Game mode">
    <span class="thumb" id="thumb"></span>
    <button data-mode="easy" aria-pressed="false">Easy</button>
    <button data-mode="hard" aria-pressed="true">Unbeatable</button>
    <button data-mode="two" aria-pressed="false">2 Players</button>
  </div>

  <div class="scores">
    <div class="sc x" id="cardX"><div class="who"><svg class="mini" viewBox="0 0 100 100" aria-hidden="true" style="stroke:var(--x)"><path d="M15 15 L85 85 M85 15 L15 85"/></svg><span id="nameX">You</span></div><div class="n" id="sx">0</div></div>
    <div class="sc"><div class="who">Draws</div><div class="n" id="sd">0</div></div>
    <div class="sc o" id="cardO"><div class="who"><svg class="mini" viewBox="0 0 100 100" aria-hidden="true" style="stroke:var(--o)"><circle cx="50" cy="50" r="38"/></svg><span id="nameO">Computer</span></div><div class="n" id="so">0</div></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div class="board-wrap">
    <div id="board" role="grid" aria-label="Game board"></div>
    <svg id="strike" viewBox="0 0 300 300" aria-hidden="true"><line id="strikeLine" pathLength="1"/></svg>
  </div>

  <div class="actions">
    <button class="btn primary" id="newGame">New game</button>
    <button class="btn ghost-btn" id="resetScore">Reset score</button>
  </div>
  <p class="hint">Who starts swaps every game · Keys 1–9 to play</p>
</main>

<script>
(() => {
  'use strict';
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const HUMAN = 'X', CPU = 'O';
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), statusEl = $('status');
  const X_SVG = '<path pathLength="1" d="M15 15 L85 85"/><path pathLength="1" d="M85 15 L15 85"/>';
  const O_SVG = '<circle pathLength="1" cx="50" cy="50" r="36" transform="rotate(-90 50 50)"/>';

  let mode = 'hard', board = Array(9).fill(''), turn = 'X', starter = 'X', over = false, token = 0, muted = false;
  let scores = { easy: { X: 0, O: 0, D: 0 }, hard: { X: 0, O: 0, D: 0 }, two: { X: 0, O: 0, D: 0 } };
  try { const s = JSON.parse(localStorage.getItem('nac-scores')); if (s && s.easy) scores = s; muted = localStorage.getItem('nac-muted') === '1'; } catch (e) {}
  const save = () => { try { localStorage.setItem('nac-scores', JSON.stringify(scores)); localStorage.setItem('nac-muted', muted ? '1' : '0'); } catch (e) {} };

  /* ---------- sound ---------- */
  let ac = null;
  function tone(f, d = .12, type = 'sine', vol = .06, delay = 0, slide = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f + slide, t + d);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  }
  const sndPlace = m => m === 'X' ? tone(520, .12, 'triangle', .07, 0, 140) : tone(392, .14, 'sine', .08, 0, 100);
  const sndWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .07, i * .09));
  const sndLose = () => [392, 330, 262].forEach((f, i) => tone(f, .25, 'sine', .06, i * .12));
  const sndDraw = () => { tone(440, .2, 'sine', .05); tone(440, .2, 'sine', .05, .18); };

  /* ---------- board ---------- */
  const cells = [...Array(9)].map((_, i) => {
    const b = document.createElement('button');
    b.className = 'cell'; b.setAttribute('role', 'gridcell');
    b.innerHTML = `<svg class="ghost" viewBox="0 0 100 100" aria-hidden="true"></svg>`;
    b.addEventListener('click', () => humanPlay(i));
    boardEl.appendChild(b); return b;
  });

  const winner = b => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l }; return null; };
  const isCpuTurn = () => mode !== 'two' && turn === CPU && !over;
  const name = m => mode === 'two' ? (m === 'X' ? 'Crosses' : 'Naughts') : (m === HUMAN ? 'You' : 'Computer');

  function newGame() {
    token++;                                   // cancels any computer move still pending from the last game
    board = Array(9).fill(''); over = false; turn = starter; starter = starter === 'X' ? 'O' : 'X';
    cells.forEach((c, i) => { c.className = 'cell'; c.disabled = false; c.querySelector('.mark')?.remove(); c.setAttribute('aria-label', `Square ${i + 1}, empty`); });
    $('strikeLine').classList.remove('go');
    refresh();
    if (isCpuTurn()) scheduleCpu();
  }

  function humanPlay(i) {
    if (over || board[i] || isCpuTurn()) return;
    place(i);
  }

  function place(i) {
    const m = turn; board[i] = m;
    const c = cells[i]; c.disabled = true;
    c.insertAdjacentHTML('beforeend', `<svg class="mark ${m}" viewBox="0 0 100 100" aria-hidden="true">${m === 'X' ? X_SVG : O_SVG}</svg>`);
    c.setAttribute('aria-label', `Square ${i + 1}, ${m === 'X' ? 'cross' : 'naught'}`);
    sndPlace(m); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
    const w = winner(board);
    if (w) return finish(w);
    if (board.every(Boolean)) return finish(null);
    turn = m === 'X' ? 'O' : 'X';
    refresh();
    if (isCpuTurn()) scheduleCpu();
  }

  function finish(w) {
    over = true; const sc = scores[mode];
    cells.forEach(c => c.disabled = true);
    if (w) {
      sc[w.p]++;
      w.line.forEach(k => cells[k].classList.add('win', w.p));
      cells.forEach((c, k) => { if (!w.line.includes(k)) c.classList.add('dim'); });
      drawStrike(w.line, w.p);
      bump(w.p === 'X' ? 'sx' : 'so');
      const humanWon = mode === 'two' || w.p === HUMAN;
      setTimeout(() => { if (humanWon) { sndWin(); confetti(w.p); } else sndLose(); }, 250);
    } else { sc.D++; bump('sd'); sndDraw(); }
    save(); refresh(w);
  }

  function drawStrike(line, p) {
    const ctr = k => [50 + (k % 3) * 100, 50 + Math.floor(k / 3) * 100];
    const [a, b] = [ctr(line[0]), ctr(line[2])], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ext = 34;
    const el = $('strikeLine');
    el.setAttribute('x1', a[0] - dx / len * ext); el.setAttribute('y1', a[1] - dy / len * ext);
    el.setAttribute('x2', b[0] + dx / len * ext); el.setAttribute('y2', b[1] + dy / len * ext);
    el.style.stroke = `var(--${p.toLowerCase()})`;
    el.classList.remove('go'); void el.getBoundingClientRect(); el.classList.add('go');
  }

  function bump(id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  function refresh(w) {
    const sc = scores[mode];
    $('sx').textContent = sc.X; $('so').textContent = sc.O; $('sd').textContent = sc.D;
    $('nameX').textContent = mode === 'two' ? 'Crosses' : 'You';
    $('nameO').textContent = mode === 'two' ? 'Naughts' : 'Computer';
    $('cardX').classList.toggle('active', !over && turn === 'X');
    $('cardO').classList.toggle('active', !over && turn === 'O');
    boardEl.classList.toggle('locked', over || isCpuTurn());
    const ghost = turn === 'X' ? X_SVG : O_SVG, col = turn === 'X' ? 'var(--x)' : 'var(--o)';
    cells.forEach(c => { const g = c.querySelector('.ghost'); g.innerHTML = ghost; g.style.stroke = col; });
    const cls = m => m.toLowerCase();
    if (over) {
      if (!w) statusEl.innerHTML = "It's a draw";
      else if (mode === 'two') statusEl.innerHTML = `<span class="${cls(w.p)}">${name(w.p)}</span> win!`;
      else statusEl.innerHTML = w.p === HUMAN ? '<span class="x">You win!</span> 🎉' : '<span class="o">Computer wins</span>';
    } else if (isCpuTurn()) statusEl.innerHTML = `<span class="thinking o">Computer thinking<span>.</span><span>.</span><span>.</span></span>`;
    else if (mode === 'two') statusEl.innerHTML = `<span class="${cls(turn)}">${name(turn)}</span> to play`;
    else statusEl.innerHTML = board.some(Boolean) ? 'Your turn' : 'You start — tap a square';
  }

  /* ---------- computer ---------- */
  function scheduleCpu() {
    const t = token;
    setTimeout(() => { if (t !== token || !isCpuTurn()) return; place(cpuMove()); }, 420 + Math.random() * 280);
  }
  function cpuMove() {
    const empty = board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (mode === 'easy') {
      if (Math.random() > .35) { const k = findLine(CPU) ?? findLine(HUMAN); if (k != null) return k; }
      return empty[Math.floor(Math.random() * empty.length)];
    }
    if (empty.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
    let best = -Infinity, moves = [];
    for (const i of empty) {
      board[i] = CPU; const s = minimax(HUMAN, 1, -Infinity, Infinity); board[i] = '';
      if (s > best) { best = s; moves = [i]; } else if (s === best) moves.push(i);
    }
    return moves[Math.floor(Math.random() * moves.length)];
  }
  function findLine(p) {
    for (const l of LINES) { const v = l.map(k => board[k]); if (v.filter(x => x === p).length === 2 && v.includes('')) return l[v.indexOf('')]; }
    return null;
  }
  function minimax(p, depth, a, b) {
    const w = winner(board);
    if (w) return w.p === CPU ? 10 - depth : depth - 10;
    if (board.every(Boolean)) return 0;
    if (p === CPU) {
      let v = -Infinity;
      for (let i = 0; i < 9; i++) if (!board[i]) { board[i] = CPU; v = Math.max(v, minimax(HUMAN, depth + 1, a, b)); board[i] = ''; a = Math.max(a, v); if (a >= b) break; }
      return v;
    }
    let v = Infinity;
    for (let i = 0; i < 9; i++) if (!board[i]) { board[i] = HUMAN; v = Math.min(v, minimax(CPU, depth + 1, a, b)); board[i] = ''; b = Math.min(b, v); if (a >= b) break; }
    return v;
  }

  /* ---------- confetti ---------- */
  const cv = $('confetti'), cx = cv.getContext('2d'); let bits = [], raf = 0;
  function confetti(p) {
    const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const css = getComputedStyle(document.documentElement), cols = [css.getPropertyValue('--x'), css.getPropertyValue('--o'), css.getPropertyValue('--accent'), '#ffffff', '#b197fc'];
    for (let i = 0; i < 140; i++) bits.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 4,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[i % cols.length].trim(), life: 1 });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) { b.vy += .42; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .007;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, b.life * 2)); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2))); cx.restore(); }
    bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 30);
    raf = bits.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
  }

  /* ---------- controls ---------- */
  const modes = ['easy', 'hard', 'two'];
  function setMode(m) {
    mode = m; starter = 'X';
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('thumb').style.transform = `translateX(${modes.indexOf(m) * 100}%)`;
    newGame();
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); }));
  $('newGame').addEventListener('click', newGame);
  $('resetScore').addEventListener('click', () => { scores[mode] = { X: 0, O: 0, D: 0 }; save(); refresh(over ? winner(board) : undefined); });
  const setSoundIcon = () => { $('sound').textContent = muted ? '🔇' : '🔊'; $('sound').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); };
  $('sound').addEventListener('click', () => { muted = !muted; save(); setSoundIcon(); if (!muted) tone(660, .1, 'triangle', .06); });
  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '9') { const i = [6, 7, 8, 3, 4, 5, 0, 1, 2][+e.key - 1]; humanPlay(i); }   // number-pad layout
    else if (e.key === 'n' || e.key === 'N') newGame();
  });

  setSoundIcon(); setMode('hard');
})();
</script>
</body>
</html>
