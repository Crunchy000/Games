<script>if ('serviceWorker' in navigator) {
  // keep installed copies current: check for a new version whenever the app comes back to the front,
  // and switch to it straight away if it lands just after opening, otherwise after the app has been away a while
  const had = !!navigator.serviceWorker.controller, t0 = Date.now(); let swap = false, away = 0;
  addEventListener('load', () => navigator.serviceWorker.register('../sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { away = Date.now(); return; }
      if (swap && Date.now() - away > 30000) { location.reload(); return; }
      reg.update().catch(() => {});
    });
  }).catch(() => {}));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || swap) return; swap = true; if (Date.now() - t0 < 10000) location.reload(); });
}</script>

<script id="pub-kit-canvas">
/* The Bear & Bean house style for canvas games: soft clay, drawn with a 2D context.
   tools/pub-kit.py copies this into each canvas game that uses it. */
window.PK = (() => {
  const CLAY = '#c8643b', CLAY_LO = '#a94f2c', SAGE = '#dce3d3', SAGE_INK = '#3f4e35', SAGE_LO = '#c3ccb8';
  const CARD = '#f7f1e7', CARD_2 = '#efe5d6', INK = '#3b2e22', INK_2 = '#6e6152', INK_3 = '#8e7f6c', ON_CLAY = '#fff5ec', CLAY_TEXT = '#b5532e';
  const SLAB = '"ui-rounded","SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,sans-serif';
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  // a rounded button centred on (x, y); alt = sage
  function plank(g, x, y, w, h, label, opt = {}) {
    const x0 = x - w / 2, y0 = y - h / 2 + (opt.pressed ? 2 : 0), r = Math.min(16, h / 2);
    g.save();
    g.fillStyle = opt.alt ? 'rgba(60,75,45,.14)' : 'rgba(120,55,25,.2)'; rr(g, x0, y0 + 6, w, h, r); g.fill();
    g.fillStyle = opt.alt ? SAGE_LO : CLAY_LO; rr(g, x0, y0 + 2, w, h, r); g.fill();
    g.fillStyle = opt.alt ? SAGE : CLAY; rr(g, x0, y0, w, h, r); g.fill();
    g.font = `700 ${opt.size || 17}px ${SLAB}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = opt.alt ? SAGE_INK : ON_CLAY; g.fillText(label, x, y0 + h / 2 + 1);
    g.restore();
  }
  // a soft cream card
  function board(g, x, y, w, h) {
    g.save();
    g.fillStyle = 'rgba(50,30,12,.16)'; rr(g, x + 1, y + 10, w - 2, h, 24); g.fill();
    g.fillStyle = 'rgba(50,30,12,.1)'; rr(g, x, y + 3, w, h, 24); g.fill();
    g.fillStyle = CARD; rr(g, x, y, w, h, 24); g.fill();
    g.restore();
  }
  // a small rounded square button with an icon drawn by fn(g, cx, cy)
  function sign(g, x, y, w, h, fn) {
    g.save();
    g.fillStyle = 'rgba(50,30,12,.18)'; rr(g, x, y + 3, w, h, 13); g.fill();
    g.fillStyle = CARD; rr(g, x, y, w, h, 13); g.fill();
    g.strokeStyle = INK; g.fillStyle = INK; g.lineWidth = 2; g.lineJoin = 'round'; g.lineCap = 'round';
    if (fn) fn(g, x + w / 2, y + h / 2);
    g.restore();
  }
  function house(g, cx, cy) { g.beginPath(); g.moveTo(cx - 8, cy); g.lineTo(cx, cy - 7); g.lineTo(cx + 8, cy); g.moveTo(cx - 5.5, cy - 2); g.lineTo(cx - 5.5, cy + 7); g.lineTo(cx + 5.5, cy + 7); g.lineTo(cx + 5.5, cy - 2); g.stroke(); }
  function homeSign(g, x, y, w = 38, h = 38) { sign(g, x, y, w, h, house); }
  // "THE BEAR & BEAN PRESENTS" with both faces
  function presents(g, x, y, imgs, opt = {}) {
    const s = opt.size || 10, txt = (opt.text || 'THE BEAR & BEAN PRESENTS').split('').join(String.fromCharCode(8202));
    g.save(); g.font = `700 ${s}px ${SLAB}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(txt).width, r = s * 1.15;
    g.fillStyle = opt.color || INK_3; g.fillText(txt, x, y);
    if (imgs) [[imgs[0], x - tw / 2 - r - 6], [imgs[1], x + tw / 2 + r + 6]].forEach(([im, cx]) => face(g, im, cx, y, r));
    g.restore();
  }
  function face(g, im, cx, cy, r) {
    g.save(); g.fillStyle = 'rgba(60,35,15,.22)'; g.beginPath(); g.arc(cx, cy + 1, r + 2, 0, 6.2832); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, r + 2, 0, 6.2832); g.fill();
    if (im && im.complete && im.naturalWidth) { g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.clip(); g.drawImage(im, cx - r, cy - r, r * 2, r * 2); }
    g.restore();
  }
  // a word from Bear or Bean
  function says(g, x, y, w, im, who, line, opt = {}) {
    g.save(); const h = 54;
    g.fillStyle = CARD_2; rr(g, x, y, w, h, 16); g.fill();
    face(g, im, x + 30, y + h / 2, 18);
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = `700 10px ${SLAB}`; g.fillStyle = CLAY_TEXT; g.fillText(who.toUpperCase() + ' SAYS', x + 58, y + 17);
    g.font = `700 ${opt.size || 14}px ${SLAB}`; g.fillStyle = INK; g.fillText(line, x + 58, y + 36);
    g.restore();
  }
  // CREAM and CREAM_DIM are the text colours to use on a card (named before the restyle)
  return { plank, board, sign, homeSign, house, presents, face, says, rr, SLAB, CREAM: INK, CREAM_DIM: INK_2, INK, INK_2, INK_3, CLAY, CLAY_TEXT, CARD, BRASS: CLAY_TEXT };
})();
</script>
<script id="pub-kit-settings">
window.BB = (() => {
  const KEY = 'bearbean-settings'; let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  return {
    get muted() { return 'muted' in s ? !!s.muted : null; }, set muted(v) { s.muted = !!v; put(); },
    get theme() { return s.theme || null; }, set theme(v) { if (v) s.theme = v; else delete s.theme; put(); },
    // going back to all the games: a game sets BB.leaveRisk to a function that says whether a game in progress would be
    // lost; if it would, BB.home() (and any link back home) asks first. BB.asking is true while the question is up, so a
    // game that runs on its own can pause.
    leaveRisk: null, asking: false,
    home(href = '../') { if (BB.leaveRisk && BB.leaveRisk()) askLeave(href); else location.href = href; },
  };
})();
function askLeave(href, byBack) {
  let d = document.getElementById('pk-leave');
  if (!d) {
    d = document.createElement('div'); d.id = 'pk-leave'; d.className = 'pk-leave';
    d.innerHTML = '<div class="pk-card pk-leave-card" role="alertdialog" aria-modal="true" aria-labelledby="pk-leave-t" aria-describedby="pk-leave-d">'
      + '<h2 id="pk-leave-t">Leave this game?</h2><p id="pk-leave-d">The game you’re playing won’t be saved.</p>'
      + '<div class="pk-leave-row"><button type="button" class="pk-btn pk-small" data-stay>Keep playing</button><button type="button" class="pk-btn pk-alt pk-small" data-go>Leave</button></div></div>';
    document.body.appendChild(d);
    const close = () => { d.classList.remove('show'); BB.asking = false; armBack(); };   // staying: the back gesture is guarded again
    const go = () => {
      if (d.dataset.back !== '1') { location.href = d.dataset.href; return; }
      // came by the back gesture: carry on back, or home if there's nowhere to go back to
      const t = setTimeout(() => { location.href = d.dataset.href; }, 500); addEventListener('pagehide', () => clearTimeout(t), { once: true }); history.back();
    };
    d.addEventListener('pointerdown', e => e.stopPropagation());
    d.addEventListener('click', e => { e.stopPropagation(); if (performance.now() - d.opened < 400) return;   // the tap that opened it
      if (e.target === d || e.target.closest('[data-stay]')) close(); else if (e.target.closest('[data-go]')) go(); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && d.classList.contains('show')) { e.stopPropagation(); close(); } }, true);
  }
  d.dataset.href = href; d.dataset.back = byBack ? '1' : ''; d.opened = performance.now(); d.classList.add('show'); BB.asking = true; d.querySelector('[data-stay]').focus();
}
// the phone's back gesture (or back button): a game page keeps one extra history entry, so going back lands here first.
// It's added on a tap, because browsers skip entries added without one. Landing on it with a game in progress asks the
// same question; with nothing to lose it simply carries on back.
let backArmed = false;
function armBack() {
  const d = document.getElementById('pk-leave');
  if (backArmed || (d && d.classList.contains('show'))) return;
  try { history.pushState({ bbStay: 1 }, ''); backArmed = true; } catch (e) {}
}
['pointerup', 'keydown'].forEach(t => addEventListener(t, armBack, true));
addEventListener('popstate', e => {
  if (e.state && e.state.bbStay) { backArmed = true; return; }   // forward again onto the extra entry
  backArmed = false;
  if (BB.leaveRisk && BB.leaveRisk()) { askLeave('../', true); return; }
  const t = setTimeout(() => { location.href = '../'; }, 500); addEventListener('pagehide', () => clearTimeout(t), { once: true }); history.back();
});
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href="../"]');
  if (a && BB.leaveRisk && BB.leaveRisk()) { e.preventDefault(); askLeave(a.getAttribute('href')); }
}, true);
</script>

<div id="app"><canvas id="c" aria-label="Counting Sheep: tap to hop each sheep over the fence"></canvas></div>
<script>
(() => {
'use strict';
/* ---------- Counting Sheep: a sleepy night, one sheep at a time, tap to hop it over the fence ---------- */
const W = 360;
let H = 680, SC = 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let rnd = Math.random;
const R = (a, b) => a + rnd() * (b - a), pick = a => a[Math.floor(rnd() * a.length)];
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (c, d, t) => [lerp(c[0], d[0], t), lerp(c[1], d[1], t), lerp(c[2], d[2], t)];
const shade = (c, t) => t < 0 ? mix(c, [0, 0, 0], -t) : mix(c, [255, 255, 255], t);

/* ---------- the sheep: every one has a black face, and wears a jumper of one colour and one knitted pattern ---------- */
const COLOURS = [   // base fleece, the pattern's main yarn, and a third yarn
  { n: 'Raspberry', c: '#e0457b', ink: '#fff0f5', alt: '#8e1d4a' },
  { n: 'Tangerine', c: '#f5882c', ink: '#fff3e0', alt: '#9c4310' },
  { n: 'Sunshine', c: '#f4c832', ink: '#7a4a10', alt: '#fff6c8' },
  { n: 'Mint', c: '#5ccc9c', ink: '#175c40', alt: '#e6fff3' },
  { n: 'Sky Blue', c: '#4aa1e6', ink: '#ffffff', alt: '#1b4f8c' },
  { n: 'Lavender', c: '#a47ee0', ink: '#fff6ff', alt: '#53328f' },
  { n: 'Snowy', c: '#f2ece0', ink: '#d0304a', alt: '#2a5aa8' },
];
const PATTERNS = [
  { k: 'stripes', n: 'Stripy', t: 'bold up-and-down stripes' },
  { k: 'zigzag', n: 'Zigzag', t: 'zigzag rows' },
  { k: 'argyle', n: 'Argyle', t: 'diamonds and criss-cross lines' },
  { k: 'spots', n: 'Spotty', t: 'polka dots' },
  { k: 'hearts', n: 'Hearts', t: 'little hearts' },
  { k: 'stars', n: 'Starry', t: 'little stars' },
  { k: 'fairisle', n: 'Fair Isle', t: 'bands of snowflakes' },
  { k: 'tartan', n: 'Tartan', t: 'criss-cross checks' },
  { k: 'quilt', n: 'Patchwork', t: 'quilted squares' },
];
const FACES = [{ k: 'black', n: 'black face' }];

// the woolly body, in a sheep's own space: feet at (0, 0), facing right, about 80 across
const BODY = { x: -3, y: -31, rx: 29, ry: 17 };
// a sheared sheep: a slim smooth body and neck, the wool clipped short
const SKIN = (() => { const p = new Path2D(); p.ellipse(-3, -31, 28, 14.5, 0, 0, Math.PI * 2);
  p.moveTo(14, -42); p.quadraticCurveTo(24, -48, 31, -44); p.lineTo(33, -32); p.quadraticCurveTo(24, -26, 16, -22); p.closePath(); return p; })();
const FLEECE = SKIN;
// a knitted pattern over the body's box, in the fleece's colours
function heart(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * .9); g.bezierCurveTo(x - s * 1.4, y - s * .1, x - s * .6, y - s * 1.1, x, y - s * .35); g.bezierCurveTo(x + s * .6, y - s * 1.1, x + s * 1.4, y - s * .1, x, y + s * .9); g.fill(); }
function starShape(g, x, y, s) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * .45 : s; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); g.fill(); }
function flake(g, x, y, s) { g.lineCap = 'round'; for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; g.beginPath(); g.moveTo(x - Math.cos(a) * s, y - Math.sin(a) * s); g.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s); g.stroke(); } }
function paintPattern(g, ty) {
  const c = hex(ty.col.c), ink = ty.col.ink, alt = ty.col.alt, x0 = BODY.x - BODY.rx - 8, x1 = BODY.x + BODY.rx + 8, y0 = BODY.y - BODY.ry - 8, y1 = BODY.y + BODY.ry + 8, W = x1 - x0, H = y1 - y0;
  g.fillStyle = ty.col.c; g.fillRect(x0, y0, W, H);
  switch (ty.pat.k) {
    case 'stripes': for (let x = x0, i = 0; x < x1; x += 9, i++) { g.fillStyle = i % 2 ? alt : ink; g.fillRect(x, y0, 4.6, H); g.fillStyle = i % 2 ? ink : alt; g.fillRect(x + 6.6, y0, 1, H); } break;   // bold up-and-down stripes in two colours, with a pinstripe between
    case 'zigzag': g.lineWidth = 2.6; g.lineJoin = 'miter'; for (let y = y0 + 4, i = 0; y < y1 + 6; y += 8.5, i++) { g.strokeStyle = i % 2 ? alt : ink; g.beginPath(); for (let x = x0, k = 0; x <= x1 + 6; x += 5, k++) g.lineTo(x, y + (k % 2 ? 3.4 : -3.4)); g.stroke(); } break;
    case 'argyle': { const dw = 11, dh = 14;
      for (let j = 0; j * dh / 2 < H + dh; j++) for (let i = 0; i * dw < W + dw; i++) { const cx = x0 + i * dw + (j % 2 ? dw / 2 : 0), cy = y0 + j * dh / 2; g.fillStyle = (i + j) % 2 ? alt : rgba(shade(c, .2)); g.beginPath(); g.moveTo(cx, cy - dh / 2); g.lineTo(cx + dw / 2, cy); g.lineTo(cx, cy + dh / 2); g.lineTo(cx - dw / 2, cy); g.closePath(); g.fill(); }
      g.strokeStyle = ink; g.lineWidth = .9; g.setLineDash([1.6, 1.6]); for (let k = -10; k < 20; k++) { g.beginPath(); g.moveTo(x0 + k * dw, y0); g.lineTo(x0 + k * dw + H * dw / dh, y1); g.stroke(); g.beginPath(); g.moveTo(x0 + k * dw, y1); g.lineTo(x0 + k * dw + H * dw / dh, y0); g.stroke(); } g.setLineDash([]); break; }
    case 'spots': for (let y = y0 + 3, j = 0; y < y1 + 4; y += 7.5, j++) for (let x = x0 + (j % 2 ? 4 : 0); x < x1 + 4; x += 8) { g.fillStyle = (j + Math.round(x / 8)) % 3 ? ink : alt; g.beginPath(); g.arc(x, y, 2.3, 0, 6.3); g.fill(); } break;
    case 'hearts': for (let y = y0 + 4, j = 0; y < y1 + 5; y += 9, j++) for (let x = x0 + (j % 2 ? 5 : 0); x < x1 + 5; x += 10) { g.fillStyle = j % 2 ? alt : ink; heart(g, x, y, 3.2); } break;
    case 'stars': for (let y = y0 + 4, j = 0; y < y1 + 5; y += 9.5, j++) for (let x = x0 + (j % 2 ? 5.5 : 0); x < x1 + 5; x += 11) { g.fillStyle = j % 2 ? alt : ink; starShape(g, x, y, 3.8); } break;
    case 'fairisle': for (let y = y0 + 2, j = 0; y < y1; y += 13, j++) {   // a band of snowflakes between thin rows of dots
      g.fillStyle = alt; g.fillRect(x0, y, W, 2); g.fillRect(x0, y + 10, W, 2);
      g.strokeStyle = ink; g.lineWidth = 1.2; for (let x = x0 + (j % 2 ? 4 : 0); x < x1 + 6; x += 9) flake(g, x, y + 6, 3.1);
      g.fillStyle = ink; for (let x = x0 + 2; x < x1; x += 4) { g.fillRect(x, y + .4, 1.2, 1.2); g.fillRect(x + 2, y + 10.4, 1.2, 1.2); } } break;
    case 'tartan': { const a = hex(alt), k = hex(ink);
      for (const [p, w, col, al] of [[0, 9, a, .55], [16, 4, a, .45], [6, 1.4, k, .8], [22, 1.4, k, .7]]) { g.fillStyle = rgba(col, al); for (let x = x0 + p; x < x1; x += 26) g.fillRect(x, y0, w, H); for (let y = y0 + p; y < y1; y += 26) g.fillRect(x0, y, W, w); } break; }
    case 'quilt': { const s = 10, tones = [shade(c, .25), shade(c, -.12), hex(alt), hex(ty.col.c), shade(hex(ink), -.05)];
      for (let j = 0; j * s < H; j++) for (let i = 0; i * s < W; i++) { g.fillStyle = rgba(tones[(i * 3 + j * 2 + (i * j) % 3) % tones.length]); g.fillRect(x0 + i * s, y0 + j * s, s, s);
        if ((i + j) % 3 === 0) { g.fillStyle = rgba(hex(ink), .9); heart(g, x0 + i * s + s / 2, y0 + j * s + s / 2, 2); } }
      g.strokeStyle = rgba(shade(c, -.45), .7); g.lineWidth = .7; g.setLineDash([1.4, 1.2]); for (let i = 0; i * s < W; i++) { g.beginPath(); g.moveTo(x0 + i * s, y0); g.lineTo(x0 + i * s, y1); g.stroke(); } for (let j = 0; j * s < H; j++) { g.beginPath(); g.moveTo(x0, y0 + j * s); g.lineTo(x1, y0 + j * s); g.stroke(); } g.setLineDash([]); break; }
  }
}
// the jumper: a knitted tube over the middle of the body, with the woolly fleece puffing out behind and below
const JUMPER = (() => { const p = new Path2D();   // from the hem over the hips to the collar at the neck
  p.moveTo(-19, -52); p.lineTo(17, -52); p.quadraticCurveTo(21, -42, 21, -31); p.quadraticCurveTo(21, -20, 17, -12);
  p.lineTo(-19, -12); p.quadraticCurveTo(-23, -22, -23, -32); p.quadraticCurveTo(-23, -42, -19, -52); p.closePath(); return p; })();
const JUMPER_TOP = (() => { const p = new Path2D(); p.ellipse(-1, -31.5, 27, 17.5, 0, 0, Math.PI * 2); return p; })();   // a little roomier than the sheep
const WOOL = '#efe4d4';   // short sheared wool
// little curls of wool over a woolly area
function curls(g, x0, y0, x1, y1, col) { g.strokeStyle = col; g.lineWidth = .8; for (let y = y0, j = 0; y < y1; y += 4.2, j++) for (let x = x0 + (j % 2) * 2.4; x < x1; x += 4.8) { g.beginPath(); g.arc(x, y, 1.6, .4, 4.2); g.stroke(); } }
// one sheep, facing right, feet at the origin
// pose: ph = the trot's phase, tuck = legs drawn up for a jump (0..1), lid = sleepy eyelids (0..1)
function drawSheep(g, ty, pose = {}) {
  const ph = pose.ph || 0, tuck = pose.tuck || 0, lid = pose.lid || 0;
  const c = hex(ty.col.c), black = ty.face.k === 'black', faceC = black ? '#2e2528' : '#f7eddd', faceHi = black ? '#4d4045' : '#fffaf2', legC = black ? '#2e2528' : '#6a5a52';

function moon() {   // it crosses the sky as the count grows, so a long night shows

  const gl = ctx.createRadialGradient(mx, my, 10, mx, my, 90); gl.addColorStop(0, 'rgba(255,246,210,.28)'); gl.addColorStop(1, 'rgba(255,246,210,0)'); ctx.fillStyle = gl; ctx.fillRect(mx - 90, my - 90, 180, 180);
  ctx.fillStyle = '#fbf2d2'; ctx.beginPath(); ctx.arc(mx, my, 22, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(200,185,150,.35)'; for (const [dx, dy, r] of [[-7, -5, 4.5], [6, 4, 3.4], [-2, 9, 2.6], [9, -8, 2]]) { ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, 6.3); ctx.fill(); }
}
function cloud(x, y, s) { ctx.fillStyle = 'rgba(120,120,170,.22)'; for (let j = 0; j < 5; j++) { ctx.beginPath(); ctx.ellipse(x + (j - 2) * 20 * s, y + (j % 2 ? -6 : 2) * s, 24 * s, 11 * s, 0, 0, 6.3); ctx.fill(); } }
// a wooden fence running back across the field; the sheep's path crosses it by the nearest post
function fencePosts() {
  const G = GROUND(), out = [];
  for (const t of [0, .38, .7, 1]) { const k = 1 - t * .55; out.push({ x: lerp(FX - 6, FX + 70, t), y: lerp(G + 16, G - 46, t), h: (FENCE_H + 8) * k, w: 6.4 * k }); }
  return out;
}
function rails(a, b) {
  ctx.lineCap = 'round';
  for (const f of [.3, .64, .95]) { const w = 4.6 * (a.w / 6.4);
    ctx.strokeStyle = '#7d6043'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.x, a.y - a.h * f); ctx.lineTo(b.x, b.y - b.h * f); ctx.stroke();
    ctx.strokeStyle = 'rgba(225,215,255,.3)'; ctx.lineWidth = w * .35; ctx.beginPath(); ctx.moveTo(a.x, a.y - a.h * f - w * .3); ctx.lineTo(b.x, b.y - b.h * f - w * .3); ctx.stroke(); }
}
function post(p) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.x + 3, p.y, p.w * 1.4, p.w * .45, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#6a5038'; ctx.beginPath(); ctx.roundRect(p.x - p.w / 2, p.y - p.h - 4, p.w, p.h + 4, [p.w * .45, p.w * .45, 1, 1]); ctx.fill();
  ctx.fillStyle = 'rgba(225,215,255,.3)'; ctx.fillRect(p.x - p.w / 2, p.y - p.h - 2, p.w * .32, p.h + 2);
}
function fenceBack() { const P = fencePosts(); for (let i = P.length - 1; i > 0; i--) { post(P[i]); rails(P[i - 1], P[i]); } }
function fenceFront() { post(fencePosts()[0]); }
function drawSheepAt(s) {
  const G = GROUND(), y = G - s.lift;
  // its shadow stays on the grass, smaller the higher it goes
  const sh = 1 - s.lift / (JUMP_H * 1.6); ctx.fillStyle = `rgba(0,0,0,${.28 * sh})`; ctx.beginPath(); ctx.ellipse(s.x - 2 * s.dir, G, 30 * SS * sh, 5 * SS * sh, 0, 0, 6.3); ctx.fill();
  const bob = s.st === 'walk' || s.st === 'off' ? Math.abs(Math.sin(s.ph)) * 1.4 : 0;
  const tilt = s.st === 'jump' ? (s.t / JUMP_T - .5) * .5 : s.st === 'bump' ? -Math.sin(Math.min(1, s.t / .5) * Math.PI) * .18 : s.st === 'pause' ? .12 : 0;
  const tuck = s.st === 'jump' ? Math.min(1, s.t / JUMP_T * 5, (1 - s.t / JUMP_T) * 5) : 0;
  ctx.save(); ctx.translate(s.x, y - bob); ctx.scale(SS * s.dir, SS); ctx.rotate(tilt);
  drawSheep(ctx, s.ty, { ph: s.st === 'pause' ? 0 : s.ph, tuck, lid: s.st === 'bump' ? 0 : s.st === 'jump' ? s.lid * .4 : s.lid });
  ctx.restore();
  if (s.st === 'bump') {   // a few slow little stars round its head
    const hx = s.x + 26 * SS, hy = y - 62 * SS; ctx.fillStyle = '#ffe9a8';
    for (let i = 0; i < 3; i++) { const a = time * 3 + i * 2.1; ctx.save(); ctx.translate(hx + Math.cos(a) * 13, hy + Math.sin(a) * 4); starShape(ctx, 0, 0, 3.4); ctx.restore(); }
  }
}
function draw() {
  const G = GROUND();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(skyPic, 0, 0);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  moon();
  for (const [x0, yk, s, v] of clouds) cloud(((x0 + time * v) % (W + 160)) - 80, G * yk + 20, s);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(landPic, 0, 0); ctx.setTransform(SC, 0, 0, SC, 0, 0);
  fenceBack();
  if (sheep) drawSheepAt(sheep);
  fenceFront();
  // fireflies drifting over the meadow, glowing up and down slowly
  for (let i = 0; i < 7; i++) { const x = (i * 61 + Math.sin(time * .13 + i) * 40 + W) % W, y = G - 30 + Math.sin(time * .21 + i * 1.7) * 26 + i * 6, a = .25 + .3 * (.5 + .5 * Math.sin(time * .5 + i * 2.3));
    const gl = ctx.createRadialGradient(x, y, 0, x, y, 9); gl.addColorStop(0, `rgba(230,255,150,${a})`); gl.addColorStop(1, 'rgba(230,255,150,0)'); ctx.fillStyle = gl; ctx.fillRect(x - 9, y - 9, 18, 18); }
  // counted: a little number drifts up from the fence
  for (const p of pops) { ctx.globalAlpha = clamp(1.4 - p.t / 1.5, 0, 1); txt(String(p.n), p.x, p.y - p.t * 22, 22, '#fff6d8', 'rgba(20,20,50,.5)'); } ctx.globalAlpha = 1;
  // drowsy: the edges dim a little with each bump
  if (drowsy && state !== 'title') { const v = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75); v.addColorStop(0, 'rgba(5,6,20,0)'); v.addColorStop(1, `rgba(5,6,20,${.22 * Math.min(drowsy, DROWSY_MAX)})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }
  hud();
  if (state === 'title') titleCard();
  if (state === 'over') overCard();
}
function hud() {
  if (cardMode) return;
  PK.homeSign(ctx, 10, 10);
  PK.sign(ctx, 56, 10, 38, 38, (g, cx, cy) => {   // sound on or off
    g.beginPath(); g.moveTo(cx - 8, cy - 3); g.lineTo(cx - 4, cy - 3); g.lineTo(cx + 1, cy - 8); g.lineTo(cx + 1, cy + 8); g.lineTo(cx - 4, cy + 3); g.lineTo(cx - 8, cy + 3); g.closePath(); g.fill();
    if (muted) { g.beginPath(); g.moveTo(cx + 4, cy - 4); g.lineTo(cx + 10, cy + 4); g.moveTo(cx + 10, cy - 4); g.lineTo(cx + 4, cy + 4); g.stroke(); }
    else { g.beginPath(); g.arc(cx + 2, cy, 5, -.8, .8); g.stroke(); g.beginPath(); g.arc(cx + 2, cy, 9, -.8, .8); g.stroke(); } });
  if (state === 'title') return;
  // the count, in the corner
  txt(String(count), W - 16, 34, 40, '#fff6d8', 'rgba(10,12,35,.6)', 'right');
  txt('sheep', W - 18, 62, 12, 'rgba(255,246,216,.8)', null, 'right', 700);
  // three little z's fill in as you get drowsy
  for (let i = 0; i < DROWSY_MAX; i++) txt('z', W - 20 - (DROWSY_MAX - 1 - i) * 13, 82 - i * 3, 13 + i * 2, i < drowsy ? '#c9b8ff' : 'rgba(255,255,255,.18)', null, 'right', 900);
}
function titleCard() {
  ctx.fillStyle = 'rgba(8,10,30,.35)'; ctx.fillRect(0, 0, W, H);
  const y = H * .2;
  PK.presents(ctx, W / 2, y - 44, PKIMG, { size: 10, color: '#d8d2ff' });
  txt('Counting', W / 2, y, 46, '#fff1c8', '#2a2550'); txt('Sheep', W / 2, y + 48, 46, '#fff1c8', '#2a2550');
  const lines = ['Tap to help each sheep hop the fence', 'Too soon or too late and they bump it', 'Three bumps and you nod off'];
  lines.forEach((l, i) => txt(l, W / 2, H * .43 + i * 24, i ? 13 : 15, '#fff', 'rgba(10,12,35,.55)', 'center', i ? 700 : 800));
  if (best || total) txt(`Best ${best} · ${total} sheep counted in all`, W / 2, H * .43 + 82, 13, '#ffe2a8', 'rgba(10,12,35,.55)', 'center', 700);
  const carry = run && run.count > 0 && run.drowsy < DROWSY_MAX;
  PK.plank(ctx, W / 2, H * .88, 220, 48, carry ? `Carry on from ${run.count}` : 'Start counting', { size: 18 });
  if (carry) txt('or tap anywhere else to start a new night', W / 2, H * .88 + 38, 11, 'rgba(255,255,255,.75)', null, 'center', 700);
}
function overCard() {
  if (overT < .6) return;
  const a = clamp((overT - .6) / .8, 0, 1); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,10,30,.4)'; ctx.fillRect(0, 0, W, H);
  const y = H * .26; PK.board(ctx, W / 2 - 140, y - 46, 280, 268);
  txt('Zzz…', W / 2, y - 8, 34, '#7a68c8', 'rgba(0,0,0,0)');
  txt(`You counted ${count} sheep`, W / 2, y + 34, 20, PK.INK, null);
  txt(count >= best && count > 0 ? 'A new best!' : 'Best ' + best, W / 2, y + 62, 15, count >= best && count > 0 ? PK.CLAY_TEXT : PK.INK_2, null, 'center', 800);
  PK.says(ctx, W / 2 - 120, y + 88, 240, PKIMG[1], 'Bean', overLine);
  if (overT > 1.4) PK.plank(ctx, W / 2, y + 186, 200, 46, 'Count again', { size: 17 });
  ctx.globalAlpha = 1;
}

/* ---------- input: a tap anywhere hops the sheep ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (y < 54 && x < 52) { BB.home(); return; }
  if (y < 54 && x >= 52 && x < 100) { muted = !muted; BB.muted = muted; persist(); return; }
  if (state === 'title') { const carry = run && run.count > 0 && run.drowsy < DROWSY_MAX && Math.abs(x - W / 2) < 110 && Math.abs(y - H * .88) < 26; startNight(carry); return; }
  if (state === 'over') { if (overT > 1.4) startNight(false); return; }
  hop();
});
addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter' && e.key !== 'ArrowUp') return; e.preventDefault(); audio();
  if (state === 'title') startNight(!!(run && run.count > 0 && run.drowsy < DROWSY_MAX)); else if (state === 'over') { if (overT > 1.4) startNight(false); } else hop();
});

let last = performance.now();
function frame(now) { const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now; if (!document.hidden && !frozen) update(dt); draw(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); if (!document.hidden) paintScenery(); });   // a phone may throw away the painted night in the background
addEventListener('resize', resize); resize();
if (/[?&]debug\b/.test(location.search)) window.__cs = {
  get state() { return state; }, get sheep() { return sheep; }, get count() { return count; }, get drowsy() { return drowsy; }, FX, FRONT, BACK, JUMP_T, hop, startNight,
  pose(p, ty) {   // hold a sheep partway through its hop, for pictures
    startNight(false); newSheep(); if (ty) sheep.ty = ty; sheep.st = 'jump'; sheep.t = JUMP_T * p; sheep.x = FX - JUMP_V * JUMP_T * (.5 - p) - 4; sheep.lift = 4 * JUMP_H * p * (1 - p); frozen = true; },
  card(p = .5) { cardMode = true; resize(); this.pose(p); },
  get frozen() { return frozen; }, set frozen(v) { frozen = v; }, COLOURS, PATTERNS,
};
requestAnimationFrame(frame);
})();
</script>
