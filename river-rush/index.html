<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fcff0">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bear &amp; Bean">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));</script>
<title>River Rush</title>
<meta name="description" content="Bear&#x27;s log has got away! Swipe to steer round rocks, hop logs, duck branches and grab jelly beans. Free to play, works offline, no ads or tracking. From The Bear &amp; Bean Games.">
<link rel="canonical" href="https://crunchy000.github.io/Games/river-rush/">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#1f5a3a; }
  #app { position:relative; height:100vh; height:100dvh; width:100vw; display:flex; align-items:center; justify-content:center; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="River Rush: steer Bear's log down the river"></canvas></div>
<script>
(() => {
'use strict';
const W = 360, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let H = 680, SC = 1, HY = 230, F = 400;
const CAMH = 1.7, PZ = 3.5, LANE = 1.15, RIVER = 2.35, FAR = 46;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const IMG = { bear: new Image(), bean: new Image() }; IMG.bear.src = '../icons/bear.png'; IMG.bean.src = '../icons/bean.png';
let best = 0; try { best = +localStorage.getItem('riverrush-best') || 0; } catch (e) {}

function resize() {
  H = Math.round(clamp(W * innerHeight / innerWidth, 600, 780)); HY = Math.round(H * .34); F = (H - HY) * 2.0 / CAMH;
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = cv.width / W; skyCache = null;
}
const proj = (x, y, z) => { const s = F / z; return { x: W / 2 + x * s, y: HY + (CAMH - y) * s, s }; };

/* ---------- sound ---------- */
let ac = null, muted = false;
function beep(f, d, type = 'sine', vol = .05, slide = 0, delay = 0) {
  if (muted) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
function splashSound() { if (muted || !ac) return; try { const n = ac.sampleRate * .5, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'lowpass'; f.frequency.value = 1400; g.gain.value = .25; s.buffer = b; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(); } catch (e) {} }
const sBean = () => beep(1100 + Math.random() * 200, .07, 'triangle', .035, 300);
const sHoney = () => [660, 880, 1100].forEach((f, i) => beep(f, .1, 'triangle', .045, 0, i * .05));
const sLane = () => beep(380, .06, 'sine', .03, 120);
const sJump = () => beep(300, .2, 'triangle', .045, 380);
const sDuck = () => beep(260, .12, 'sine', .04, -120);
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- state ---------- */
let state = 'title', time = 0, stateT = 0, dist = 0, beans = 0, honey = 0, speed = 9, lives = 3, objs = [], banks = [], parts = [], toasts = [], rowZ = 0, scroll = 0, shake = 0;
let P = null;
function reset() {
  dist = 0; beans = 0; honey = 0; speed = 9; lives = 3; objs = []; parts = []; toasts = []; rowZ = 18; scroll = 0;
  P = { lane: 0, x: 0, jy: 0, vy: 0, duck: 0, hurt: 0, safe: 0, tilt: 0 };
  banks = []; for (let z = 2; z < FAR; z += 2.6) addBank(z);
}
function addBank(z) { for (const side of [-1, 1]) banks.push({ side, z: z + rnd(-.6, .6), x: side * (RIVER + rnd(.5, 2.4)), kind: Math.random() < .7 ? 'tree' : Math.random() < .5 ? 'bush' : 'reed', h: rnd(2.2, 3.6), tone: Math.random() }); }
const score = () => Math.floor(dist) + beans * 10 + honey * 50;

/* ---------- spawning: rows of obstacles with a guaranteed way through ---------- */
function spawnRow(z) {
  const m = dist, kinds = ['rock']; if (m > 120) kinds.push('log'); if (m > 260) kinds.push('branch');
  const lanes = [-1, 0, 1].sort(() => Math.random() - .5), nObs = m > 500 && Math.random() < .45 ? 2 : 1;
  const open = lanes[nObs];   // this lane stays clear of rocks
  for (let i = 0; i < nObs; i++) { const k = pick(kinds); objs.push({ type: k, lane: lanes[i], z, wob: rnd(0, 6) }); }
  // a full-width log you must hop, now and then
  if (m > 200 && Math.random() < .14) { objs.length -= nObs; for (const l of [-1, 0, 1]) objs.push({ type: 'log', lane: l, z, wob: rnd(0, 6), wide: true }); }
  // treats along the clear lane
  if (Math.random() < .75) { const n = 4 + Math.floor(Math.random() * 3); for (let i = 1; i <= n; i++) objs.push({ type: Math.random() < .06 ? 'honey' : 'bean', lane: open, z: z + i * 1.2, y: 0, c: pick(['#ff5fa2', '#ffd23a', '#7ce36b', '#5fb8ff', '#b07cff', '#ff8a3c']) }); }
}

/* ---------- input ---------- */
let touch = null;
function local(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function act(a) {
  if (state !== 'play' || P.hurt > 0) return;
  if (a === 'left' && P.lane > -1) { P.lane--; sLane(); }
  if (a === 'right' && P.lane < 1) { P.lane++; sLane(); }
  if (a === 'up' && P.jy <= .01) { P.vy = 5.6; P.duck = 0; sJump(); }
  if (a === 'down') { if (P.jy > .05) P.vy = -9; P.duck = .9; sDuck(); }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = local(e);
  if (p.x < 48 && p.y < 54) { location.href = '../'; return; }
  if (p.x > W - 48 && p.y < 54) { muted = !muted; beep(660, .08, 'triangle', .05); return; }
  if (state === 'title' || (state === 'over' && stateT > 1)) { reset(); state = 'play'; stateT = 0; beep(440, .15, 'triangle', .06, 300); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  touch = { ...p, t: performance.now(), used: false };
});
cv.addEventListener('pointermove', e => {
  if (!touch || touch.used) return; const p = local(e), dx = p.x - touch.x, dy = p.y - touch.y;
  if (Math.hypot(dx, dy) < 22) return; touch.used = true;
  act(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
});
cv.addEventListener('pointerup', e => {
  if (!touch) return; const t = touch; touch = null; if (t.used || performance.now() - t.t > 350) return;
  act(t.x < W * .33 ? 'left' : t.x > W * .67 ? 'right' : 'up');   // taps work too: sides steer, middle hops
});
cv.addEventListener('pointercancel', () => { touch = null; });
const KM = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ' ': 'up', ArrowDown: 'down', s: 'down' };
addEventListener('keydown', e => {
  const k = KM[e.key]; if (!k && e.key !== 'Enter') return; e.preventDefault();
  if (state === 'title' || (state === 'over' && stateT > 1)) { reset(); state = 'play'; stateT = 0; return; }
  if (k) act(k);
});

/* ---------- update ---------- */
function toast(t, c = '#fff', size = 18) { toasts.push({ t, c, size, life: 1.2, y: H * .42 }); }
function splashAt(x, y, n = 18, c = '#e9f8ff') { for (let i = 0; i < n; i++) { const a = rnd(Math.PI * 1.05, Math.PI * 1.95); parts.push({ x, y, vx: Math.cos(a) * rnd(40, 160), vy: Math.sin(a) * rnd(120, 300), g: 700, life: rnd(.4, .8), max: .8, s: rnd(2, 4), c }); } }
function hit(o) {
  if (P.safe > 0) return;
  lives--; P.hurt = .9; P.safe = 2.2; shake = 9; splashSound(); beep(200, .4, 'sine', .07, -120); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  const q = proj(P.x, 0, PZ); splashAt(q.x, q.y, 28);
  toast(lives > 0 ? pick(['Splash!', 'Oops-a-daisy!', 'Wobbly!']) : 'Soggy bottoms!', '#fff', 26);
  o.hitDone = true;
  if (lives <= 0) { state = 'over'; stateT = 0; const sc = score(); if (sc > best) { best = sc; try { localStorage.setItem('riverrush-best', best); } catch (e) {} } [392, 330, 262].forEach((f, i) => beep(f, .25, 'sine', .06, 0, i * .14)); }
}
function update(dt) {
  time += dt; stateT += dt; shake *= Math.pow(.02, dt);
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; } parts = parts.filter(q => q.life > 0);
  for (const t of toasts) { t.life -= dt; t.y -= 24 * dt; } toasts = toasts.filter(t => t.life > 0);
  const sp = state === 'play' ? speed : state === 'title' ? 6 : speed * Math.max(0, 1 - stateT);
  scroll += sp * dt;
  for (const b of banks) b.z -= sp * dt;
  banks = banks.filter(b => b.z > .6); while (banks.length < 2 * Math.ceil(FAR / 2.6)) { const zmax = Math.max(...banks.map(b => b.z), 2); addBank(zmax + 2.6); }
  if (state !== 'play') { if (P) for (const o of objs) o.z -= sp * dt; return; }
  speed = Math.min(18, 9 + dist / 110); dist += speed * dt * .9;
  // player
  P.x += (P.lane * LANE - P.x) * Math.min(1, dt * 14); P.tilt = (P.lane * LANE - P.x) * .25;
  P.vy -= 17 * dt; P.jy = Math.max(0, P.jy + P.vy * dt); if (P.jy === 0 && P.vy < 0) { if (P.vy < -3) { const q = proj(P.x, 0, PZ); splashAt(q.x, q.y, 8); } P.vy = 0; }
  P.duck = Math.max(0, P.duck - dt); P.hurt = Math.max(0, P.hurt - dt); P.safe = Math.max(0, P.safe - dt);
  // world
  for (const o of objs) o.z -= speed * dt;
  rowZ -= speed * dt; while (rowZ < FAR) { spawnRow(rowZ = Math.max(rowZ, FAR - 2) + Math.max(8.5, 13 - dist / 140)); }
  for (const o of objs) {
    if (o.done || o.hitDone || Math.abs(o.z - PZ) > .45) continue;
    if (Math.abs(o.lane * LANE - P.x) > .62) continue;
    if (o.type === 'bean') { o.done = true; beans++; sBean(); const q = proj(P.x, .8, PZ); for (let i = 0; i < 5; i++) parts.push({ x: q.x, y: q.y - 20, vx: rnd(-60, 60), vy: rnd(-140, -40), g: 300, life: .5, max: .5, s: 2.5, c: o.c }); }
    else if (o.type === 'honey') { o.done = true; honey++; sHoney(); toast('Honey! +50', '#ffe08a', 18); }
    else if (o.type === 'rock') hit(o);
    else if (o.type === 'log') { if (P.jy < .28) hit(o); else if (!o.cleared) { o.cleared = true; toast('Hop!', '#fff', 16); } }
    else if (o.type === 'branch') { if (P.duck <= 0) hit(o); else if (!o.cleared) { o.cleared = true; toast('Duck!', '#fff', 16); } }
  }
  objs = objs.filter(o => o.z > .8 && !o.done);
}

/* ---------- drawing ---------- */
function ell(x, y, rx, ry, c, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, 6.2832); ctx.fillStyle = c; ctx.fill(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(t, x, y, size, col, align = 'center', stroke = 'rgba(10,40,30,.85)', w = 900) {
  ctx.font = `${w} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 4); ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
let skyCache = null;
function sky() {
  if (skyCache) return skyCache;
  const c = document.createElement('canvas'); c.width = Math.ceil(W * SC); c.height = Math.ceil((HY + 40) * SC); const g = c.getContext('2d'); g.setTransform(SC, 0, 0, SC, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, HY); gr.addColorStop(0, '#6cc4f0'); gr.addColorStop(1, '#d9f2ff'); g.fillStyle = gr; g.fillRect(0, 0, W, HY + 40);
  g.fillStyle = 'rgba(255,255,255,.85)'; for (const [x, y, s] of [[60, 60, 1], [270, 40, 1.2], [190, 100, .7]]) for (const [dx, dy, r] of [[0, 0, 14], [14, -5, 18], [30, 0, 13], [15, 5, 14]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 6.3); g.fill(); }
  // mountains and far forest
  g.fillStyle = '#9cc7d9'; g.beginPath(); g.moveTo(0, HY); [[0, HY - 40], [50, HY - 90], [100, HY - 50], [150, HY - 110], [210, HY - 60], [260, HY - 100], [320, HY - 55], [360, HY - 80], [360, HY]].forEach(([x, y]) => g.lineTo(x, y)); g.fill();
  g.fillStyle = '#eef8ff'; for (const [x, y] of [[150, HY - 110], [260, HY - 100], [50, HY - 90]]) { g.beginPath(); g.moveTo(x - 14, y + 16); g.lineTo(x, y); g.lineTo(x + 14, y + 16); g.lineTo(x + 5, y + 12); g.lineTo(x, y + 17); g.lineTo(x - 6, y + 12); g.fill(); }
  g.fillStyle = '#5f9e6a'; for (let x = -10; x < W + 10; x += 12) { const h = 14 + (x * 37 % 13); g.beginPath(); g.moveTo(x, HY + 2); g.lineTo(x + 6, HY - h); g.lineTo(x + 12, HY + 2); g.fill(); }
  skyCache = c; return c;
}
function drawWater() {
  // grass banks
  const gr = ctx.createLinearGradient(0, HY, 0, H); gr.addColorStop(0, '#6fb05a'); gr.addColorStop(1, '#3f8a3a'); ctx.fillStyle = gr; ctx.fillRect(0, HY, W, H - HY);
  // the river, banded so speed reads clearly
  const n = 26;
  for (let i = n; i >= 1; i--) {
    const z1 = 1 + Math.pow(i / n, 1.7) * FAR, z0 = 1 + Math.pow((i - 1) / n, 1.7) * FAR;
    const a = proj(-RIVER, 0, z1), b = proj(RIVER, 0, z1), c = proj(RIVER, 0, z0), d = proj(-RIVER, 0, z0);
    const band = Math.floor((z0 + scroll) / 1.6) % 2;
    ctx.fillStyle = band ? '#3fa3d6' : '#4bb2e2'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x + 1, c.y + 1); ctx.lineTo(d.x - 1, d.y + 1); ctx.fill();
  }
  // foam streaks and the sandy edges
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineCap = 'round';
  for (let k = 0; k < 18; k++) {
    const lx = ((k * 0.73) % 1) * RIVER * 2 - RIVER, z = ((k * 3.1 - scroll) % (FAR - 4) + (FAR - 4)) % (FAR - 4) + 4.5, p = proj(lx, 0, z), q = proj(lx, 0, z + .7);
    ctx.lineWidth = Math.max(.6, p.s * .025); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  for (const side of [-1, 1]) {
    const a = proj(side * RIVER, 0, FAR), b = proj(side * RIVER, 0, 1), c = proj(side * (RIVER + .35), 0, 1), d = proj(side * (RIVER + .35), 0, FAR);
    ctx.fillStyle = '#d8c48c'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
  }
}
function drawBank(b) {
  const p = proj(b.x, 0, b.z), s = p.s;
  if (p.y < HY - 2 || s < 2) return;
  ctx.globalAlpha = clamp((FAR - b.z) / 6, 0, 1);
  if (b.kind === 'tree') {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(p.x - .09 * s, p.y - b.h * .45 * s, .18 * s, b.h * .45 * s);
    const c1 = b.tone < .5 ? '#2f7a3a' : '#3f8f45', c2 = b.tone < .5 ? '#3f9a4a' : '#56ad55';
    ell(p.x, p.y - b.h * .65 * s, .7 * s, .55 * s, c1); ell(p.x - .3 * s, p.y - b.h * .55 * s, .5 * s, .4 * s, c2); ell(p.x + .3 * s, p.y - b.h * .78 * s, .45 * s, .38 * s, c2);
  } else if (b.kind === 'bush') { ell(p.x, p.y - .3 * s, .6 * s, .35 * s, '#3f8f45'); ell(p.x + .2 * s, p.y - .45 * s, .35 * s, .25 * s, '#56ad55'); if (b.tone > .6) ell(p.x - .1 * s, p.y - .45 * s, .06 * s, .06 * s, '#ff6b8a'); }
  else { ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = Math.max(1, .04 * s); for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(p.x + i * .08 * s, p.y); ctx.quadraticCurveTo(p.x + i * .1 * s, p.y - .5 * s, p.x + i * .16 * s, p.y - .8 * s); ctx.stroke(); } ell(p.x + .05 * s, p.y - .75 * s, .04 * s, .12 * s, '#8a5a2b'); }
  ctx.globalAlpha = 1;
}
function drawObj(o) {
  const x = o.lane * LANE, p = proj(x, 0, o.z), s = p.s; if (s < 3) return;
  ctx.globalAlpha = clamp((FAR - o.z) / 5, 0, 1);
  if (o.type === 'rock') {
    ell(p.x, p.y, .5 * s, .1 * s, 'rgba(255,255,255,.6)');
    ctx.fillStyle = '#8a8f96'; ctx.beginPath(); ctx.moveTo(p.x - .45 * s, p.y); ctx.quadraticCurveTo(p.x - .5 * s, p.y - .55 * s, p.x - .1 * s, p.y - .7 * s); ctx.quadraticCurveTo(p.x + .4 * s, p.y - .75 * s, p.x + .45 * s, p.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a9aeb5'; ctx.beginPath(); ctx.ellipse(p.x - .12 * s, p.y - .45 * s, .18 * s, .12 * s, -.4, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#6a9f4a'; ctx.beginPath(); ctx.ellipse(p.x + .1 * s, p.y - .66 * s, .16 * s, .05 * s, 0, 0, 6.3); ctx.fill();
  } else if (o.type === 'log') {
    const w = o.wide ? LANE * .5 : .55, bob = Math.sin(time * 3 + o.wob) * .03;
    const a = proj(x - w, .12 + bob, o.z), b = proj(x + w, .12 + bob, o.z), r = .14 * s;
    ell(p.x, p.y, (b.x - a.x) / 2 + r, .07 * s, 'rgba(255,255,255,.5)');
    ctx.fillStyle = '#8a5a2b'; rr(a.x, a.y - r, b.x - a.x, r * 2, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(a.x + r * .5, a.y - r * .7, b.x - a.x - r, r * .4);
    ell(b.x, b.y, r * .6, r, '#d9a35f'); ctx.strokeStyle = '#a8763a'; ctx.lineWidth = Math.max(.5, s * .01); ctx.beginPath(); ctx.ellipse(b.x, b.y, r * .3, r * .5, 0, 0, 6.3); ctx.stroke();
  } else if (o.type === 'branch') {
    const y = 1.05, a = proj(x - .9, y, o.z), b = proj(x + .9, y, o.z), sideX = o.lane <= 0 ? -RIVER - .3 : RIVER + .3, bank = proj(sideX, 0, o.z), bt = proj(sideX, y + .5, o.z);
    ctx.strokeStyle = '#6b4423'; ctx.lineCap = 'round'; ctx.lineWidth = .07 * s;
    ctx.beginPath(); ctx.moveTo(bank.x, bank.y); ctx.lineTo(bt.x, bt.y); ctx.stroke();
    ctx.lineWidth = .06 * s; ctx.beginPath(); ctx.moveTo(bt.x, bt.y); ctx.lineTo(o.lane <= 0 ? b.x : a.x, b.y); ctx.lineTo(o.lane <= 0 ? a.x : b.x, a.y + .05 * s); ctx.stroke();

function drawRaft() {

function homeIcon(cx, cy) {

}
function soundIcon(cx, cy) {
  ctx.fillStyle = 'rgba(10,40,30,.4)'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx - 4, cy - 3); ctx.lineTo(cx + 1, cy - 8); ctx.lineTo(cx + 1, cy + 8); ctx.lineTo(cx - 4, cy + 3); ctx.lineTo(cx - 8, cy + 3); ctx.closePath(); ctx.fill();

  ctx.save(); if (shake > .3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  ctx.drawImage(sky(), 0, 0, W, HY + 40);
  drawWater();
  const all = banks.map(b => ({ z: b.z, f: () => drawBank(b) })).concat(objs.map(o => ({ z: o.z, f: () => drawObj(o) })));
  if (P) all.push({ z: PZ - .01, f: drawRaft });
  all.sort((a, b) => b.z - a.z).forEach(a => a.f());
